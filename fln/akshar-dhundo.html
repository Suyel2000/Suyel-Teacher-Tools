<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शब्द में अक्षर खोजो</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#2b2350;--card:#fff;--c1:#ff6b6b;--c2:#ffa94d;--c3:#51cf66;--c4:#339af0;--c5:#cc5de8;--c6:#fcc419}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Noto Sans Devanagari','Mukta','Nirmala UI',sans-serif;color:var(--ink);
background:linear-gradient(160deg,#ffeaa7 0%,#fab1d6 45%,#a5d8ff 100%);background-color:#ffe3a3;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:0;opacity:.35;pointer-events:none}
body:before{width:38vmin;height:38vmin;background:#fff;top:-10vmin;left:-8vmin}
body:after{width:50vmin;height:50vmin;background:#b2f2bb;bottom:-18vmin;right:-12vmin}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vh,22px);min-height:100vh}
.tabs{width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.tab{font:inherit;font-weight:800;font-size:clamp(1rem,3.4vw,1.5rem);border:0;border-radius:99px;padding:2px 16px 6px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12);touch-action:manipulation}
.tab.on{background:var(--c5);color:#fff;transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.fs{margin-left:auto;font-size:1.1rem;width:38px;height:38px;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:clamp(1rem,3.2vw,1.6rem)}
.pill{background:#fff;border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.bar{width:100%;height:14px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c6),var(--c2));border-radius:99px;transition:width .5s}
.wordcard{background:#fff;border-radius:36px;padding:clamp(14px,4vw,40px) clamp(18px,5vw,56px) clamp(8px,2vw,20px);box-shadow:0 10px 0 rgba(0,0,0,.08),0 18px 36px rgba(80,40,120,.15);border:5px solid var(--c6);max-width:100%;text-align:center}
#word{white-space:nowrap;font-weight:800;font-size:min(10rem,calc(84vw / (var(--n) * .78)));line-height:1.5;color:var(--ink)}
.t{display:inline-block;cursor:pointer;border-radius:12px;transition:color .2s;touch-action:manipulation}
.t:hover{color:var(--c5)}
.t.ok{color:#2f9e44;text-shadow:0 0 22px #ffe066;animation:win .7s}
.t.no{animation:shake .45s;color:#e8590c}
.t.done{cursor:default}
.ask{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:800;font-size:clamp(1.3rem,4.5vw,2.4rem)}
.ask b{background:var(--c1);color:#fff;border-radius:22px;padding:0 22px 6px;font-size:clamp(3rem,11vw,5.5rem);line-height:1.3;box-shadow:0 7px 0 rgba(0,0,0,.18);animation:pop .6s}
.chip{background:var(--c4);color:#fff;border-radius:99px;padding:2px 16px;font-size:clamp(1rem,3vw,1.5rem)}
#msg{min-height:2.4em;font-size:clamp(1.6rem,6vw,3rem);font-weight:800;text-align:center}
.msg-ok{color:#2b8a3e}.msg-no{color:#e8590c}
.btns{display:flex;gap:clamp(8px,2vw,18px);flex-wrap:wrap;justify-content:center}
.b{font:inherit;font-weight:800;font-size:clamp(1.2rem,4vw,2rem);border:0;border-radius:99px;padding:6px 28px 10px;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2);touch-action:manipulation}
.b:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.b1{background:var(--c4)}.b2{background:var(--c3)}.b3{background:var(--c2)}
.b[disabled]{opacity:.35;cursor:default}
.panel{background:#fff;border-radius:36px;padding:clamp(20px,5vw,50px);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.08);margin-top:6vh;display:flex;flex-direction:column;gap:14px;align-items:center}
.panel h1{margin:0;font-size:clamp(2.2rem,9vw,4.5rem)}
.panel p{margin:0;font-size:clamp(1.4rem,5vw,2.4rem);font-weight:700}
.big{font-size:clamp(3rem,13vw,6rem)!important;color:var(--c1);font-weight:800!important}
.cf{position:fixed;top:-20px;z-index:9;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes win{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95) rotate(5deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LV=[
"घर फल जल बस नल कप वन मन तन कल रस रथ डर दल हल पल धन जन सेब कमल कलम गमला मटर बादल पतंग साबुन गुलाब किताब बस्ता चम्मच",
"पेंसिल गिलास बोतल प्लेट कटोरी बाल्टी तौलिया कंघी चप्पल छाता जुराब पैंट कंबल तकिया खिड़की दरवाज़ा मेज़ कुर्सी डिब्बा बगीचा मकान कमीज़ खिलौना तितली खरगोश तरबूज परिवार बरसात जहाज़ नारियल",
"मगरमच्छ मधुमक्खी इंद्रधनुष विद्यालय पुस्तकालय खिलौनेघर जन्मदिन रंगबिरंगा फूलदान पानीबोतल रसोईघर भोजनालय समाचारपत्र दूरबीन टेलीविजन कंप्यूटर मोबाइल घड़ीसाज़ चित्रकारी कहानीकार अध्यापक विद्यार्थी पर्यावरण स्वतंत्रता गणतंत्र दीपावली दशहरा पतझड़ पहाड़ियाँ समुद्रतट"
].map(s=>s.split(/\s+/));
const flat=LV.flat();
if(new Set(flat).size!==90||LV.some(l=>l.length!==30))console.warn('Word list problem');

const Cc='\\u0915-\\u0939\\u0958-\\u095F',Mt='[\\u0900-\\u0903\\u093A-\\u094C\\u094E\\u0955-\\u0957\\u0962\\u0963]';
const RX=new RegExp(`(?:[${Cc}]\\u093C?\\u094D)*[${Cc}]\\u093C?${Mt}*|[\\u0904-\\u0914]${Mt}*|[\\s\\S]`,'gu');
const split=w=>(w.normalize('NFC').match(RX)||[]).filter(x=>x!=='\u200d'&&x!=='\u094d');

function build(li,w,i){
  const p=split(w),cnt={};p.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const ix=p.map((_,k)=>k);
  let cand=[];
  if(li===2&&i%2===0)cand=ix.filter(k=>cnt[p[k]]>1);
  if(!cand.length)cand=ix.filter(k=>cnt[p[k]]===1);
  if(!cand.length)cand=ix;
  const pos=(i+li)%3;
  let k=pos===0?cand[0]:pos===2?cand[cand.length-1]:cand.reduce((a,b)=>Math.abs(b-(p.length-1)/2)<Math.abs(a-(p.length-1)/2)?b:a);
  const t=p[k];
  return{w,p,t,idx:ix.filter(j=>p[j]===t)};
}
const Q=LV.map((l,li)=>l.map((w,i)=>build(li,w,i)));
const COL=['#ff6b6b','#ff922b','#20c997','#339af0','#cc5de8','#f06595','#5c7cfa','#12b886'];
const sc=[0,0,0],prog=[0,0,0];let L=0,q=0,found=new Set(),wrong=false,done=false;
const $=s=>document.querySelector(s),app=$('#app');
function say(txt){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='hi-IN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function confetti(){const e=['⭐','🎉','✨','🌟','🎈'],c=['#ff6b6b','#fcc419','#51cf66','#339af0','#cc5de8'];
 for(let i=0;i<28;i++){const d=document.createElement('div');d.className='cf';d.textContent=i%3?'':e[i%5];
  if(i%3){d.style.cssText=`width:12px;height:12px;border-radius:3px;background:${c[i%5]}`}
  d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.4+'s';d.style.fontSize='1.8rem';
  document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}

function head(){
  const full=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  return `<div class="tabs">${[0,1,2].map(i=>`<button class="tab${i===L?' on':''}" data-l="${i}">${['🌱','🌿','🌳'][i]} स्तर ${i+1}</button>`).join('')}${full?'<button class="fs" id="fs" title="पूरी स्क्रीन" aria-label="पूरी स्क्रीन">⛶</button>':''}</div>`;
}
function wire(){
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{L=+b.dataset.l;show()});
  const f=$('#fs');if(f)f.onclick=()=>{try{const d=document,e=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
    else(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}};
}
function show(){
  if(prog[L]>=30)return levelEnd();
  q=prog[L];
  const d=Q[L][q],multi=d.idx.length>1;
  found=new Set();wrong=false;done=false;
  app.innerHTML=head()+`
  <div class="top"><span class="pill">प्रश्न ${q+1} / 30</span><span class="pill" id="sc">सही: ${sc[L]}</span></div>
  <div class="bar"><i style="width:${q/30*100}%"></i></div>
  <div class="wordcard"><div id="word" style="--n:${d.p.length}">${d.p.map((x,k)=>`<span class="t" data-k="${k}">${x}</span>`).join('')}</div></div>
  <div class="ask"><span>🔎 ${multi?'सभी अक्षर खोजो':'यह अक्षर खोजो'}:</span><b>${d.t}</b>${multi?`<span class="chip" id="cnt">0 / ${d.idx.length}</span>`:''}</div>
  <div id="msg"></div>
  <div class="btns"><button class="b b1" id="bs">🔊 सुनो</button><button class="b b2" id="bn" disabled>🎯 अगला</button><button class="b b3" id="br">↺ फिर से</button></div>`;
  wire();
  $('#word').onclick=e=>{const b=e.target.closest('.t');if(b)pick(b)};
  $('#bs').onclick=()=>say(d.t+'. '+d.w);
  $('#bn').onclick=show;
  $('#br').onclick=()=>{sc[L]=0;prog[L]=0;show()};
}
function pick(b){
  if(done||b.classList.contains('ok'))return;
  const d=Q[L][q],k=+b.dataset.k,m=$('#msg');
  if(d.p[k]===d.t){
    b.classList.add('ok');found.add(k);
    const c=$('#cnt');if(c)c.textContent=found.size+' / '+d.idx.length;
    if(found.size===d.idx.length){
      done=true;if(!wrong)sc[L]++;prog[L]=q+1;
      document.querySelectorAll('.t').forEach(x=>x.classList.add('done'));
      m.className='msg-ok';m.textContent='बहुत बढ़िया! 🎉';
      $('.bar i').style.width=(q+1)/30*100+'%';$('#sc').textContent='सही: '+sc[L];
      $('#bn').disabled=false;confetti();say(d.w);
    }else{m.className='msg-ok';m.textContent='वाह! और खोजो ✨'}
  }else{
    wrong=true;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');
    setTimeout(()=>b.classList.remove('no'),500);
    m.className='msg-no';m.textContent='फिर से सोचो 🤔';
  }
}
function levelEnd(){
  if(prog.every(x=>x>=30))return final();
  const nx=[1,2,0].map(o=>(L+o)%3).find(i=>prog[i]<30);
  app.innerHTML=head()+`<div class="panel"><h1>🎉 स्तर पूरा!</h1><p>स्तर ${L+1}</p><p class="big">${sc[L]} / 30</p>
  <button class="b b2" id="nl">➡️ अगला स्तर</button></div>`;confetti();wire();
  $('#nl').onclick=()=>{L=nx;show()};
}
function final(){
  const t=sc[0]+sc[1]+sc[2];
  app.innerHTML=head()+`<div class="panel"><h1>🏆 शानदार!</h1><p>आपने सभी 90 शब्द पूरे कर लिए!</p>
  <p>स्तर 1: ${sc[0]}/30</p><p>स्तर 2: ${sc[1]}/30</p><p>स्तर 3: ${sc[2]}/30</p>
  <p class="big">कुल: ${t}/90</p><button class="b b3" id="pa">🔄 फिर से खेलें</button></div>`;
  confetti();setTimeout(confetti,700);wire();
  $('#pa').onclick=()=>{for(let i=0;i<3;i++){sc[i]=0;prog[i]=0}L=0;show()};
}
show();
</script>
</body>
</html>
