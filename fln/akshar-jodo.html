<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>अक्षर जोड़ो</title>
<style>
:root{--bg:#fff8ec;--ink:#3b2f4a;--card:#fff;--line:#e9dcc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2336;--ink:#fff3e0;--card:#3a3149;--line:#5a4d70}}
:root[data-theme="dark"]{--bg:#2a2336;--ink:#fff3e0;--card:#3a3149;--line:#5a4d70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta","Nirmala UI","Mangal",sans-serif;min-height:100vh;display:flex;justify-content:center;user-select:none;touch-action:manipulation}
.app{width:100%;max-width:900px;padding:14px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.top{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:clamp(16px,2.6vw,22px);font-weight:700}
.title{color:#e0529c}.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.bar{width:100%;height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f43,#ee5a9b,#6c5ce7);transition:width .4s}
.pic{width:clamp(130px,26vw,200px);height:clamp(130px,26vw,200px);background:var(--card);border:4px solid #ffd166;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,14vw,110px);box-shadow:0 8px 0 #ffd166;animation:pop .5s}
.hint{font-size:clamp(15px,2.4vw,20px);opacity:.8;min-height:1.4em;text-align:center}
.slots{display:flex;gap:clamp(8px,2vw,16px);flex-wrap:wrap;justify-content:center;padding:18px;width:100%;background:var(--card);border:3px dashed var(--line);border-radius:30px;min-height:clamp(120px,22vw,160px)}
.slot{width:clamp(70px,16vw,120px);height:clamp(84px,18vw,130px);border:3px dashed #b9a98a;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,209,102,.12);transition:.15s}
.slot.over{background:rgba(108,92,231,.2);border-color:#6c5ce7;transform:scale(1.06)}
.tray{display:flex;gap:clamp(8px,2vw,16px);flex-wrap:wrap;justify-content:center;min-height:clamp(84px,18vw,130px);width:100%;padding:6px}
.card{width:clamp(70px,16vw,120px);height:clamp(84px,18vw,130px);border-radius:22px;color:#fff;font-size:clamp(34px,7.5vw,60px);font-weight:700;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s;line-height:1;animation:pop .35s}
.card:active,.card.drag{transform:scale(1.12) rotate(-3deg);box-shadow:0 12px 18px rgba(0,0,0,.25)}
.card.ghost{position:fixed;z-index:50;pointer-events:none;margin:0}
.card.hold{opacity:.25}
.c0{background:#ff6b6b}.c1{background:#ff9f43;}.c2{background:#10ac84}.c3{background:#2e86de}.c4{background:#8e44ad}.c5{background:#e0529c}
.msg{font-size:clamp(22px,4.5vw,36px);font-weight:800;min-height:1.4em;text-align:center}
.ok{color:#10ac84}.no{color:#e17055}
.slots.good{border-color:#10ac84;border-style:solid;background:rgba(16,172,132,.1)}
.slots.bad{animation:shake .4s}
.big{font-size:clamp(50px,11vw,96px);font-weight:800;color:#10ac84;letter-spacing:.04em;animation:pop .5s}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;font-size:clamp(18px,3vw,26px);border:0;border-radius:22px;padding:12px 26px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);min-height:56px}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ics{display:flex;gap:8px}.ic{width:46px;height:46px;min-height:0;padding:0;font-size:22px;border-radius:50%;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}.b1{background:#6c5ce7}.b2{background:#ee5a9b}.b3{background:#ff9f43}button:disabled{opacity:.35;pointer-events:none}
.end{text-align:center;display:none;flex-direction:column;align-items:center;gap:18px;padding:40px 0}
.end .t{font-size:clamp(28px,6vw,48px);font-weight:800}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:60}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
</style></head><body>
<div class="app" id="app">
 <div id="game" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
  <div class="top"><span class="title">🧩 अक्षर जोड़ो</span><span class="pill" id="prog"></span><span class="pill" id="score"></span><span class="ics"><button class="ic" id="bShuf" title="प्रश्न मिलाओ" aria-label="प्रश्न मिलाओ">🔀</button><button class="ic" id="bMute" title="आवाज़" aria-label="आवाज़ बंद/चालू">🔊</button><button class="ic" id="bFull" title="पूरी स्क्रीन" aria-label="पूरी स्क्रीन">⛶</button></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pic" id="pic"></div>
  <div class="hint" id="hint">चित्र देखो… सोचो… फिर अक्षर जोड़ो</div>
  <div class="slots" id="slots"></div>
  <div class="msg" id="msg"></div>
  <div class="tray" id="tray"></div>
  <div class="btns"><button class="b2" id="bHear">🔊 सुनो</button><button class="b3" id="bReset">↺ फिर से</button><button class="b1" id="bNext" disabled>🎯 अगला</button></div>
 </div>
 <div class="end" id="end"><div class="t">🎉 बहुत बढ़िया! आपने सभी शब्द बनाए।</div><div class="pill" id="fin"></div><button class="b1" id="again">🔄 फिर से खेलें</button></div>
</div>
<script>
// [emoji, [अक्षर cards in order]]
const L1=[["🏠",["घ","र"]],["🍎",["फ","ल"]],["💧",["ज","ल"]],["🌳",["व","न"]],["🚌",["ब","स"]],["☕",["क","प"]],["🚰",["न","ल"]],["🐎🛞",["र","थ"]],["🤏",["क","म"]],["😱",["ड","र"]]];
const L2=[["🪷",["क","म","ल"]],["🪴",["ग","म","ला"]],["🖊️",["क","ल","म"]],["🫛",["म","ट","र"]],["🍚",["चा","व","ल"]],["🧼",["सा","बु","न"]],["☁️",["बा","द","ल"]],["🪁",["प","तं","ग"]],["🦁🌴",["जं","ग","ल"]],["🥄",["चम्","मच"]]];
const L3=[["🐰",["ख","र","गो","श"]],["🍉",["त","र","बू","ज"]],["🥛",["गि","ला","स"]],["✏️",["पें","सि","ल"]],["🦋",["ति","त","ली"]],["🌹",["गु","ला","ब"]],["🏫",["स्कू","ल"]],["🧸",["खि","लौ","ना"]],["👨‍👩‍👧‍👦",["प","रि","वा","र"]],["🌧️",["ब","र","सा","त"]]];
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,i,score,slots,cards,solved;
function start(){Q=[...shuf(L1),...shuf(L2),...shuf(L3)];i=0;score=0;$('game').style.display='flex';$('end').style.display='none';load()}
function load(){
 const [pic,parts]=Q[i];solved=false;
 cards=shuf(parts.map((t,k)=>({id:k,t,c:'c'+(k%6)})));
 if(parts.length>1)while(cards.every((c,k)=>c.id===k))cards=shuf(cards);
 slots=parts.map(()=>null);
 $('pic').textContent=pic;$('pic').style.animation='none';void $('pic').offsetWidth;$('pic').style.animation='';
 $('hint').textContent='चित्र देखो… सोचो… फिर अक्षर जोड़ो';
 $('prog').textContent='प्रश्न '+(i+1)+' / '+Q.length;$('score').textContent='सही: '+score;
 $('bar').style.width=(i/Q.length*100)+'%';$('msg').textContent='';$('msg').className='msg';
 $('bNext').disabled=true;$('bHear').disabled=true;render()}
function word(){return Q[i][1].join('')}
function render(){
 const S=$('slots'),T=$('tray');S.className='slots';S.innerHTML='';T.innerHTML='';
 if(solved){S.className='slots good';S.innerHTML='<div class="big">'+word()+'</div>';return}
 slots.forEach((cid,k)=>{const d=document.createElement('div');d.className='slot';d.dataset.slot=k;
  if(cid!==null)d.appendChild(mk(cards.find(c=>c.id===cid),'s'));S.appendChild(d)});
 cards.filter(c=>!slots.includes(c.id)).forEach(c=>T.appendChild(mk(c,'t')))}
function mk(c,from){const e=document.createElement('div');e.className='card '+c.c;e.textContent=c.t;e.dataset.id=c.id;e.dataset.from=from;e.onpointerdown=ev=>down(ev,e,c);return e}
// drag + tap
function down(ev,el,c){
 if(solved)return;ev.preventDefault();
 const r=el.getBoundingClientRect(),dx=ev.clientX-r.left,dy=ev.clientY-r.top,sx=ev.clientX,sy=ev.clientY;
 let g=null,over=null;
 const mv=e=>{
  if(!g&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){g=el.cloneNode(true);g.classList.add('ghost','drag');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);el.classList.add('hold')}
  if(g){g.style.left=(e.clientX-dx)+'px';g.style.top=(e.clientY-dy)+'px';
   const t=at(e);if(over)over.classList.remove('over');over=t&&t.dataset.slot!==undefined?t:null;if(over)over.classList.add('over')}};
 const up=e=>{
  removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(over)over.classList.remove('over');
  if(g){g.remove();const t=at(e);
   if(t&&t.dataset.slot!==undefined)put(c.id,+t.dataset.slot);
   else if(el.dataset.from==='s')unplace(c.id);
   render()}
  else{ // tap
   if(el.dataset.from==='t'){const k=slots.indexOf(null);if(k>-1)put(c.id,k)}else unplace(c.id);}
  check()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function at(e){const els=document.elementsFromPoint(e.clientX,e.clientY);return els.find(x=>x.classList&&x.classList.contains('slot'))||null}
function unplace(id){const k=slots.indexOf(id);if(k>-1)slots[k]=null}
function put(id,k){const from=slots.indexOf(id);const occ=slots[k];unplace(id);slots[k]=id;if(occ!==null&&occ!==id){if(from>-1)slots[from]=occ}}
function check(){
 if(solved)return;render();
 $('msg').textContent='';$('msg').className='msg';
 if(slots.includes(null))return;
 const w=slots.map(id=>cards.find(c=>c.id===id).t).join('');
 if(w===word()){solved=true;score++;$('score').textContent='सही: '+score;
  $('msg').textContent='बहुत बढ़िया! 🎉';$('msg').className='msg ok';
  $('hint').textContent='अक्षर + अक्षर → शब्द';
  $('bNext').disabled=false;$('bHear').disabled=false;render();speak();confetti()}
 else{$('msg').textContent='फिर से जोड़ो 🤔';$('msg').className='msg no';
  const S=$('slots');S.classList.add('bad');setTimeout(()=>S.classList.remove('bad'),450)}}
let muted=false;
function speak(){if(muted)return;try{const u=new SpeechSynthesisUtterance(word());u.lang='hi-IN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function confetti(){const em=['🎉','⭐','✨','🌈','🎈'];for(let k=0;k<14;k++){const s=document.createElement('span');s.className='conf';s.textContent=em[k%5];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
$('bHear').onclick=()=>{if(solved)speak()};
$('bReset').onclick=()=>{if(!solved){slots=slots.map(()=>null);$('msg').textContent='';render()}else{solved=false;slots=slots.map(()=>null);$('bNext').disabled=true;$('bHear').disabled=true;$('msg').textContent='';render()}};
$('bNext').onclick=()=>{if(i<Q.length-1){i++;load()}else{$('game').style.display='none';$('end').style.display='flex';$('fin').textContent='सही: '+score+' / '+Q.length;confetti()}};
$('again').onclick=start;
$('bShuf').onclick=()=>{
 const from=solved?i+1:i;
 for(let a=0;a<30;a+=10){const lo=Math.max(a,from),hi=a+10;if(hi-lo>1){const part=shuf(Q.slice(lo,hi));Q.splice(lo,hi-lo,...part)}}
 if(solved){$('hint').textContent='आगे के प्रश्न मिला दिए 🔀'}else load()};
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊';if(muted)try{speechSynthesis.cancel()}catch(e){}};
$('bFull').onclick=()=>{try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(x){}};
start();
</script></body></html>
