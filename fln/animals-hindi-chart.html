<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पशु | Animals – Digital Classroom Hub</title>
<style>
  :root {
    --page: #F2F8FD;
    --ink: #1F3A5F;
    --ink-soft: #4A5F7A;
    --radius: 26px;
    --flip: .6s;
    --font: "Mukta", "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", "Mangal",
            system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --c1-bg:#DDF3E4; --c1-bd:#A9DDBA;
    --c2-bg:#FFF1BF; --c2-bd:#F2D876;
    --c3-bg:#FFE0D2; --c3-bd:#F5B99C;
    --c4-bg:#E8E0FA; --c4-bd:#C6B6EE;
    --c5-bg:#D8ECFA; --c5-bd:#9DCBEE;
    --c6-bg:#FADCE6; --c6-bd:#F0AFC5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: clamp(14px, 3vw, 28px) 64px clamp(6px, 1.5vw, 14px);
    text-align: center;
  }
  h1 {
    margin: 0;
    display: inline-block;
    font-size: clamp(1.7rem, 4.5vw, 2.6rem);
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: .01em;
  }
  h1 .sep { color: #9DB2CC; font-weight: 400; margin: 0 .35em; }
  h1 .en  { font-weight: 700; color: var(--ink-soft); }

  /* Fullscreen icon */
  .fs {
    position: absolute;
    top: clamp(12px, 2.4vw, 24px);
    right: clamp(12px, 2.4vw, 24px);
    width: 44px;
    height: 44px;
    padding: 0;
    display: none;                 /* shown by script only if fullscreen is supported */
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: #fff;
    border: 2px solid #D5E2F0;
    border-radius: 14px;
    box-shadow: 0 3px 8px rgba(31, 58, 95, .10);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .fs.on { display: inline-flex; }
  .fs:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
  .fs svg { width: 22px; height: 22px; }
  .fs .i-exit { display: none; }
  .fs[aria-pressed="true"] .i-enter { display: none; }
  .fs[aria-pressed="true"] .i-exit  { display: block; }

  /* ---------- Grid ---------- */
  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 10px clamp(12px, 2.5vw, 28px) 40px;
  }
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: clamp(12px, 2vw, 22px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 600px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 900px)  { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  /* ---------- Flip card (always square) ---------- */
  .grid > li {
    perspective: 1100px;
    container-type: inline-size;
    transition: transform .18s ease;
  }
  li:nth-child(6n+1) { --bg: var(--c1-bg); --bd: var(--c1-bd); }
  li:nth-child(6n+2) { --bg: var(--c2-bg); --bd: var(--c2-bd); }
  li:nth-child(6n+3) { --bg: var(--c3-bg); --bd: var(--c3-bd); }
  li:nth-child(6n+4) { --bg: var(--c4-bg); --bd: var(--c4-bd); }
  li:nth-child(6n+5) { --bg: var(--c5-bg); --bd: var(--c5-bd); }
  li:nth-child(6n+6) { --bg: var(--c6-bg); --bd: var(--c6-bd); }

  .card {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .card:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .inner {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip) cubic-bezier(.4, .15, .25, 1);
    border-radius: var(--radius);
    box-shadow: 0 6px 16px rgba(31, 58, 95, .12);
  }
  .card[aria-expanded="true"] .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: block;
    background: var(--bg);
    border: 3px solid var(--bd);
    border-radius: var(--radius);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    overflow: hidden;
  }

  /* Front: picture */
  .front { padding: clamp(8px, 4cqw, 14px); }
  .pic {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: calc(var(--radius) - 10px);
    overflow: hidden;
  }
  .pic img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 6%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pic .ph {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(3.5rem, 11vw, 5.5rem);
    background: repeating-linear-gradient(45deg, #fff, #fff 14px, #F6F9FC 14px, #F6F9FC 28px);
  }
  .pic.noimg img { display: none; }
  .pic.noimg .ph { display: flex; }

  /* Back: names */
  .back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .15em;
    padding: 8px;
    text-align: center;
    border-color: var(--ink);
  }
  .hi {
    display: block;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    font-size: 21cqw;
    font-weight: 800;
    line-height: 1.3;
    color: var(--ink);
  }
  .en-name {
    display: block;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    font-size: 12cqw;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink-soft);
  }

  @media (hover: hover) {
    .grid > li:hover { transform: translateY(-3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .inner, .grid > li { transition: none !important; }
    .grid > li:hover { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🐾 पशु<span class="sep">|</span><span class="en">Animals</span></h1>

  <button type="button" class="fs" id="fs" aria-pressed="false"
          aria-label="पूरी स्क्रीन / Full screen" title="पूरी स्क्रीन / Full screen">
    <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
    <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </svg>
  </button>
</header>

<main>
  <ul class="grid" id="grid"></ul>
</main>

<script>
(function () {
  "use strict";

  // hi: Hindi name, en: English name, file: image in ../images/, emoji: placeholder if image is missing
  var ANIMALS = [
    { hi: "कुत्ता",   en: "Dog",       file: "dog",       emoji: "🐶" },
    { hi: "बिल्ली",   en: "Cat",       file: "cat",       emoji: "🐱" },
    { hi: "गाय",      en: "Cow",       file: "cow",       emoji: "🐄" },
    { hi: "भैंस",     en: "Buffalo",   file: "buffalo",   emoji: "🐃" },
    { hi: "बकरी",     en: "Goat",      file: "goat",      emoji: "🐐" },
    { hi: "घोड़ा",    en: "Horse",     file: "horse",     emoji: "🐴" },
    { hi: "गधा",      en: "Donkey",    file: "donkey",    emoji: "🐾" },
    { hi: "भेड़",     en: "Sheep",     file: "sheep",     emoji: "🐑" },
    { hi: "सूअर",     en: "Pig",       file: "pig",       emoji: "🐖" },
    { hi: "खरगोश",    en: "Rabbit",    file: "rabbit",    emoji: "🐰" },
    { hi: "ऊँट",      en: "Camel",     file: "camel",     emoji: "🐪" },
    { hi: "हाथी",     en: "Elephant",  file: "elephant",  emoji: "🐘" },
    { hi: "शेर",      en: "Lion",      file: "lion",      emoji: "🦁" },
    { hi: "बाघ",      en: "Tiger",     file: "tiger",     emoji: "🐯" },
    { hi: "हिरण",     en: "Deer",      file: "deer",      emoji: "🦌" },
    { hi: "बंदर",     en: "Monkey",    file: "monkey",    emoji: "🐒" },
    { hi: "भालू",     en: "Bear",      file: "bear",      emoji: "🐻" },
    { hi: "लोमड़ी",   en: "Fox",       file: "fox",       emoji: "🦊" },
    { hi: "जिराफ़",   en: "Giraffe",   file: "giraffe",   emoji: "🦒" },
    { hi: "ज़ेब्रा",  en: "Zebra",     file: "zebra",     emoji: "🦓" },
    { hi: "कंगारू",   en: "Kangaroo",  file: "kangaroo",  emoji: "🦘" },
    { hi: "पांडा",    en: "Panda",     file: "panda",     emoji: "🐼" },
    { hi: "नीलगाय",   en: "Nilgai",    file: "nilgai",    emoji: "🐾" },
    { hi: "सियार",    en: "Jackal",    file: "jackal",    emoji: "🐾" },
    { hi: "गिलहरी",   en: "Squirrel",  file: "squirrel",  emoji: "🐿️" }
  ];

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  var grid = document.getElementById("grid");
  var frag = document.createDocumentFragment();

  ANIMALS.forEach(function (a) {
    var li    = el("li");
    var btn   = el("button", "card");
    var inner = el("span", "inner");
    var front = el("span", "face front");
    var back  = el("span", "face back");
    var pic   = el("span", "pic");
    var img   = el("img");
    var ph    = el("span", "ph");
    var hi    = el("span", "hi");
    var en    = el("span", "en-name");

    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");

    img.alt = a.hi + " (" + a.en + ") का चित्र";
    img.loading = "lazy";
    img.decoding = "async";
    img.draggable = false;
    // Attach the error handler before setting src so a missing file is always caught
    img.addEventListener("error", function () { pic.classList.add("noimg"); });
    img.src = "../images/" + a.file + ".png";

    ph.setAttribute("aria-hidden", "true");
    ph.textContent = a.emoji;

    hi.lang = "hi";
    hi.textContent = a.hi;
    en.lang = "en";
    en.textContent = a.en;

    back.setAttribute("aria-hidden", "true");

    pic.appendChild(img);
    pic.appendChild(ph);
    front.appendChild(pic);
    back.appendChild(hi);
    back.appendChild(en);
    inner.appendChild(front);
    inner.appendChild(back);
    btn.appendChild(inner);
    li.appendChild(btn);
    frag.appendChild(li);

    // First tap: flip to the name. Second tap: flip back to the picture.
    btn.addEventListener("click", function () {
      var open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      front.setAttribute("aria-hidden", open ? "false" : "true");
      back.setAttribute("aria-hidden", open ? "true" : "false");
    });
  });

  grid.appendChild(frag);

  /* ---------- Full screen ---------- */
  var fsBtn = document.getElementById("fs");
  var root  = document.documentElement;

  var canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if (canFs) fsBtn.classList.add("on");

  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFs() {
    fsBtn.setAttribute("aria-pressed", isFs() ? "true" : "false");
  }

  fsBtn.addEventListener("click", function () {
    try {
      if (isFs()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      }
    } catch (e) { /* fullscreen blocked (e.g. inside an iframe without permission) */ }
  });
  document.addEventListener("fullscreenchange", syncFs);
  document.addEventListener("webkitfullscreenchange", syncFs);
})();
</script>
</body>
</html>
