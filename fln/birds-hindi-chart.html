<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पक्षी | Birds – Digital Classroom Hub</title>
<style>
  :root {
    --page: #F2F8FD;
    --ink: #1F3A5F;
    --ink-soft: #4A5F7A;
    --radius: 26px;
    --flip: .6s;
    --font: "Mukta", "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", "Mangal",
            system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --c1-bg:#DDF3E4; --c1-bd:#A9DDBA;
    --c2-bg:#FFF1BF; --c2-bd:#F2D876;
    --c3-bg:#FFE0D2; --c3-bd:#F5B99C;
    --c4-bg:#E8E0FA; --c4-bd:#C6B6EE;
    --c5-bg:#D8ECFA; --c5-bd:#9DCBEE;
    --c6-bg:#FADCE6; --c6-bd:#F0AFC5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: clamp(14px, 3vw, 28px) 64px clamp(6px, 1.5vw, 14px);
    text-align: center;
  }
  h1 {
    margin: 0;
    display: inline-block;
    font-size: clamp(1.7rem, 4.5vw, 2.6rem);
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: .01em;
  }
  h1 .sep { color: #9DB2CC; font-weight: 400; margin: 0 .35em; }
  h1 .en  { font-weight: 700; color: var(--ink-soft); }

  /* Fullscreen icon */
  .fs {
    position: absolute;
    top: clamp(12px, 2.4vw, 24px);
    right: clamp(12px, 2.4vw, 24px);
    width: 44px;
    height: 44px;
    padding: 0;
    display: none;                 /* shown by script only if fullscreen is supported */
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: #fff;
    border: 2px solid #D5E2F0;
    border-radius: 14px;
    box-shadow: 0 3px 8px rgba(31, 58, 95, .10);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .fs.on { display: inline-flex; }
  .fs:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
  .fs svg { width: 22px; height: 22px; }
  .fs .i-exit { display: none; }
  .fs[aria-pressed="true"] .i-enter { display: none; }
  .fs[aria-pressed="true"] .i-exit  { display: block; }

  /* ---------- Grid ---------- */
  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 10px clamp(12px, 2.5vw, 28px) 40px;
  }
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: clamp(12px, 2vw, 22px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 600px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 900px)  { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  /* ---------- Flip card (always square) ---------- */
  .grid > li {
    perspective: 1100px;
    container-type: inline-size;
    transition: transform .18s ease;
  }
  li:nth-child(6n+1) { --bg: var(--c1-bg); --bd: var(--c1-bd); }
  li:nth-child(6n+2) { --bg: var(--c2-bg); --bd: var(--c2-bd); }
  li:nth-child(6n+3) { --bg: var(--c3-bg); --bd: var(--c3-bd); }
  li:nth-child(6n+4) { --bg: var(--c4-bg); --bd: var(--c4-bd); }
  li:nth-child(6n+5) { --bg: var(--c5-bg); --bd: var(--c5-bd); }
  li:nth-child(6n+6) { --bg: var(--c6-bg); --bd: var(--c6-bd); }

  .card {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .card:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .inner {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip) cubic-bezier(.4, .15, .25, 1);
    border-radius: var(--radius);
    box-shadow: 0 6px 16px rgba(31, 58, 95, .12);
  }
  .card[aria-expanded="true"] .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: block;
    background: #fff;
    border: 3px solid var(--bd);
    border-radius: var(--radius);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    overflow: hidden;
  }

  /* Front: picture */
  .front { padding: clamp(8px, 4cqw, 14px); }
  .pic {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: calc(var(--radius) - 10px);
    overflow: hidden;
  }
  .pic img {
    background: #fff;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 6%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pic .ph {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(3.5rem, 11vw, 5.5rem);
    background: repeating-linear-gradient(45deg, #fff, #fff 14px, #F6F9FC 14px, #F6F9FC 28px);
  }
  .pic.noimg img { display: none; }
  .pic.noimg .ph { display: flex; }

  /* Back: names */
  .back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .15em;
    padding: 8px;
    text-align: center;
    border-color: var(--ink);
  }
  .hi {
    display: block;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    font-size: 21cqw;
    font-weight: 800;
    line-height: 1.3;
    color: var(--ink);
  }
  .en-name {
    display: block;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    font-size: 12cqw;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink-soft);
  }

  @media (hover: hover) {
    .grid > li:hover { transform: translateY(-3px); }
  }


  /* ---------- Intro line ---------- */
  .intro {
    margin: 6px auto 0;
    max-width: 760px;
    font-size: clamp(1rem, 2.6vw, 1.3rem);
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .intro .en-line { display: block; font-size: .82em; font-weight: 600; color: #6B7F99; }

  /* ---------- Grid card hint ---------- */
  .card .inner { transform: none !important; }
  .card:active .inner { transform: scale(.96) !important; }

  /* ---------- Popup ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(31, 58, 95, .72);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn  { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .sheet {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: popIn .25s cubic-bezier(.2, .9, .3, 1.2);
  }
  .counter {
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .04em;
  }
  .big {
    --size: min(86vw, 52vh, 480px);
    width: var(--size);
    height: var(--size);
    perspective: 1400px;
    container-type: inline-size;
  }
  .big .card { width: 100%; height: 100%; }
  .big .inner { transition: transform var(--flip) cubic-bezier(.4, .15, .25, 1); box-shadow: 0 14px 40px rgba(0, 0, 0, .35); }
  .big .card .inner { transform: none !important; }
  .big.flipped .card .inner { transform: rotateY(180deg) !important; }
  .big.noanim .inner { transition: none; }
  .big .pic .ph { font-size: clamp(6rem, 40cqw, 12rem); }

  .controls {
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }
  .ctl {
    flex: 1 1 0;
    max-width: 170px;
    min-height: 56px;
    padding: 8px 10px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    line-height: 1.2;
    color: var(--ink);
    background: #fff;
    border: 3px solid #fff;
    border-radius: 18px;
    box-shadow: 0 5px 14px rgba(0, 0, 0, .25);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .ctl small { font-size: .72rem; font-weight: 600; color: var(--ink-soft); }
  .ctl.flip { background: #FFD65C; }
  .ctl.rand { background: #BFE8FF; }
  .controls { flex-wrap: wrap; }
  .ctl { flex: 1 1 calc(25% - 10px); min-width: 0; font-size: .95rem; }
  @media (max-width: 420px) { .ctl { flex-basis: calc(50% - 10px); max-width: none; } }
  .ctl:active { transform: scale(.95); }
  .ctl:focus-visible, .close:focus-visible { outline: 4px solid #FFD65C; outline-offset: 3px; }

  .close {
    position: absolute;
    top: clamp(10px, 2.4vw, 22px);
    right: clamp(10px, 2.4vw, 22px);
    width: 48px;
    height: 48px;
    padding: 0;
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    background: #fff;
    border: 0;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    cursor: pointer;
    touch-action: manipulation;
  }
  body.locked { overflow: hidden; }

  @media (max-height: 560px) and (orientation: landscape) {
    .big { --size: min(52vh, 70vw); }
    .sheet { gap: 8px; }
    .ctl { min-height: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .modal.open, .sheet { animation: none !important; }
    .inner, .grid > li { transition: none !important; }
    .grid > li:hover { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🐦 पक्षी<span class="sep">|</span><span class="en">Birds</span></h1>
  <p class="intro">चित्र को छुएँ, पलटें और पक्षियों के नाम हिंदी में सीखें।
    <span class="en-line">Tap a picture, flip it, and learn the names of birds in Hindi.</span></p>

  <button type="button" class="fs" id="fs" aria-pressed="false"
          aria-label="पूरी स्क्रीन / Full screen" title="पूरी स्क्रीन / Full screen">
    <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
    <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </svg>
  </button>
</header>

<main>
  <ul class="grid" id="grid"></ul>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="पक्षी का चित्र / Bird picture" hidden>
  <button type="button" class="close" id="close" aria-label="बंद करें / Close">&times;</button>
  <div class="sheet">
    <div class="counter" id="counter" aria-live="polite"></div>
    <div class="big" id="big" data-i="">
      <button type="button" class="card" id="bigCard" aria-label="पलटें / Flip">
        <span class="inner">
          <span class="face front"><span class="pic" id="bigPic"><img id="bigImg" alt=""><span class="ph" id="bigPh" aria-hidden="true"></span></span></span>
          <span class="face back"><span class="hi" id="bigHi" lang="hi"></span><span class="en-name" id="bigEn" lang="en"></span></span>
        </span>
      </button>
    </div>
    <div class="controls">
      <button type="button" class="ctl" id="prev">◀ पिछला<small>Previous</small></button>
      <button type="button" class="ctl flip" id="flip">🔄 पलटें<small>Flip</small></button>
      <button type="button" class="ctl rand" id="random">🎲 कोई भी<small>Random</small></button>
      <button type="button" class="ctl" id="next">अगला ▶<small>Next</small></button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // hi: Hindi name, en: English name, file: image in ../images/, emoji: placeholder if image is missing
  var ANIMALS = [
    { hi: "कबूतर", en: "Pigeon", file: "pigeon", emoji: "🕊️" },
    { hi: "कौआ", en: "Crow", file: "crow", emoji: "🐦‍⬛" },
    { hi: "गौरैया", en: "Sparrow", file: "sparrow", emoji: "🐦" },
    { hi: "तोता", en: "Parrot", file: "parrot", emoji: "🦜" },
    { hi: "मैना", en: "Myna", file: "myna", emoji: "🐦" },
    { hi: "कोयल", en: "Cuckoo", file: "cuckoo", emoji: "🐦" },
    { hi: "मोर", en: "Peacock", file: "peacock", emoji: "🦚" },
    { hi: "मुर्गा", en: "Rooster", file: "rooster", emoji: "🐓" },
    { hi: "मुर्गी", en: "Hen", file: "hen", emoji: "🐔" },
    { hi: "बत्तख", en: "Duck", file: "duck", emoji: "🦆" },
    { hi: "हंस", en: "Swan", file: "swan", emoji: "🦢" },
    { hi: "चील", en: "Kite", file: "kite", emoji: "🦅" },
    { hi: "बाज", en: "Hawk", file: "hawk", emoji: "🦅" },
    { hi: "उल्लू", en: "Owl", file: "owl", emoji: "🦉" },
    { hi: "गिद्ध", en: "Vulture", file: "vulture", emoji: "🦅" },
    { hi: "कठफोड़वा", en: "Woodpecker", file: "woodpecker", emoji: "🐦" },
    { hi: "किंगफिशर", en: "Kingfisher", file: "kingfisher", emoji: "🐦" },
    { hi: "बुलबुल", en: "Bulbul", file: "bulbul", emoji: "🐦" },
    { hi: "सारस", en: "Crane", file: "crane", emoji: "🐦" },
    { hi: "बगुला", en: "Heron", file: "heron", emoji: "🐦" },
    { hi: "जलमुर्गी", en: "Waterhen", file: "waterhen", emoji: "🐦" },
    { hi: "टिटिहरी", en: "Lapwing", file: "lapwing", emoji: "🐦" },
    { hi: "फ़ाख्ता", en: "Dove", file: "dove", emoji: "🕊️" },
    { hi: "पपीहा", en: "Pied Cuckoo", file: "pied-cuckoo", emoji: "🐦" },
    { hi: "शुतुरमुर्ग", en: "Ostrich", file: "ostrich", emoji: "🐦" }
  ];

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  var grid = document.getElementById("grid");
  var frag = document.createDocumentFragment();

  ANIMALS.forEach(function (a, idx) {
    var li    = el("li");
    var btn   = el("button", "card");
    var inner = el("span", "inner");
    var front = el("span", "face front");
    var pic   = el("span", "pic");
    var img   = el("img");
    var ph    = el("span", "ph");

    btn.type = "button";
    btn.setAttribute("aria-haspopup", "dialog");
    btn.setAttribute("aria-label", a.hi + " (" + a.en + ") – बड़ा करें / Enlarge");

    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.draggable = false;
    img.addEventListener("error", function () { pic.classList.add("noimg"); });
    img.src = "../images/" + a.file + ".png";

    ph.setAttribute("aria-hidden", "true");
    ph.textContent = a.emoji;

    pic.appendChild(img);
    pic.appendChild(ph);
    front.appendChild(pic);
    inner.appendChild(front);
    btn.appendChild(inner);
    li.appendChild(btn);
    frag.appendChild(li);

    btn.addEventListener("click", function () { openModal(idx, btn); });
  });

  grid.appendChild(frag);


  /* ---------- Popup: enlarge, previous, flip, next ---------- */
  var modal   = document.getElementById("modal");
  var big     = document.getElementById("big");
  var bigPic  = document.getElementById("bigPic");
  var bigImg  = document.getElementById("bigImg");
  var bigPh   = document.getElementById("bigPh");
  var bigHi   = document.getElementById("bigHi");
  var bigEn   = document.getElementById("bigEn");
  var counter = document.getElementById("counter");
  var current = 0, lastFocus = null;

  bigImg.addEventListener("error", function () { bigPic.classList.add("noimg"); });
  bigImg.addEventListener("load",  function () { bigPic.classList.remove("noimg"); });

  function show(i) {
    current = (i + ANIMALS.length) % ANIMALS.length;
    var a = ANIMALS[current];
    // reset to the picture side instantly (no spin) before swapping content
    big.classList.add("noanim");
    big.classList.remove("flipped");
    bigPic.classList.remove("noimg");
    bigImg.src = "../images/" + a.file + ".png";
    bigImg.alt = a.hi + " (" + a.en + ") का चित्र";
    bigPh.textContent = a.emoji;
    bigHi.textContent = a.hi;
    bigEn.textContent = a.en;
    counter.textContent = (current + 1) + " / " + ANIMALS.length;
    void big.offsetWidth;
    big.classList.remove("noanim");
  }
  function flip() { big.classList.toggle("flipped"); }

  function openModal(i, opener) {
    lastFocus = opener || null;
    modal.hidden = false;
    modal.classList.add("open");
    document.body.classList.add("locked");
    show(i);
    document.getElementById("flip").focus();
  }
  function closeModal() {
    modal.classList.remove("open");
    modal.hidden = true;
    document.body.classList.remove("locked");
    if (lastFocus) lastFocus.focus();
  }

  document.getElementById("prev").addEventListener("click", function () { show(current - 1); });
  document.getElementById("next").addEventListener("click", function () { show(current + 1); });
  document.getElementById("flip").addEventListener("click", flip);
  document.getElementById("random").addEventListener("click", function () {
    if (ANIMALS.length < 2) return;
    var r;
    do { r = Math.floor(Math.random() * ANIMALS.length); } while (r === current);
    show(r);
  });
  document.getElementById("bigCard").addEventListener("click", flip);
  document.getElementById("close").addEventListener("click", closeModal);

  // tap on the dark backdrop closes
  modal.addEventListener("click", function (e) {
    if (e.target === modal || e.target.classList.contains("sheet")) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (modal.hidden) return;
    if (e.key === "Escape")          { closeModal(); }
    else if (e.key === "ArrowLeft")  { show(current - 1); }
    else if (e.key === "ArrowRight") { show(current + 1); }
    else if (e.key === "Tab") {
      var f = modal.querySelectorAll("button");
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // swipe left/right on the big card
  var sx = null;
  big.addEventListener("touchstart", function (e) { sx = e.changedTouches[0].clientX; }, { passive: true });
  big.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 60) show(current + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* ---------- Full screen ---------- */
  var fsBtn = document.getElementById("fs");
  var root  = document.documentElement;

  var canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if (canFs) fsBtn.classList.add("on");

  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFs() {
    fsBtn.setAttribute("aria-pressed", isFs() ? "true" : "false");
  }

  fsBtn.addEventListener("click", function () {
    try {
      if (isFs()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      }
    } catch (e) { /* fullscreen blocked (e.g. inside an iframe without permission) */ }
  });
  document.addEventListener("fullscreenchange", syncFs);
  document.addEventListener("webkitfullscreenchange", syncFs);
})();
</script>
</body>
</html>
