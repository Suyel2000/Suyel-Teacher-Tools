<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>दो वर्ण वाले शब्द (Two-Letter Hindi Words)</title>
  <style>
    /* CSS RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .fln-badge {
      background-color: #2563eb;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* UI BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s ease-in-out;
      user-select: none;
      min-height: 48px;
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .btn:hover {
      background-color: #cbd5e1;
    }

    .btn:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-dark {
      background-color: #334155;
      color: #ffffff;
    }

    .btn-dark:hover {
      background-color: #1e293b;
    }

    .btn-outline {
      background-color: #ffffff;
      border: 2px solid #0f172a;
      color: #0f172a;
    }

    .btn-outline:hover {
      background-color: #0f172a;
      color: #ffffff;
    }

    .btn-active {
      background-color: #dc2626 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
    }

    .btn-icon-only {
      padding: 10px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    /* CATEGORY SELECTOR BAR */
    .category-bar-container {
      background-color: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-select-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-label {
      font-weight: 700;
      font-size: 1rem;
      color: #334155;
      white-space: nowrap;
    }

    select.category-dropdown {
      width: 100%;
      padding: 10px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border: 2px solid #0f172a;
      border-radius: 10px;
      background-color: #ffffff;
      color: #0f172a;
      cursor: pointer;
      outline: none;
    }

    select.category-dropdown:focus {
      border-color: #2563eb;
    }

    /* CATEGORY PILLS SCROLLABLE BAR */
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .pill-btn {
      padding: 6px 14px;
      background-color: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      border-color: #0f172a;
      color: #0f172a;
    }

    .pill-btn.active {
      background-color: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* TOOLBAR & CONTROLS */
    .toolbar {
      background-color: #ffffff;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-badge {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
      background-color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      padding: 24px 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* FLASH CARD GRID MODE */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }

    /* 
      STRICT CARD STYLING AS PER REQUIREMENTS:
      - Pure white background (#FFFFFF)
      - Black text only (#000000)
      - Very large bold Devanagari font (60-80px)
      - Rounded corners
      - Thick black border
      - Large spacing between cards
      - Clean, distraction-free design (NO gradients, NO shadows, NO stickers/emojis inside)
    */
    .flash-card {
      background-color: #ffffff !important;
      color: #000000 !important;
      border: 4px solid #000000 !important;
      border-radius: 20px !important;
      box-shadow: none !important;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 800;
      font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, border-width 0.15s ease;
      position: relative;
    }

    .flash-card:hover {
      transform: translateY(-4px);
    }

    .flash-card:active {
      transform: scale(0.97);
    }

    /* FULL-SCREEN / READER OVERLAY MODAL */
    .reader-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }

    .reader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
    }

    .reader-category-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .reader-progress {
      font-size: 1.3rem;
      font-weight: 800;
      background-color: #334155;
      padding: 6px 16px;
      border-radius: 20px;
      color: #ffffff;
    }

    .reader-card-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px 0;
    }

    /* READER DISPLAY FLASH CARD */
    .reader-card {
      background-color: #ffffff !important;
      color: #000000 !important;
      border: 6px solid #000000 !important;
      border-radius: 28px !important;
      box-shadow: none !important;
      width: 100%;
      max-width: 600px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      font-weight: 900;
      font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .reader-card:active {
      transform: scale(0.98);
    }

    .reader-controls-panel {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .reader-main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn-nav-large {
      padding: 14px 24px;
      font-size: 1.15rem;
      font-weight: 800;
      min-width: 120px;
    }

    .btn-speak-large {
      padding: 14px 28px;
      font-size: 1.25rem;
      font-weight: 800;
      background-color: #16a34a;
      color: #ffffff;
    }

    .btn-speak-large:hover {
      background-color: #15803d;
    }

    .reader-secondary-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* KEYBOARD HINT FOOTER */
    .keyboard-hints {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
    }

    /* SVG ICON UTILITY */
    .icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* RESPONSIVE DESIGN ADJUSTMENTS */
    @media (max-width: 640px) {
      .header-title h1 {
        font-size: 1.1rem;
      }
      
      .flash-card {
        height: 150px;
        font-size: 58px;
        border-width: 3px !important;
      }

      .reader-card {
        height: 240px;
        font-size: 76px;
        border-width: 5px !important;
      }

      .btn-nav-large {
        padding: 12px 16px;
        font-size: 1rem;
        min-width: 90px;
      }

      .btn-speak-large {
        padding: 12px 20px;
        font-size: 1.1rem;
      }

      .cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <header>
    <div class="header-title">
      <h1>दो वर्ण वाले शब्द</h1>
      <span class="fln-badge">FLN कक्षा 1-2</span>
    </div>
    <div class="header-controls">
      <!-- MUTE SOUND BUTTON -->
      <button class="btn btn-dark" id="muteBtn" onclick="toggleMute()" title="ध्वनि चालू/बंद करें (Mute/Unmute Sound)">
        <svg class="icon" id="muteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span id="muteLabel">ध्वनि</span>
      </button>

      <button class="btn btn-dark" id="fullscreenBtn" onclick="toggleFullScreen()" title="पूर्ण स्क्रीन (Full Screen)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <span>स्क्रीन</span>
      </button>
    </div>
  </header>

  <!-- CATEGORY SELECTOR BAR -->
  <div class="category-bar-container">
    <div class="category-select-wrapper">
      <label for="categorySelect" class="category-label">मात्रा चुनें:</label>
      <select id="categorySelect" class="category-dropdown" onchange="onCategorySelectChange(this.value)">
        <!-- Options populated dynamically -->
      </select>
    </div>

    <!-- SCROLLABLE MATRA PILLS -->
    <div class="category-pills" id="categoryPills">
      <!-- Pills populated dynamically -->
    </div>
  </div>

  <!-- TOOLBAR & CONTROLS -->
  <div class="toolbar">
    <div class="tool-group">
      <button class="btn btn-outline" onclick="openReader(0)" title="पहला शब्द पढ़ना शुरू करें">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span>पठन मोड (Reader)</span>
      </button>
      <button class="btn btn-outline" onclick="shuffleCurrentCategory()" title="शब्दों का क्रम बदलें">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        <span>शफ़ल (Shuffle)</span>
      </button>
      <button class="btn btn-outline" onclick="openRandomWord()" title="कोई भी एक शब्द पढ़ें">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 9c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0 10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5-5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <span>रैंडम शब्द</span>
      </button>
    </div>

    <div class="tool-group">
      <span class="progress-badge" id="gridProgressBadge">कुल शब्द: 20</span>
    </div>
  </div>

  <!-- MAIN GRID DISPLAY -->
  <main>
    <div class="cards-grid" id="cardsGrid">
      <!-- 20 Flash Cards will be dynamically generated here -->
    </div>
  </main>

  <!-- FULL-SCREEN READER OVERLAY -->
  <div class="reader-overlay" id="readerOverlay">
    <div class="reader-header">
      <div class="reader-category-title" id="readerCategoryTitle">बिना मात्रा वाले शब्द</div>
      <div class="reader-progress" id="readerProgressText">1 / 20</div>
      <button class="btn btn-dark" onclick="closeReader()" title="बंद करें (Escape)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        <span>बंद करें</span>
      </button>
    </div>

    <div class="reader-card-wrapper">
      <!-- STRICT PURE WHITE CARD WITH BLACK TEXT -->
      <div class="reader-card" id="readerCardText" onclick="speakCurrentWord()" title="बोलकर सुनने के लिए क्लिक करें">
        घर
      </div>
    </div>

    <div class="reader-controls-panel">
      <!-- MAIN READER CONTROLS -->
      <div class="reader-main-controls">
        <button class="btn btn-dark btn-nav-large" onclick="prevWord()" title="पिछला शब्द (Left Arrow)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          <span>पिछला</span>
        </button>

        <button class="btn btn-speak-large" onclick="speakCurrentWord()" title="उच्चारण सुनें (Spacebar)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <span>🔊 बोलें</span>
        </button>

        <button class="btn btn-dark btn-nav-large" onclick="nextWord()" title="अगला शब्द (Right Arrow)">
          <span>अगला</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <!-- SECONDARY CONTROLS -->
      <div class="reader-secondary-controls">
        <button class="btn btn-outline" id="autoPlayBtn" onclick="toggleAutoPlay()" title="ऑटो प्ले चालू/बंद करें">
          <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span id="autoPlayLabel">ऑटो प्ले</span>
        </button>

        <button class="btn btn-outline" onclick="shuffleCurrentCategory()" title="शब्दों को मिलाएँ">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          <span>शफ़ल</span>
        </button>

        <button class="btn btn-outline" onclick="pickRandomInReader()" title="यादृच्छिक शब्द">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 9c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0 10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5-5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
          <span>रैंडम</span>
        </button>
      </div>

      <div class="keyboard-hints">
        कीबोर्ड: ← पिछला | → अगला | स्पेसबार: बोलें | Esc: बंद करें
      </div>
    </div>
  </div>

  <script>
    /* 
      WORD DATABASE
      14 Categories, 20 unique NCERT/KVS-aligned 2-letter Hindi words per category.
      Total: 280 words. No repeated words per category.
    */
    const DATASET = [
      {
        id: "no_matra",
        name: "बिना मात्रा वाले शब्द",
        label: "अ (बिना मात्रा)",
        words: ["घर", "फल", "बस", "जग", "नल", "खत", "मत", "डर", "सच", "वन", "जल", "हल", "धन", "रथ", "कब", "सब", "नथ", "मन", "तन", "घट"]
      },
      {
        id: "aa_matra",
        name: "ा (आ की मात्रा)",
        label: "ा (आ)",
        words: ["आम", "आग", "आज", "कान", "नाक", "हाथ", "शाम", "नाम", "काम", "रात", "बात", "दाल", "बाल", "लाल", "गाल", "राम", "ताला", "माला", "छाता", "राजा"]
      },
      {
        id: "i_matra",
        name: "ि (इ की मात्रा)",
        label: "ि (इ)",
        words: ["दिन", "पिन", "बिल", "तिल", "कवि", "रवि", "हरि", "सिर", "चित्र", "मित्र", "दिल", "किला", "पिता", "शिला", "दिशा", "निधि", "विधि", "गति", "मति", "पति"]
      },
      {
        id: "ee_matra",
        name: "ी (ई की मात्रा)",
        label: "ी (ई)",
        words: ["कील", "चील", "झील", "नीम", "तीर", "खीर", "नदी", "परी", "दरी", "हरी", "चाबी", "रानी", "नानी", "पानी", "हाथी", "काकी", "मामी", "साड़ी", "गाड़ी", "भारी"]
      },
      {
        id: "u_matra",
        name: "ु (उ की मात्रा)",
        label: "ु (उ)",
        words: ["पुल", "धुन", "बुन", "सुन", "गुण", "सुख", "मुख", "पशु", "गुरु", "युवा", "मधु", "कुल", "तुम", "कुछ", "गुम", "चुप", "मुनि", "दुआ", "रुख", "अनु"]
      },
      {
        id: "oo_matra",
        name: "ू (ऊ की मात्रा)",
        label: "ू (ऊ)",
        words: ["फूल", "धूल", "भूल", "आलू", "भालू", "चूहा", "चाकू", "बापू", "दूर", "नूर", "धूप", "रूप", "सूप", "दूध", "पूर", "कूप", "जूता", "सूखा", "भूखा", "मूली"]
      },
      {

      },
      {

        label: "े (ए)",
        words: ["सेब", "शेर", "पेट", "खेल", "तेल", "मेल", "रेल", "पेड़", "देश", "वेश", "सेवा", "मेवा", "केला", "मेला", "चेला", "ठेला", "रेखा", "देना", "लेना", "बेटा"]
      },
      {
        id: "ai_matra",
        name: "ै (ऐ की मात्रा)",
        label: "ै (ऐ)",
        words: ["पैर", "बैल", "पैसा", "जैसा", "वैसा", "कैसा", "मैला", "थैला", "भैया", "नैया", "मैया", "सैर", "तैर", "गैस", "मैदा", "चैन", "नैन", "पैदा", "बैर", "मैना"]
      },
      {
        id: "o_matra",
        name: "ो (ओ की मात्रा)",
        label: "ो (ओ)",
        words: ["मोर", "चोर", "शोर", "ढोल", "बोल", "गोल", "तोता", "घोड़ा", "लोटा", "छोटा", "मोटा", "रोना", "धोना", "सोना", "खोना", "ओस", "ओम", "कोट", "नोट", "वोट"]
      },
      {
        id: "au_matra",
        name: "ौ (औ की मात्रा)",
        label: "ौ (औ)",
        words: ["कौन", "मौन", "पौधा", "नौका", "मौका", "कौवा", "चौका", "दौड़", "चौड़ा", "बौना", "फौज", "शौक", "खौफ", "गौन", "चौक", "लौकी", "चौकी", "मौसी", "गौरी", "कौर"]
      },
      {
        id: "anusvaar",
        name: "ं (अनुस्वार वाले शब्द)",
        label: "ं (अनुस्वार)",
        words: ["अंक", "रंग", "संग", "भंग", "तंग", "दंगा", "पंगा", "चंगा", "जंग", "अंत", "हंस", "कंस", "अंश", "पंख", "शंख", "डंक", "मंच", "संत", "बंद", "मंद"]
      },
      {
        id: "visarg",
        name: "ः (विसर्ग वाले शब्द)",
        label: "ः (विसर्ग)",
        words: ["अतः", "पुनः", "नमः", "स्वतः", "दुःख", "प्रायः", "शनैः", "जनः", "तपः", "फलतः", "अंशतः", "नामतः", "कालतः", "शतः", "मूलतः", "देवः", "रामः", "गजः", "बालः", "नरः"]
      },
      {
        id: "chandrabindu",
        name: "ँ (चंद्रबिंदु वाले शब्द)",
        label: "ँ (चंद्रबिंदु)",
        words: ["आँख", "माँ", "छाँव", "गाँव", "पाँव", "दाँव", "साँच", "काँच", "भाँप", "चाँप", "माँग", "टाँग", "बाँस", "साँस", "घूँट", "बूँद", "मूँछ", "कुँआ", "धूँआ", "दाँत"]
      }
    ];

    /* APP STATE */
    let currentCategoryIndex = 0;
    let activeWords = [];
    let currentWordIndex = 0;
    let isReaderActive = false;
    let isAutoPlaying = false;
    let autoPlayInterval = null;
    let isMuted = false;

    /* DOM ELEMENTS */
    const categorySelect = document.getElementById('categorySelect');
    const categoryPills = document.getElementById('categoryPills');
    const cardsGrid = document.getElementById('cardsGrid');
    const gridProgressBadge = document.getElementById('gridProgressBadge');
    
    const readerOverlay = document.getElementById('readerOverlay');
    const readerCategoryTitle = document.getElementById('readerCategoryTitle');
    const readerProgressText = document.getElementById('readerProgressText');
    const readerCardText = document.getElementById('readerCardText');
    const autoPlayBtn = document.getElementById('autoPlayBtn');
    const autoPlayLabel = document.getElementById('autoPlayLabel');
    const muteBtn = document.getElementById('muteBtn');
    const muteLabel = document.getElementById('muteLabel');
    const muteIcon = document.getElementById('muteIcon');

    /* SPEECH SYNTHESIS INITIALIZATION */
    let hindiVoice = null;

    function initSpeechSynthesis() {
      if ('speechSynthesis' in window) {
        function loadVoices() {
          const voices = window.speechSynthesis.getVoices();
          hindiVoice = voices.find(v => v.lang.toLowerCase().includes('hi') || v.lang.toLowerCase().includes('hindi')) || null;
        }
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      
      if (isMuted) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        muteBtn.classList.add('btn-active');
        muteLabel.textContent = 'मौन (Muted)';
        muteIcon.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
      } else {
        muteBtn.classList.remove('btn-active');
        muteLabel.textContent = 'ध्वनि';
        muteIcon.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
      }
    }

    function speakText(text) {
      if (isMuted || !('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel(); // Stop active speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 0.8; // Slightly slower for foundational learners
      
      if (hindiVoice) {
        utterance.voice = hindiVoice;
      }
      
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (activeWords.length > 0 && activeWords[currentWordIndex]) {
        speakText(activeWords[currentWordIndex]);
      }
    }

    /* INITIALIZATION */
    function init() {
      initSpeechSynthesis();
      populateCategorySelectors();
      loadCategory(0);
      setupKeyboardListeners();
    }

    /* POPULATE DROPDOWN & PILLS */
    function populateCategorySelectors() {
      categorySelect.innerHTML = '';
      categoryPills.innerHTML = '';

      DATASET.forEach((cat, idx) => {
        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${cat.name}`;
        categorySelect.appendChild(opt);

        // Pill Button
        const pill = document.createElement('button');
        pill.className = `pill-btn ${idx === 0 ? 'active' : ''}`;
        pill.textContent = cat.label;
        pill.onclick = () => onCategorySelectChange(idx);
        categoryPills.appendChild(pill);
      });
    }

    /* SWITCH CATEGORY */
    function onCategorySelectChange(index) {
      index = parseInt(index, 10);
      if (index >= 0 && index < DATASET.length) {
        currentCategoryIndex = index;
        categorySelect.value = index;

        // Update active class on pills
        const pills = categoryPills.querySelectorAll('.pill-btn');
        pills.forEach((p, i) => {
          p.classList.toggle('active', i === index);
        });

        loadCategory(index);
      }
    }

    function loadCategory(index) {
      const category = DATASET[index];
      // Clone array to allow shuffling without destroying original order if needed
      activeWords = [...category.words];
      currentWordIndex = 0;
      renderGrid();
      updateProgressDisplay();
    }

    /* RENDER FLASH CARD GRID */
    function renderGrid() {
      cardsGrid.innerHTML = '';

      activeWords.forEach((word, index) => {
        /*
          Creating pure white card with thick black border and large black Devanagari text.
        */
        const card = document.createElement('div');
        card.className = 'flash-card';
        card.textContent = word;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `शब्द: ${word}`);
        card.onclick = () => {
          openReader(index);
        };
        cardsGrid.appendChild(card);
      });
    }

    function updateProgressDisplay() {
      gridProgressBadge.textContent = `कुल शब्द: ${activeWords.length}`;
      readerProgressText.textContent = `${currentWordIndex + 1} / ${activeWords.length}`;
      readerCategoryTitle.textContent = DATASET[currentCategoryIndex].name;
    }

    /* SHUFFLE CARDS */
    function shuffleCurrentCategory() {
      for (let i = activeWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activeWords[i], activeWords[j]] = [activeWords[j], activeWords[i]];
      }
      currentWordIndex = 0;
      renderGrid();
      if (isReaderActive) {
        updateReaderDisplay();
      }
    }

    /* RANDOM WORD SELECTION */
    function openRandomWord() {
      const randomCategory = Math.floor(Math.random() * DATASET.length);
      onCategorySelectChange(randomCategory);
      currentWordIndex = Math.floor(Math.random() * activeWords.length);
      openReader(currentWordIndex);
    }

    function pickRandomInReader() {
      const randomIndex = Math.floor(Math.random() * activeWords.length);
      currentWordIndex = randomIndex;
      updateReaderDisplay();
    }

    /* READER MODAL FUNCTIONS */
    function openReader(index) {
      currentWordIndex = index;
      isReaderActive = true;
      readerOverlay.classList.add('active');
      updateReaderDisplay();
    }

    function closeReader() {
      isReaderActive = false;
      stopAutoPlay();
      readerOverlay.classList.remove('active');
    }

    function updateReaderDisplay() {
      const word = activeWords[currentWordIndex];
      readerCardText.textContent = word;
      updateProgressDisplay();
      speakCurrentWord();
    }

    function nextWord() {
      if (activeWords.length === 0) return;
      currentWordIndex = (currentWordIndex + 1) % activeWords.length;
      updateReaderDisplay();
    }

    function prevWord() {
      if (activeWords.length === 0) return;
      currentWordIndex = (currentWordIndex - 1 + activeWords.length) % activeWords.length;
      updateReaderDisplay();
    }

    /* AUTO PLAY FUNCTIONALITY */
    function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      isAutoPlaying = true;
      autoPlayBtn.classList.add('btn-active');
      autoPlayLabel.textContent = 'रोकें (Pause)';
      if (!isReaderActive) {
        openReader(currentWordIndex);
      }
      autoPlayInterval = setInterval(() => {
        nextWord();
      }, 3500); // 3.5s per word for proper FLN reading pace
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      autoPlayBtn.classList.remove('btn-active');
      autoPlayLabel.textContent = 'ऑटो प्ले';
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
      }
    }

    /* FULLSCREEN TOGGLE */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* KEYBOARD ACCESSIBILITY */
    function setupKeyboardListeners() {
      document.addEventListener('keydown', (e) => {
        if (!isReaderActive) return;

        if (e.key === 'ArrowRight') {
          nextWord();
        } else if (e.key === 'ArrowLeft') {
          prevWord();
        } else if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          speakCurrentWord();
        } else if (e.key === 'Escape') {
          closeReader();
        }
      });
    }

    // Initialize application on page launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
