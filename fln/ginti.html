<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>हिन्दी संख्या नाम 1–100</title>
<style>
:root{
  --bg:#fff4dc;--bg2:#ffe3f1;--panel:#ffffff;--ink:#27294a;--muted:#6a6e8e;--line:#e6e1f2;
  --en:#1d4ed8;--enbg:#dbeafe;--hi:#c2410c;--hibg:#ffedd5;--nm:#15803d;--nmbg:#dcfce7;
  --okbg:#dcfce7;--okink:#14532d;--nobg:#fff1c2;--noink:#7a4a00;
  --cl:93%;--shadow:0 6px 18px rgba(70,40,130,.16);--ok:#16a34a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c33;--bg2:#2b1d3d;--panel:#262948;--ink:#f3f3fb;--muted:#b4b7d4;--line:#3a3e66;
    --en:#8ab4ff;--enbg:#233463;--hi:#ffb07a;--hibg:#4a2f1d;--nm:#74e79f;--nmbg:#1d4630;
    --okbg:#14532d;--okink:#bbf7d0;--nobg:#4d3a0a;--noink:#ffe29a;
    --cl:27%;--shadow:0 6px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c33;--bg2:#2b1d3d;--panel:#262948;--ink:#f3f3fb;--muted:#b4b7d4;--line:#3a3e66;
  --en:#8ab4ff;--enbg:#233463;--hi:#ffb07a;--hibg:#4a2f1d;--nm:#74e79f;--nmbg:#1d4630;
  --okbg:#14532d;--okink:#bbf7d0;--nobg:#4d3a0a;--noink:#ffe29a;
  --cl:27%;--shadow:0 6px 18px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  font-family:"Nirmala UI","Noto Sans Devanagari","Mangal","Kohinoor Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding:clamp(10px,2vw,24px) clamp(10px,2vw,24px) 120px;
}
button{font:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}

.wrap{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:clamp(8px,1.6vw,16px)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:clamp(40px,6vw,58px);height:auto;flex:none;animation:spin 14s linear infinite}
h1{margin:0;font-size:clamp(22px,4.4vw,38px);line-height:1.1;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:6px}
.pill{border-radius:999px;padding:2px 12px;font-size:clamp(12px,2.2vw,15px);font-weight:700;border:2px solid currentColor}
.pill.en{background:var(--enbg);color:var(--en)}
.pill.hi{background:var(--hibg);color:var(--hi)}
.pill.nm{background:var(--nmbg);color:var(--nm)}
.hdr-tools{display:flex;align-items:center;gap:8px}
.icon-btn{width:clamp(38px,6vw,46px);height:clamp(38px,6vw,46px);border:0;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:60%;height:60%}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{background:#e11d48;color:#fff}
#score{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(16px,3vw,22px)}

main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:clamp(12px,2vw,24px);align-items:start}
.panel{background:var(--panel);border-radius:26px;box-shadow:var(--shadow);padding:clamp(10px,1.8vw,20px)}
.chartwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(2px,.7vw,7px);container-type:inline-size}
.cell{
  aspect-ratio:1;border:0;padding:0;border-radius:10px;
  border-radius:clamp(6px,1.4vw,14px);
  background:hsl(var(--h) 90% var(--cl));
  box-shadow:0 2px 0 rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;position:relative;
}
.cell:hover{transform:translateY(-2px)}
.cell .e{color:var(--en);font-size:clamp(11px,3.4vw,20px);font-size:clamp(11px,3.4cqw,28px);line-height:1;font-weight:800}
.cell .d{color:var(--hi);font-size:clamp(10px,3vw,18px);font-size:clamp(10px,3cqw,26px);line-height:1.15;font-weight:800}
.cell .n{display:none;color:var(--nm);font-style:normal;font-weight:800;line-height:1.1;font-size:clamp(9px,1.5vw,12px);font-size:clamp(9px,1.6cqw,17px);white-space:nowrap;max-width:100%;overflow:hidden}
@media(min-width:700px){.cell.seen .n,.cell.sel .n{display:block}}
.cell.seen{box-shadow:inset 0 0 0 2px var(--nm),0 2px 0 rgba(0,0,0,.14)}
.cell.sel{transform:scale(1.14);z-index:2;box-shadow:0 0 0 4px var(--ink),0 8px 16px rgba(0,0,0,.3)}
#bubble{
  position:absolute;z-index:5;pointer-events:none;
  background:var(--nm);color:#fff;font-weight:800;border-radius:16px;
  padding:6px 16px;font-size:clamp(20px,4vw,30px);white-space:nowrap;
  box-shadow:0 6px 16px rgba(0,0,0,.3);
}
#bubble.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
:root[data-theme="dark"] #bubble{color:#0b2a17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #bubble{color:#0b2a17}}

.stage{position:relative;overflow:hidden;min-height:340px}
.learn{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.tile{
  position:relative;border-radius:20px;padding:8px 14px 8px;text-align:center;font-weight:800;line-height:1.15;
  box-shadow:var(--shadow);border:4px solid currentColor;
}
.tile small{position:absolute;left:12px;top:6px;font-size:12px;font-weight:700;opacity:.9}
.tile .v{display:block;font-size:clamp(30px,min(9vw,7vh),62px);padding-top:4px}
.tile.en{background:var(--enbg);color:var(--en)}
.tile.hi{background:var(--hibg);color:var(--hi)}
.tile.nm{background:var(--nmbg);color:var(--nm)}
.demo .tile{opacity:.55}
.arrw{display:flex;justify-content:center;color:var(--muted);height:30px;animation:fade .3s var(--d,0s) both,bobY 1s ease-in-out infinite .8s}
.arrw svg{width:30px;height:30px}
.pop{animation:pop .55s var(--d,0s) both cubic-bezier(.2,.9,.3,1.3)}
.eqwrap{margin-top:12px;text-align:center}
.eqp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:clamp(20px,4vw,30px);font-weight:800}
.eqp .ce{color:var(--en)}.eqp .ch{color:var(--hi)}.eqp .cn{color:var(--nm)}.eqp .op{color:var(--muted)}
.tip{margin-top:10px;text-align:center;color:var(--muted);font-weight:700;font-size:clamp(16px,3vw,20px)}

.q{font-size:clamp(19px,3.6vw,26px);font-weight:800;text-align:center;margin:10px 0}
.chal .tile{max-width:340px;margin:0 auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.opt{
  --b:#f472b6;border:0;border-bottom:6px solid var(--b);border-radius:18px;padding:12px 8px;
  font-weight:800;font-size:clamp(22px,5vw,32px);line-height:1.2;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .1s;
}
.opt:nth-child(3n+2){--b:#fbbf24}.opt:nth-child(3n+3){--b:#38bdf8}
.opt.nm{background:var(--nmbg);color:var(--nm)}
.opt.hi{background:var(--hibg);color:var(--hi)}
.opt:active{transform:translateY(3px)}
.opt.bad{opacity:.4;pointer-events:none}
.opt.shake{animation:shake .45s}
.opt.good{background:var(--ok);color:#fff;border-bottom-color:#14532d;animation:pop .45s}
.opt.used{opacity:.25;pointer-events:none}
.opt.sel{outline:4px solid var(--ink);transform:scale(1.05)}
.opt.sm{font-size:clamp(22px,5vw,30px)}
.fb{margin-top:12px;border-radius:18px;padding:10px 12px;text-align:center;font-weight:800;font-size:clamp(18px,3.4vw,24px)}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:var(--okink);animation:pop .4s}
.fb.no{background:var(--nobg);color:var(--noink)}
.fb .hint{font-size:clamp(16px,3vw,20px);margin-top:4px}
.fb .next{font-size:clamp(14px,2.6vw,17px);margin-top:6px;opacity:.85}

.chip{display:inline-block;border-radius:16px;padding:4px 14px;font-weight:800;font-size:clamp(26px,6vw,44px);border:3px solid currentColor}
.chip.en{background:var(--enbg);color:var(--en)}
.chip.hi{background:var(--hibg);color:var(--hi)}
.cmp,.chainrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.cmp .op{font-size:30px;font-weight:800;color:var(--muted)}
.word{display:inline-flex;align-items:center;gap:4px;background:var(--nmbg);color:var(--nm);border:3px solid currentColor;border-radius:16px;padding:4px 12px;font-size:clamp(26px,6vw,42px);font-weight:800}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;min-height:1.4em;padding:0 8px;border-radius:12px;border:3px dashed currentColor;font-weight:800}
.slot.filled{border-style:solid;background:var(--panel);cursor:pointer}
.slot.nm{color:var(--nm)}.slot.hi{color:var(--hi)}
.chainrow .slot{font-size:clamp(26px,6vw,40px);padding:2px 14px}
.chainrow .sa{display:flex;color:var(--muted)}
.chainrow .sa svg{width:26px;height:26px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.tiles .opt{min-width:84px}

.seq{display:flex;justify-content:center;align-items:stretch;gap:4px;margin:6px 0}
.scol{flex:1;max-width:130px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;background:var(--bg);border-radius:16px;padding:8px 4px;font-weight:800}
.scol .ce{color:var(--en);font-size:clamp(22px,5vw,32px)}
.scol .ch{color:var(--hi);font-size:clamp(20px,4.6vw,30px)}
.scol .cn{color:var(--nm);font-size:clamp(16px,3.6vw,22px);min-height:1.4em}
.scol .cn.blank{border:3px dashed var(--nm);border-radius:10px;padding:0 14px}
.sa2{display:flex;align-items:center;color:var(--muted)}
.sa2 svg{width:20px;height:20px}

.mrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0;padding:6px;border-radius:18px;border:3px solid transparent;cursor:pointer}
.mrow.sel{border-color:var(--ink);background:var(--bg)}
.mrow .chip{font-size:clamp(22px,5vw,34px);padding:2px 10px}
.mrow .slot{font-size:clamp(20px,4.4vw,30px);color:var(--nm);padding:2px 10px;min-width:3.6em}
.mrow .sa{display:flex;color:var(--muted)}.mrow .sa svg{width:22px;height:22px}
.mrow.done{cursor:default}
.mrow.done .slot{background:var(--nmbg);border-style:solid}

.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf span{position:absolute;top:-40px;animation:fall 1.5s ease-in forwards}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:clamp(8px,2vw,16px);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 45%);pointer-events:none;
}
.btn{
  pointer-events:auto;border:0;border-radius:999px;padding:14px clamp(16px,3vw,28px);
  color:#fff;font-weight:800;font-size:clamp(17px,3.4vw,23px);box-shadow:0 5px 0 rgba(0,0,0,.25);
  transition:transform .1s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#bListen{background:#0369a1}#bChal{background:#c2410c}#bReset{background:#6d28d9}
#bListen.on{animation:pulse .8s infinite}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:92vw;text-align:center;font-size:clamp(15px,3vw,18px)}

@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bobY{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(520px) rotate(300deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  .stage{order:-1;min-height:0}
}
@media(max-width:480px){
  .tile{padding:6px 10px}
  .tile small{font-size:11px}
  .opts{grid-template-columns:repeat(3,1fr);gap:6px}
  .opt{padding:10px 2px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#fbbf24" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"><path d="M32 4l7.4 16.2 17.6 2-13 12 3.7 17.4L32 42.6 16.3 51.6 20 34.2 7 22.2l17.6-2z"/></g><circle cx="26" cy="30" r="2.6" fill="#27294a"/><circle cx="38" cy="30" r="2.6" fill="#27294a"/><path d="M26 37q6 6 12 0" fill="none" stroke="#27294a" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <h1>हिन्दी संख्या नाम</h1>
      </div>
    </div>
    <div class="hdr-tools">
      <div id="score" aria-live="polite">⭐ 0</div>
      <button class="icon-btn" id="bMute" aria-label="आवाज़ बंद करो" aria-pressed="false" title="आवाज़ चालू / बंद"></button>
      <button class="icon-btn" id="bFull" aria-label="फुलस्क्रीन" title="फुलस्क्रीन"></button>
    </div>
  </header>

  <main>
    <section class="panel chartwrap" id="chartwrap" aria-label="1 से 100 तक की संख्याएँ">
      <div class="grid" id="grid"></div>
      <div id="bubble" hidden></div>
    </section>
    <section class="panel stage" id="stage" aria-live="polite"></section>
  </main>
</div>

<div class="bar">
  <button class="btn" id="bListen">🔊 सुनो</button>
  <button class="btn" id="bChal">🎯 Challenge</button>
  <button class="btn" id="bReset">↺ Reset</button>
</div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};

/* ---------- Data: standard Hindi number names 1–100 ---------- */
var NAMES=[''].concat(("एक,दो,तीन,चार,पाँच,छह,सात,आठ,नौ,दस,"+
"ग्यारह,बारह,तेरह,चौदह,पंद्रह,सोलह,सत्रह,अठारह,उन्नीस,बीस,"+
"इक्कीस,बाईस,तेईस,चौबीस,पच्चीस,छब्बीस,सत्ताईस,अट्ठाईस,उनतीस,तीस,"+
"इकतीस,बत्तीस,तैंतीस,चौंतीस,पैंतीस,छत्तीस,सैंतीस,अड़तीस,उनतालीस,चालीस,"+
"इकतालीस,बयालीस,तैंतालीस,चौवालीस,पैंतालीस,छियालीस,सैंतालीस,अड़तालीस,उनचास,पचास,"+
"इक्यावन,बावन,तिरपन,चौवन,पचपन,छप्पन,सत्तावन,अट्ठावन,उनसठ,साठ,"+
"इकसठ,बासठ,तिरसठ,चौंसठ,पैंसठ,छियासठ,सड़सठ,अड़सठ,उनहत्तर,सत्तर,"+
"इकहत्तर,बहत्तर,तिहत्तर,चौहत्तर,पचहत्तर,छिहत्तर,सतहत्तर,अठहत्तर,उन्यासी,अस्सी,"+
"इक्यासी,बयासी,तिरासी,चौरासी,पचासी,छियासी,सत्तासी,अट्ठासी,नवासी,नब्बे,"+
"इक्यानवे,बानवे,तिरानवे,चौरानवे,पंचानवे,छियानवे,सत्तानवे,अट्ठानवे,निन्यानवे,एक सौ").split(','));
var DIG='०१२३४५६७८९';
function hd(n){return String(n).replace(/\d/g,function(d){return DIG[d];});}
function nm(n){return NAMES[n];}

/* split a Hindi word into aksharas (syllable units) */
var C='[\\u0915-\\u0939\\u0958-\\u095F]\\u093C?';
var UNIT=new RegExp('(?:'+C+'(?:\\u094D'+C+')*[\\u093E-\\u094C\\u0901-\\u0903]*|[\\u0904-\\u0914][\\u0901-\\u0903]?)','g');
function units(s){return s.match(UNIT)||[];}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function eq(n){return '<span class="eqp"><span class="ce">'+n+'</span><span class="op">=</span><span class="ch">'+hd(n)+'</span><span class="op">=</span><span class="cn">'+nm(n)+'</span></span>';}
var ARR_D='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4v26M9 21l11 12 11-12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ARR_R='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20h26M21 9l12 11-12 11" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- State ---------- */
var stage=$('#stage'),grid=$('#grid'),wrap=$('#chartwrap'),bubble=$('#bubble');
var mode='home',sel=null,Q=null,score=0,lastType=null,lastN=0,timer=null;
var seen={};

/* ---------- Chart ---------- */
var HUES=[350,25,45,75,140,170,195,220,265,310];
(function(){
  var h='';
  for(var n=1;n<=100;n++){
    var r=Math.floor((n-1)/10);
    h+='<button class="cell" data-n="'+n+'" style="--h:'+HUES[r]+'" aria-label="'+n+' '+hd(n)+' '+nm(n)+'"><b class="e">'+n+'</b><b class="d">'+hd(n)+'</b><i class="n">'+nm(n)+'</i></button>';
  }
  grid.innerHTML=h;
})();
function updateGrid(){
  var cells=grid.children;
  for(var i=0;i<cells.length;i++){
    var n=+cells[i].getAttribute('data-n');
    cells[i].classList.toggle('sel',n===sel);
    cells[i].classList.toggle('seen',!!seen[n]);
  }
}
function placeBubble(anim){
  if(mode!=='learn'||!sel){bubble.hidden=true;return;}
  var c=grid.querySelector('[data-n="'+sel+'"]');
  bubble.hidden=false;bubble.textContent=nm(sel);
  var w=wrap.getBoundingClientRect(),r=c.getBoundingClientRect();
  var bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  var left=r.left-w.left+r.width/2-bw/2;
  left=Math.max(0,Math.min(left,w.width-bw));
  var top=r.top-w.top-bh-10;
  if(top<0)top=r.bottom-w.top+10;
  bubble.style.left=left+'px';bubble.style.top=top+'px';
  if(anim){bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');}
}

function loadVoices(){

function speakMany(list){

/* ---------- Distractors ---------- */
function nearNums(n,k){
  var offs=shuffle([1,-1,2,-2,10,-10]).concat(shuffle([9,-9,11,-11,3,-3,20,-20,5,-5]));
  var out=[];
  for(var i=0;i<offs.length&&out.length<k;i++){
    var m=n+offs[i];
    if(m>=1&&m<=100&&m!==n&&out.indexOf(m)<0)out.push(m);
  }
  return out;
}
function hiNums(n,k){
  var out=[],s=String(n);
  if(s.length===2&&s[1]!=='0'){var r=+(s[1]+s[0]);if(r!==n&&r>=1&&r<=100)out.push(r);}
  var ex=shuffle([1,-1,10,-10,2]);
  for(var i=0;i<ex.length;i++){var m=n+ex[i];if(m>=1&&m<=100&&m!==n&&out.indexOf(m)<0)out.push(m);}
  return out.slice(0,k);
}
function nameOpts(n){
  var o=[{t:nm(n),ok:true,k:'nm',say:nm(n)}];
  nearNums(n,2).forEach(function(m){o.push({t:nm(m),ok:false,k:'nm',say:nm(m)});});
  return shuffle(o);
}
function hiOpts(n){
  var o=[{t:hd(n),ok:true,k:'hi'}];
  hiNums(n,2).forEach(function(m){o.push({t:hd(m),ok:false,k:'hi'});});
  return shuffle(o);
}

/* ---------- Challenge: question factory ---------- */
var TYPES=['match','h2name','e2name','e2h','match3','complete','build','seq'];
function enTile(n){return '<div class="tile en"><small>अंग्रेज़ी अंक</small><span class="v">'+n+'</span></div>';}
function hiTile(n){return '<div class="tile hi"><small>हिन्दी अंक</small><span class="v">'+hd(n)+'</span></div>';}

function makeQ(){
  var t;do{t=pick(TYPES);}while(t===lastType);
  lastType=t;
  var n;do{n=rnd(1,100);}while(n===lastN||(t==='complete'&&(n===100||units(nm(n)).length<2)));
  lastN=n;
  var q={type:t,n:n,mistakes:0,done:false,revealed:false,fb:null,last:-1};
  if(t==='match'){q.ans='nm';q.top=enTile(n);q.text='सही हिन्दी नाम चुनो';q.opts=nameOpts(n);q.speakList=q.opts.map(function(o){return o.say;});}
  else if(t==='h2name'){q.ans='nm';q.top=hiTile(n);q.text='यह संख्या क्या है?';q.opts=nameOpts(n);q.speakList=q.opts.map(function(o){return o.say;});}
  else if(t==='e2name'){q.ans='nm';q.top=enTile(n);q.text=n+' को हिन्दी में क्या कहते हैं?';q.opts=nameOpts(n);q.speakList=q.opts.map(function(o){return o.say;});}
  else if(t==='e2h'){q.ans='hi';q.top=enTile(n);q.text=n+' को हिन्दी अंकों में लिखो';q.opts=hiOpts(n);}
  else if(t==='seq'){
    q.ans='nm';q.s=rnd(1,98);q.b=pick([1,2]);q.n=q.s+q.b;lastN=q.n;
    q.text='खाली जगह भरो';q.opts=nameOpts(q.n);q.speakList=q.opts.map(function(o){return o.say;});
  }
  else if(t==='complete'){
    var u=units(nm(n)),k=u.length===2?1:(u.length===3?2:Math.ceil(u.length/2));
    q.pre=u.slice(0,u.length-k);q.hidden=u.slice(u.length-k);q.k=k;
    var pool={};
    for(var i=1;i<=100;i++){units(nm(i)).forEach(function(x){if(q.hidden.indexOf(x)<0)pool[x]=1;});}
    var ds=shuffle(Object.keys(pool)).slice(0,2);
    q.tiles=shuffle(q.hidden.concat(ds)).map(function(x){return {u:x,used:false};});
    q.chosen=[];q.locked=false;
  }
  else if(t==='build'){
    var hs=[n].concat(hiNums(n,1)),ns=[n].concat(nearNums(n,1));
    q.chips=shuffle(hs.map(function(m){return {kind:'hi',n:m,t:hd(m),used:false};}).concat(ns.map(function(m){return {kind:'nm',n:m,t:nm(m),used:false};})));
    q.slots=[null,null];
    q.speakList=q.chips.filter(function(c){return c.kind==='nm';}).map(function(c){return c.t;});
  }
  else if(t==='match3'){
    var ns3=[];while(ns3.length<3){var m=rnd(1,100);if(ns3.indexOf(m)<0)ns3.push(m);}
    ns3.sort(function(a,b){return a-b;});
    q.rows=ns3.map(function(m){return {n:m,done:false};});
    q.chips=shuffle(ns3.map(function(m){return {n:m,used:false};}));
    q.selRow=-1;q.selChip=-1;q.n=ns3[0];
    q.speakList=q.chips.map(function(c){return nm(c.n);});
  }
  return q;
}

/* ---------- Challenge: rendering ---------- */
function fbHTML(q){
  if(!q.fb)return '';
  return '<div class="fb '+q.fb.cls+'">'+q.fb.html+'</div>';
}
function optsHTML(q){
  return '<div class="opts">'+q.opts.map(function(o,i){
    var c='opt '+o.k+(o.st==='bad'?' bad':'')+(o.st==='good'?' good':'')+(i===q.last&&o.st==='bad'?' shake':'');
    return '<button class="'+c+'" data-act="opt" data-i="'+i+'">'+o.t+'</button>';
  }).join('')+'</div>';
}
function seqTop(q){
  var h='<div class="seq">';
  for(var k=0;k<3;k++){
    var m=q.s+k,blank=(k===q.b&&!q.done);
    if(k>0)h+='<div class="sa2">'+ARR_R+'</div>';
    h+='<div class="scol"><span class="ce">'+m+'</span><span class="ch">'+hd(m)+'</span><span class="cn'+(blank?' blank':'')+'">'+(blank?'?':nm(m))+'</span></div>';
  }
  return h+'</div>';
}
function renderQ(){
  var q=Q,h='';
  if(q.type==='match'||q.type==='h2name'||q.type==='e2name'||q.type==='e2h'){
    h=q.top+'<div class="q">'+q.text+'</div>'+optsHTML(q);
  }else if(q.type==='seq'){
    h=seqTop(q)+'<div class="q">'+q.text+'</div>'+optsHTML(q);
  }else if(q.type==='complete'){
    var pre=q.pre.map(function(u){return '<span>'+u+'</span>';}).join('');
    var slots=q.hidden.map(function(u,i){
      var ci=q.chosen[i],show=(q.done||q.revealed)?u:(ci!==undefined?q.tiles[ci].u:'');
      var can=show&&!q.done&&!q.revealed&&!q.locked&&i===q.chosen.length-1;
      return '<span class="slot'+(show?' filled':'')+'"'+(can?' data-act="unslot"':'')+'>'+show+'</span>';
    }).join('');
    h='<div class="cmp"><span class="chip en">'+q.n+'</span><span class="op">=</span><span class="chip hi">'+hd(q.n)+'</span><span class="op">=</span><span class="word">'+pre+slots+'</span></div>'+
      '<div class="q">नाम पूरा करो</div><div class="tiles">'+
      q.tiles.map(function(t,i){return '<button class="opt nm sm'+(t.used?' used':'')+'" data-act="tile" data-i="'+i+'">'+t.u+'</button>';}).join('')+'</div>';
  }else if(q.type==='build'){
    h='<div class="chainrow"><span class="chip en">'+q.n+'</span><span class="sa">'+ARR_R+'</span>'+
      '<span class="slot hi'+(q.slots[0]?' filled':'')+'">'+(q.slots[0]||'?')+'</span><span class="sa">'+ARR_R+'</span>'+
      '<span class="slot nm'+(q.slots[1]?' filled':'')+'">'+(q.slots[1]||'?')+'</span></div>'+
      '<div class="q">अंक → नाम: सही क्रम में रखो</div><div class="tiles">'+
      q.chips.map(function(c,i){return '<button class="opt '+c.kind+' sm'+(c.used?' used':'')+'" data-act="bchip" data-i="'+i+'">'+c.t+'</button>';}).join('')+'</div>';
  }else if(q.type==='match3'){
    h='<div class="q">हर संख्या का सही नाम जोड़ो</div>'+
      q.rows.map(function(r,i){
        return '<div class="mrow'+(r.done?' done':'')+(q.selRow===i?' sel':'')+'" data-act="row" data-i="'+i+'">'+
          '<span class="chip en">'+r.n+'</span><span class="sa">'+ARR_R+'</span>'+
          '<span class="chip hi">'+hd(r.n)+'</span><span class="sa">'+ARR_R+'</span>'+
          '<span class="slot">'+(r.done?nm(r.n):'?')+'</span></div>';
      }).join('')+
      '<div class="tiles">'+q.chips.map(function(c,i){return '<button class="opt nm sm'+(c.used?' used':'')+(q.selChip===i?' sel':'')+'" data-act="mchip" data-i="'+i+'">'+nm(c.n)+'</button>';}).join('')+'</div>';
  }
  stage.innerHTML='<div class="chal">'+h+'<div id="fb">'+fbHTML(q)+'</div></div>';
}

/* ---------- Challenge: logic ---------- */
function hintFor(q,ans,n,m){
  if(q.type==='complete'){
    return m<2?'संकेत: अभी '+q.k+' अक्षर और चाहिए':'संकेत: पहला अक्षर \''+q.hidden[0]+'\' है';
  }
  if(ans==='hi'){
    var s=hd(n);
    if(s.length===1)return 'संकेत: यह एक अंक की संख्या है';
    return m<2?'संकेत: पहला अंक \''+s[0]+'\' है':'संकेत: यह '+s.length+' अंकों की संख्या है और पहला अंक \''+s[0]+'\' है';
  }
  var u=units(nm(n));
  return m<2?'संकेत: नाम \''+u[0]+'\' से शुरू होता है':'संकेत: नाम \''+u[0]+'\' से शुरू होता है और इसमें '+u.length+' अक्षर हैं';
}
function wrongFb(q,ans,n,extra){
  q.fb={cls:'no',html:'<div>💡 फिर से कोशिश करो!</div><div class="hint">'+(extra||hintFor(q,ans,n,q.mistakes))+'</div>'};
}
function win(){
  var q=Q;q.done=true;
  q.fb={cls:'ok',html:'<div>🎉 बहुत बढ़िया!</div><div>'+eq(q.type==='match3'?q.rows[0].n:q.n)+'</div><div class="next">आगे बढ़ने के लिए 🎯 अगला दबाओ</div>'};
  if(q.mistakes===0){score++;updScore();}
  renderQ();confetti();setBtn();
  if(q.type==='match3')speak(nm(q.rows[0].n));else speak(nm(q.n));
}
function reveal(){
  var q=Q;q.done=true;q.revealed=true;
  q.fb={cls:'no',html:'<div>✅ सही उत्तर:</div><div>'+eq(q.n)+'</div><div class="next">फिर से 🎯 अगला दबाओ</div>'};
  if(q.opts)q.opts.forEach(function(o){if(o.ok)o.st='good';});
  renderQ();setBtn();speak(nm(q.n));
}
function updScore(){$('#score').textContent='⭐ '+score;}

function onOpt(i){
  var q=Q;if(!q||q.done)return;
  var o=q.opts[i];if(o.st)return;
  if(o.say)speak(o.say);
  if(o.ok){o.st='good';win();return;}
  o.st='bad';q.mistakes++;q.last=i;
  if(q.mistakes>=3){reveal();return;}
  wrongFb(q,q.ans,q.n);renderQ();
}
function onTile(i){
  var q=Q;if(!q||q.done||q.locked||q.tiles[i].used)return;
  q.tiles[i].used=true;q.chosen.push(i);
  if(q.chosen.length===q.k){
    var got=q.chosen.map(function(ci){return q.tiles[ci].u;}).join('');
    if(got===q.hidden.join('')){win();return;}
    q.mistakes++;
    if(q.mistakes>=3){reveal();return;}
    wrongFb(q,'nm',q.n);q.locked=true;renderQ();
    timer=setTimeout(function(){
      q.chosen.forEach(function(ci){q.tiles[ci].used=false;});
      q.chosen=[];q.locked=false;renderQ();
    },900);
    return;
  }
  renderQ();
}
function onUnslot(){
  var q=Q;if(!q||q.done||q.locked||!q.chosen.length)return;
  var ci=q.chosen.pop();q.tiles[ci].used=false;renderQ();
}
function onBChip(i){
  var q=Q;if(!q||q.done)return;
  var c=q.chips[i];if(c.used)return;
  var need=q.slots[0]?'nm':'hi';
  if(c.kind!==need){
    q.mistakes++;
    q.fb={cls:'no',html:'<div>💡 फिर से कोशिश करो!</div><div class="hint">'+(need==='hi'?'पहले हिन्दी अंक चुनो (नारंगी)':'अब हिन्दी नाम चुनो (हरा)')+'</div>'};
    renderQ();return;
  }
  if(c.kind==='nm')speak(c.t);
  if(c.n!==q.n){
    q.mistakes++;wrongFb(q,c.kind,q.n);renderQ();return;
  }
  c.used=true;q.fb=null;
  if(c.kind==='hi'){q.slots[0]=c.t;renderQ();}
  else{q.slots[1]=c.t;win();}
}
function onRow(i){
  var q=Q;if(!q||q.done||q.rows[i].done)return;
  q.selRow=(q.selRow===i)?-1:i;tryPair();
}
function onMChip(i){
  var q=Q;if(!q||q.done||q.chips[i].used)return;
  speak(nm(q.chips[i].n));
  q.selChip=(q.selChip===i)?-1:i;tryPair();
}
function tryPair(){
  var q=Q;
  if(q.selRow<0||q.selChip<0){renderQ();return;}
  var r=q.rows[q.selRow],c=q.chips[q.selChip];
  if(r.n===c.n){
    r.done=true;c.used=true;q.selRow=q.selChip=-1;q.fb=null;
    if(q.rows.every(function(x){return x.done;})){win();return;}
  }else{
    q.mistakes++;
    wrongFb(q,'nm',r.n);
    q.selRow=q.selChip=-1;
  }
  renderQ();
}

stage.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||mode!=='chal')return;
  var a=t.getAttribute('data-act'),i=+t.getAttribute('data-i');
  if(a==='opt')onOpt(i);
  else if(a==='tile')onTile(i);
  else if(a==='unslot')onUnslot();
  else if(a==='bchip')onBChip(i);
  else if(a==='row')onRow(i);

});

  var de=document.documentElement;
  try{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{
      var req=de.requestFullscreen||de.webkitRequestFullscreen;
      if(!req){toast('इस डिवाइस पर फुलस्क्रीन उपलब्ध नहीं है');return;}
      var p=req.call(de);
      if(p&&p.catch)p.catch(function(){toast('फुलस्क्रीन की अनुमति नहीं मिली');});
    }
  }catch(e){toast('फुलस्क्रीन उपलब्ध नहीं है');}
}
document.addEventListener('fullscreenchange',paintFs);
document.addEventListener('webkitfullscreenchange',paintFs);
$('#bMute').addEventListener('click',toggleMute);
$('#bFull').addEventListener('click',toggleFs);
paintMute();paintFs();
$('#bListen').addEventListener('click',onListen);
$('#bChal').addEventListener('click',startChallenge);
$('#bReset').addEventListener('click',reset);

document.addEventListener('keydown',function(e){
  if(mode!=='learn'||!sel)return;
  if(e.key==='ArrowRight'&&sel<100)showLearn(sel+1);
  else if(e.key==='ArrowLeft'&&sel>1)showLearn(sel-1);
});

showHome();
})();
</script>
</body>
