<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>सप्ताह के दिन खोजो</title>
<style>
:root{
  --bg:#fff7e6;--bg2:#e6f6ff;--panel:#ffffff;--ink:#27294a;--muted:#6a6e8e;--line:#e3e0f0;
  --cardbg:#e6fbf8;--cardink:#0f6b62;--stripbg:#f5f3ff;
  --okbg:#dcfce7;--okink:#14532d;--nobg:#fff1c2;--noink:#7a4a00;--ok:#16a34a;
  --shadow:0 6px 18px rgba(70,40,130,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c33;--bg2:#17283a;--panel:#262948;--ink:#f3f3fb;--muted:#b4b7d4;--line:#3a3e66;
    --cardbg:#12413d;--cardink:#7be8dc;--stripbg:#34385e;
    --okbg:#14532d;--okink:#bbf7d0;--nobg:#4d3a0a;--noink:#ffe29a;
    --shadow:0 6px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c33;--bg2:#17283a;--panel:#262948;--ink:#f3f3fb;--muted:#b4b7d4;--line:#3a3e66;
  --cardbg:#12413d;--cardink:#7be8dc;--stripbg:#34385e;
  --okbg:#14532d;--okink:#bbf7d0;--nobg:#4d3a0a;--noink:#ffe29a;
  --shadow:0 6px 18px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  font-family:"Nirmala UI","Noto Sans Devanagari","Mangal","Kohinoor Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding:clamp(10px,2vw,24px) clamp(10px,2vw,24px) 120px;
}
button{font:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(8px,1.6vw,16px)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:clamp(44px,7vw,64px);flex:none;position:relative}
.brand .logo svg{width:100%;height:auto;display:block}
h1{margin:0;font-size:clamp(22px,4.6vw,38px);line-height:1.1;font-weight:800}
.hdr-tools{display:flex;align-items:center;gap:8px}
.icon-btn{width:clamp(38px,6vw,46px);height:clamp(38px,6vw,46px);border:0;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:60%;height:60%}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{background:#e11d48;color:#fff}
#score{background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(16px,3vw,22px)}

.stage{position:relative;overflow:hidden;background:var(--panel);border-radius:28px;box-shadow:var(--shadow);padding:clamp(12px,2.4vw,28px);min-height:420px}
.q{font-size:clamp(19px,3.8vw,28px);font-weight:800;text-align:center;margin:8px 0 14px}
.q.sm{font-size:clamp(16px,3vw,21px);color:var(--muted)}
.enw{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:14px;padding:0 12px;border:3px solid currentColor}
:root[data-theme="dark"] .enw{background:#233463;color:#8ab4ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .enw{background:#233463;color:#8ab4ff}}

/* week board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,1.2vw,14px)}
.slot{
  container-type:inline-size;background:var(--c);border-radius:20px;padding:8px;color:#27294a;
  box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s;
}
.shead{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:clamp(11px,13cqw,20px);line-height:1.1;max-width:100%}
.shead svg{width:clamp(26px,44cqw,50px);height:auto}
.zone{
  height:clamp(54px,34cqw,84px);border:3px dashed rgba(39,41,74,.45);border-radius:14px;background:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
}
.slot.ok .zone{border-style:solid;border-color:rgba(39,41,74,.25);background:rgba(255,255,255,.8)}
.placed{font-weight:800;font-size:clamp(14px,21cqw,34px);color:#27294a;animation:pop .45s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap}
.slot.over{transform:scale(1.06);box-shadow:0 0 0 4px var(--ink),0 8px 16px rgba(0,0,0,.25)}
.slot.shake{animation:shake .45s}
.slot.pulse{animation:ring 1s infinite}

.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(14px,2.4vw,26px);padding:14px;border-radius:22px;background:var(--stripbg);min-height:80px}
.card{
  background:var(--cardbg);color:var(--cardink);border:3px solid currentColor;border-radius:18px;
  padding:10px 18px;font-weight:800;font-size:clamp(22px,4.6vw,34px);line-height:1.2;
  box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
}
.card.lifting{opacity:.25}
.card.sel{outline:4px solid var(--ink);transform:translateY(-5px)}
.card.pulse{animation:ring 1s infinite}
.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;transform:rotate(-4deg) scale(1.08);box-shadow:0 14px 26px rgba(0,0,0,.35);opacity:.95}

/* arrange */
.row7{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,1.2vw,14px);container-type:inline-size}
.row7 .card{padding:10px 2px;text-align:center;font-size:clamp(15px,4.4cqw,34px);white-space:nowrap;position:relative}
.row7 .card.ok{background:var(--c);color:#27294a;border-color:rgba(39,41,74,.4)}
.row7 .card .tick{position:absolute;top:-8px;right:-6px;background:var(--ok);color:#fff;width:22px;height:22px;border-radius:50%;font-size:14px;line-height:22px;text-align:center}
.card.over{transform:scale(1.07);box-shadow:0 0 0 4px var(--ink)}

/* ytt */
.yslots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.6vw,18px)}
.yslots .slot .shead{flex-direction:row;gap:8px;font-size:clamp(18px,10cqw,30px)}
.yslots .shead small{display:block;font-size:.55em;font-weight:700;opacity:.85}
.yslots .zone{height:clamp(64px,30cqw,100px)}
.yslots .placed{font-size:clamp(18px,17cqw,36px)}
.todaychip{display:inline-block;background:var(--c);color:#27294a;border-radius:16px;padding:0 14px;box-shadow:0 4px 0 rgba(0,0,0,.14)}

/* choices */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.6vw,16px);margin-top:6px}
.opt{
  --b:#f472b6;border:0;border-bottom:6px solid var(--b);border-radius:20px;padding:clamp(14px,2.4vw,22px) 6px;
  background:var(--cardbg);color:var(--cardink);font-weight:800;font-size:clamp(22px,5vw,36px);line-height:1.2;
  box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .1s;
}
.opt:nth-child(3n+2){--b:#fbbf24}.opt:nth-child(3n+3){--b:#38bdf8}
.opt:active{transform:translateY(3px)}
.opt.bad{opacity:.35;pointer-events:none}
.opt.shake{animation:shake .45s}
.opt.good{background:var(--ok);color:#fff;border-bottom-color:#14532d;animation:pop .45s}

.chain{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vw,12px);margin:6px 0 4px}
.chain .card{cursor:default;touch-action:auto;font-size:clamp(18px,4vw,30px);padding:10px clamp(8px,2vw,18px)}
.chain .card.q0{background:var(--stripbg);color:var(--muted);border-style:dashed;min-width:2.4em;text-align:center}
.chain .arr{display:flex;color:var(--muted)}.chain .arr svg{width:clamp(20px,4vw,30px);height:auto}

.fb{margin-top:14px;border-radius:20px;padding:12px 14px;text-align:center;font-weight:800;font-size:clamp(18px,3.6vw,26px)}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:var(--okink);animation:pop .4s}
.fb.no{background:var(--nobg);color:var(--noink)}
.fb .sub{font-size:.75em;opacity:.85}
.fb .ans{font-size:clamp(34px,8vw,60px);line-height:1.2;color:inherit}
.fb .next{font-size:clamp(14px,2.6vw,17px);margin-top:4px;opacity:.85}
.fb .eqline{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:clamp(20px,4vw,30px);margin-top:4px}
.fb .hintline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:clamp(16px,3.2vw,22px)}
.fb .hintline svg{width:34px;height:34px}

/* clues */
.clue{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;justify-items:center}
.scene{width:min(100%,380px)}
.scene svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:var(--shadow)}
.cal{width:100%;max-width:560px;background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin:8px auto}
.cal::before{content:'';display:block;height:16px;background:#ef476f}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px}
.sd{
  aspect-ratio:1/1.05;border-radius:12px;background:var(--stripbg);border:2px solid var(--line);position:relative;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:clamp(10px,2.6vw,18px);
}
.sd .mi{position:absolute;inset:12%;display:flex}
.sd .mi svg{width:100%;height:100%}
.sd b{position:relative;z-index:1;opacity:0;animation:fade .3s forwards;background:rgba(255,255,255,.85);color:#27294a;border-radius:8px;padding:0 6px}
.sd.kn{background:#cfe8ff;border-color:#60a5fa}
.sd.on{background:#ffb703;border-color:#c2410c;transform:scale(1.1);animation:boxpulse 1.1s infinite;color:#27294a}

.cycle{width:min(100%,380px);display:block;margin:8px auto 0}
.cycle .cn{animation:pop .5s both cubic-bezier(.2,.9,.3,1.3)}
.cycle .ring{animation:spin 40s linear infinite;transform-origin:180px 170px}

.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf span{position:absolute;top:-40px;animation:fall 1.6s ease-in forwards}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:clamp(8px,2vw,16px);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 45%);pointer-events:none;
}
.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px clamp(16px,3vw,28px);color:#fff;font-weight:800;font-size:clamp(17px,3.4vw,23px);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#bListen{background:#0369a1}#bChal{background:#c2410c}#bReset{background:#6d28d9}
#bListen.on{animation:pulse .8s infinite}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:92vw;text-align:center;font-size:clamp(15px,3vw,18px)}

@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.9)}50%{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
@keyframes boxpulse{0%,100%{transform:scale(1.1)}50%{transform:scale(1.18)}}
@keyframes fall{to{transform:translateY(640px) rotate(300deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
@media(max-width:900px){
  .board,.row7{grid-template-columns:repeat(4,1fr)}
  .row7 .card{font-size:clamp(15px,3.6vw,26px)}
}
@media(max-width:480px){
  .opt{font-size:clamp(18px,5.4vw,26px)}
  .tray{gap:8px;padding:10px}
  .card{padding:8px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="logo"></div>
      <h1>सप्ताह के दिन खोजो</h1>
    </div>
    <div class="hdr-tools">
      <div id="score" aria-live="polite">⭐ 0</div>
      <button class="icon-btn" id="bMute" aria-label="आवाज़ बंद करो" aria-pressed="false" title="आवाज़ चालू / बंद"></button>
      <button class="icon-btn" id="bFull" aria-label="फुलस्क्रीन" title="फुलस्क्रीन"></button>
    </div>
  </header>
  <section class="stage" id="stage" aria-live="polite"></section>
</div>

<div class="bar">
  <button class="btn" id="bChal">🎯 Challenge</button>
  <button class="btn" id="bListen">🔊 सुनो</button>
  <button class="btn" id="bReset">↺ Reset</button>
</div>
<div id="toast" hidden></div>

function sceneFor(i){return '<div class="scene">'+(i===6?SCENE.family:(i===5?SCENE.play:SCENE.school))+'</div>';}

/* calendar week strip: t = highlighted index */
function strip(t,o){
  o=o||{};
  var h='<div class="cal"><div class="strip">';
  for(var k=0;k<7;k++){
    var cls='sd'+(k===t?' on':'')+((o.known&&o.known.indexOf(k)>=0)?' kn':'');
    var num=(o.count&&k<=t)?'<b style="animation-delay:'+(k*.45)+'s">'+DAYS[k].en.slice(0,3)+'</b>':'';
    var ic=k===0?'<i class="mi">'+IC.school+'</i>':(k===6?'<i class="mi">'+IC.sun+'</i>':'');
    h+='<div class="'+cls+'">'+ic+num+'</div>';
  }
  return h+'</div></div>';
}
function cycleSVG(){
  var cx=180,cy=170,R=125;
  var h='<svg class="cycle" viewBox="0 0 360 340" role="img" aria-label="सात दिनों का चक्र">';
  h+='<circle class="ring" cx="180" cy="170" r="125" fill="none" stroke="#9aa0c4" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>';
  for(var i=0;i<7;i++){
    var a=(-90+i*360/7)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    h+='<g class="cn" style="animation-delay:'+(i*.12)+'s"><rect x="'+(x-46).toFixed(1)+'" y="'+(y-19).toFixed(1)+'" width="92" height="38" rx="14" fill="'+DAYS[i].c+'" stroke="#27294a" stroke-opacity=".25" stroke-width="2"/><text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" font-size="20" font-weight="800" fill="#27294a">'+DAYS[i].h+'</text></g>';
    var rot=(i+.5)*360/7,b=(-90+rot)*Math.PI/180,mx=cx+R*Math.cos(b),my=cy+R*Math.sin(b);
    h+='<path d="M-7 -6L7 0L-7 6z" fill="#7b80a6" transform="translate('+mx.toFixed(1)+' '+my.toFixed(1)+') rotate('+rot.toFixed(1)+')"/>';
  }
  h+='<g transform="translate(150 118) scale(1.25)">'+IC.sun.replace('<svg viewBox="0 0 48 48" aria-hidden="true">','').replace('</svg>','')+'</g>';
  h+='<g transform="translate(176 150) scale(.8)">'+IC.moon.replace('<svg viewBox="0 0 48 48" aria-hidden="true">','').replace('</svg>','')+'</g>';
  h+='<text x="180" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#7b80a6">सप्ताह</text></svg>';
  return h;
}

/* ---------- State ---------- */
var stage=$('#stage');
var mode='board',B=null,Q=null,sel=null,score=0,answered=0,unlocked=false,lastType=null,lastSpoken=-1,timer=null;

/* ---------- Sound ---------- */
var muted=false;try{muted=localStorage.getItem('hdays-muted')==='1';}catch(e){}
var HAS_TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),voice=null,warned=false;
function loadVoices(){if(!HAS_TTS)return;var vs=speechSynthesis.getVoices();voice=null;for(var i=0;i<vs.length;i++){if(/^hi/i.test(vs[i].lang)){voice=vs[i];break;}}}
if(HAS_TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speakMany(list){
  if(muted)return;
  if(!HAS_TTS){toast('इस ब्राउज़र में आवाज़ उपलब्ध नहीं है');return;}
  speechSynthesis.cancel();
  if(!voice&&!warned&&speechSynthesis.getVoices().length){warned=true;toast('हिन्दी आवाज़ नहीं मिली — उच्चारण अलग हो सकता है');}
  var btn=$('#bListen');
  list.forEach(function(t,i){
    var u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';if(voice)u.voice=voice;u.rate=.8;
    if(i===0)u.onstart=function(){btn.classList.add('on');};
    if(i===list.length-1)u.onend=u.onerror=function(){btn.classList.remove('on');};
    speechSynthesis.speak(u);
  });
}
function speak(t){speakMany([t]);}
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}

/* ---------- Common rendering helpers ---------- */
function fbHTML(f){return f?'<div class="fb '+f.cls+'">'+f.html+'</div>':'';}
function cardHTML(id,txt,extra){
  return '<div class="card'+(sel===String(id)?' sel':'')+(extra||'')+'" data-card="'+id+'" role="button" tabindex="0">'+txt+'</div>';
}
function okFB(idx,extra){
  return {cls:'ok',html:'<div>🎉 बहुत बढ़िया!</div><div class="sub">सही उत्तर</div><div class="ans">'+DAYS[idx].h+'</div>'+(extra||'')+'<div class="next">🔊 सुनो · आगे बढ़ने के लिए 🎯 अगला</div>'};
}
function thinkFB(extra){return {cls:'no',html:'<div>💡 एक बार फिर सोचो!</div>'+(extra||'')};}
function confetti(){
  var f=document.createElement('div');f.className='conf';
  var em=['🎉','⭐','✨','🌟','🎊'];
  for(var i=0;i<16;i++){
    var s=document.createElement('span');s.textContent=pick(em);
    s.style.left=rnd(2,94)+'%';s.style.animationDelay=(Math.random()*.4)+'s';s.style.fontSize=rnd(18,32)+'px';
    f.appendChild(s);
  }
  stage.appendChild(f);setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},2200);
}
function updScore(){$('#score').textContent='⭐ '+score;}
function setBtn(){
  var done=(mode==='board'&&B&&B.complete)||(mode==='chal'&&Q&&Q.done);
  $('#bChal').textContent=done?'🎯 अगला':'🎯 Challenge';
}
function rerender(){
  if(mode==='board')renderBoard();else if(mode==='chal'&&Q)renderQ();
  setBtn();
}

/* ---------- MAIN WEEK BOARD ---------- */
function newBoard(){
  return {done:range(7).map(function(){return false;}),order:shuffle(range(7)),wr:{},pulse:-1,shake:-1,fb:null,complete:false};
}
function renderBoard(){
  var b=B,h='';
  h+='<div class="q">'+(b.complete?'':'कार्ड को खींचकर सही दिन के खाने में रखो')+'</div><div class="board">';
  for(var i=0;i<7;i++){
    h+='<div class="slot'+(b.done[i]?' ok':'')+(b.pulse===i&&!b.done[i]?' pulse':'')+(b.shake===i?' shake':'')+'" data-drop="slot:'+i+'" style="--c:'+DAYS[i].c+'">'+
       '<div class="shead">'+IC[DAYICON[i]]+'<span>'+DAYS[i].en+'</span></div>'+
       '<div class="zone">'+(b.done[i]?'<div class="placed">'+DAYS[i].h+'</div>':'')+'</div></div>';
  }
  h+='</div>';
  if(b.complete){
    h+=fbHTML(b.fb)+cycleSVG();
  }else{
    h+='<div class="tray">'+b.order.filter(function(i){return !b.done[i];}).map(function(i){
      return cardHTML(i,DAYS[i].h,(b.pulseCard===i?' pulse':''));
    }).join('')+'</div>'+fbHTML(b.fb);
  }
  stage.innerHTML=h;
}
function boardDrop(id,drop){
  var p=drop.split(':');if(p[0]!=='slot')return;
  var c=+id,s=+p[1],b=B;
  if(b.done[s]||b.done[c])return;
  sel=null;b.shake=-1;
  if(c===s){
    b.done[s]=true;b.pulse=-1;b.pulseCard=-1;b.fb=null;lastSpoken=c;speak(DAYS[c].h);
    if(b.done.every(function(x){return x;})){
      b.complete=true;score++;updScore();unlocked=true;
      b.fb={cls:'ok',html:'<div>🎉 बहुत बढ़िया! आपने सप्ताह के दिनों को सही क्रम में लगाया।</div><div class="next">🔊 सुनो · 🎯 Challenge</div>'};
      renderBoard();confetti();setBtn();return;
    }
  }else{
    b.shake=s;b.wr[c]=(b.wr[c]||0)+1;
    if(b.wr[c]>=2){
      b.pulse=c;b.pulseCard=c;
      b.fb=thinkFB('<div class="hintline">👀 चमकती हुई सही जगह देखो</div>');
    }else{
      var before=c<s;
      b.fb=thinkFB('<div class="hintline">'+(before?ARR_L:ARR_R)+'<span>यह कार्ड '+DAYS[s].en+(before?' से पहले':' के बाद')+' आएगा</span></div>');
    }
  }
  renderBoard();setBtn();
}

/* ---------- CHALLENGES ---------- */
function chainHTML(items){
  var h='<div class="chain">';
  items.forEach(function(it,k){
    if(k>0)h+='<span class="arr">'+ARR_R+'</span>';
    h+=it===null?'<div class="card q0">?</div>':'<div class="card">'+DAYS[it].h+'</div>';
  });
  return h+'</div>';
}
function mkChoice(type,t,vis,text,hintKnown){
  var others=shuffle(range(7).filter(function(i){return i!==t;})).slice(0,2);
  var opts=shuffle([t].concat(others)).map(function(i){return {i:i,st:''};});
  return {type:type,t:t,vis:vis,text:text,opts:opts,mistakes:0,done:false,fb:null,last:-1,known:hintKnown||[],revealed:false};
}
function makeQ(){
  var types=['clue','match','next','prev','ytt','arrange'];
  if(unlocked||answered>=4)types.push('recall','recall');
  var t;do{t=pick(types);}while(t===lastType);
  lastType=t;
  var q,i;
  if(t==='clue'){
    i=rnd(0,6);
    q=mkChoice(t,i,'<div class="clue">'+sceneFor(i)+strip(i)+'</div>','यह कौन-सा दिन है?');
  }else if(t==='match'){
    i=rnd(0,6);
    q=mkChoice(t,i,strip(i),'Which Hindi word means <span class="enw">'+DAYS[i].en+'</span>?');
  }else if(t==='next'){
    i=rnd(0,4);
    q=mkChoice(t,i+2,chainHTML([i,i+1,null]),DAYS[i+1].h+' के बाद कौन-सा दिन आता है?',[i,i+1]);
  }else if(t==='prev'){
    i=rnd(1,5);
    q=mkChoice(t,i-1,chainHTML([null,i,i+1]),DAYS[i].h+' से पहले कौन-सा दिन आता है?',[i,i+1]);
  }else if(t==='recall'){
    if(Math.random()<.5){i=rnd(0,6);q=mkChoice(t,i,'','What is <span class="enw">'+DAYS[i].en+'</span> in Hindi?');}
    else{i=rnd(0,5);q=mkChoice(t,i+1,'','What comes after <span class="enw">'+DAYS[i].h+'</span>?',[i]);}
  }else if(t==='ytt'){
    i=rnd(1,5);
    var extra=shuffle(range(7).filter(function(k){return k<i-1||k>i+1;})).slice(0,2);
    q={type:t,a:i,slots:[false,false,false],tray:shuffle([i-1,i,i+1].concat(extra)),wr:[0,0,0],mistakes:0,done:false,fb:null,pulseCard:-1,shake:-1};
  }else{
    var ord;do{ord=shuffle(range(7));}while(ord.every(function(v,k){return v===k;}));
    q={type:t,order:ord,mistakes:0,done:false,fb:null,okc:ord.filter(function(v,k){return v===k;}).length};
  }
  return q;
}
function renderQ(){
  var q=Q,h='';
  if(q.opts){
    h='<div class="act">'+q.vis+'<div class="q">'+q.text+'</div><div class="opts">'+
      q.opts.map(function(o,k){
        return '<button class="opt'+(o.st==='bad'?' bad':'')+(o.st==='good'?' good':'')+((k===q.last&&o.st==='bad')?' shake':'')+'" data-opt="'+k+'">'+DAYS[o.i].h+'</button>';
      }).join('')+'</div>'+fbHTML(q.fb)+'</div>';
  }else if(q.type==='ytt'){
    var labels=[['कल','⬅ बीता हुआ','#bcd4ff',ARR_L],['आज','','#ffe27a',IC.sun],['कल','आने वाला ➡','#b8f0c0',ARR_R]];
    h='<div class="act"><div class="q">आज = <span class="todaychip" style="--c:'+DAYS[q.a].c+'">'+DAYS[q.a].h+'</span></div><div class="q sm">कार्ड रखकर कल, आज और आने वाला कल बनाओ</div><div class="yslots">';
    for(var k=0;k<3;k++){
      var L=labels[k];
      h+='<div class="slot'+(q.slots[k]?' ok':'')+(q.shake===k?' shake':'')+'" data-drop="slot:'+k+'" style="--c:'+L[2]+'"><div class="shead"><div style="width:clamp(24px,30cqw,44px);display:flex">'+L[3]+'</div><div><b>'+L[0]+'</b><small>'+L[1]+'</small></div></div><div class="zone">'+(q.slots[k]?'<div class="placed">'+DAYS[q.a-1+k].h+'</div>':'')+'</div></div>';
    }
    h+='</div>';
    if(!q.done){
      h+='<div class="tray">'+q.tray.filter(function(i){return !isPlaced(i);}).map(function(i){return cardHTML(i,DAYS[i].h,q.pulseCard===i?' pulse':'');}).join('')+'</div>';
    }
    h+=fbHTML(q.fb)+'</div>';
  }else if(q.type==='arrange'){
    h='<div class="act"><div class="q">सप्ताह के दिनों को सही क्रम में लगाओ</div><div class="row7">'+
      q.order.map(function(v,k){
        var ok=(v===k);
        return '<div class="card'+(ok?' ok':'')+(sel==='p'+k?' sel':'')+'" data-card="p'+k+'" data-drop="pos:'+k+'" role="button" tabindex="0" style="--c:'+DAYS[v].c+'">'+DAYS[v].h+(ok?'<span class="tick">✓</span>':'')+'</div>';
      }).join('')+'</div>'+strip(-1)+fbHTML(q.fb)+(q.done?cycleSVG():'')+'</div>';
  }
  stage.innerHTML=h;
}
function isPlaced(i){return Q.slots.some(function(f,k){return f&&(Q.a-1+k)===i;});}

function onOpt(k){
  var q=Q;if(!q||q.done)return;
  var o=q.opts[k];if(o.st)return;
  if(o.i===q.t){
    o.st='good';q.done=true;answered++;
    if(q.mistakes===0){score++;updScore();}
    q.fb=okFB(q.t);lastSpoken=q.t;
    renderQ();confetti();setBtn();speak(DAYS[q.t].h);return;
  }
  o.st='bad';q.mistakes++;q.last=k;
  if(q.mistakes>=2){
    q.done=true;answered++;q.revealed=true;
    q.opts.forEach(function(x){if(x.i===q.t)x.st='good';});
    q.fb={cls:'no',html:'<div>✅ सही उत्तर</div><div class="ans">'+DAYS[q.t].h+'</div><div class="next">आगे बढ़ने के लिए 🎯 अगला</div>'};
    lastSpoken=q.t;renderQ();setBtn();speak(DAYS[q.t].h);return;
  }
  q.fb=thinkFB(strip(q.t,{count:true,known:q.known}));
  renderQ();
}
function yttDrop(id,drop){
  var q=Q,p=drop.split(':');if(p[0]!=='slot')return;
  var k=+p[1],c=+id;
  if(q.slots[k]||isPlaced(c))return;
  sel=null;q.shake=-1;
  if(c===q.a-1+k){
    q.slots[k]=true;q.pulseCard=-1;q.fb=null;lastSpoken=c;speak(DAYS[c].h);
    if(q.slots.every(function(x){return x;})){
      q.done=true;answered++;if(q.mistakes===0){score++;updScore();}
      q.fb={cls:'ok',html:'<div>🎉 बहुत बढ़िया!</div><div class="eqline"><span>कल = '+DAYS[q.a-1].h+'</span><span>आज = '+DAYS[q.a].h+'</span><span>कल = '+DAYS[q.a+1].h+'</span></div><div class="next">🔊 सुनो · आगे बढ़ने के लिए 🎯 अगला</div>'};
      renderQ();confetti();setBtn();return;
    }
  }else{
    q.mistakes++;q.shake=k;q.wr[k]++;
    if(q.wr[k]>=2){q.pulseCard=q.a-1+k;q.fb=thinkFB('<div class="hintline">👀 चमकता हुआ कार्ड देखो</div>');}
    else if(k===0)q.fb=thinkFB('<div class="hintline">'+ARR_L+'<span>आज से एक दिन पीछे जाओ</span></div>');
    else if(k===2)q.fb=thinkFB('<div class="hintline">'+ARR_R+'<span>आज से एक दिन आगे जाओ</span></div>');
    else q.fb=thinkFB('<div class="hintline">☝️ ऊपर देखो: आज कौन-सा दिन है?</div>');
  }
  renderQ();
}
function arrDrop(src,drop){
  var q=Q,i=+src.slice(1),j=+drop.split(':')[1];
  if(q.done||isNaN(i)||isNaN(j)||i===j)return;
  sel=null;
  var t=q.order[i];q.order[i]=q.order[j];q.order[j]=t;
  var okc=q.order.filter(function(v,k){return v===k;}).length;
  if(okc===7){
    q.done=true;answered++;score++;updScore();
    q.fb={cls:'ok',html:'<div>🎉 बहुत बढ़िया! आपने सप्ताह के दिनों को सही क्रम में लगाया।</div><div class="next">🔊 सुनो · आगे बढ़ने के लिए 🎯 अगला</div>'};
    renderQ();confetti();setBtn();return;
  }
  if(okc<=q.okc){q.mistakes++;q.fb=thinkFB('');}
  else q.fb={cls:'ok',html:'<div>👍 और आगे बढ़ो!</div>'};
  q.okc=okc;
  renderQ();
}

/* ---------- Drag & tap engine ---------- */
var drag=null;
function clearOver(){var o=document.querySelectorAll('.over');for(var i=0;i<o.length;i++)o[i].classList.remove('over');}
function cleanupDrag(){
  if(!drag)return;
  if(drag.ghost&&drag.ghost.parentNode)drag.ghost.parentNode.removeChild(drag.ghost);
  if(drag.el)drag.el.classList.remove('lifting');
  clearOver();drag=null;
}
function targetAt(x,y){
  var el=document.elementFromPoint?document.elementFromPoint(x,y):null;
  return el?el.closest('[data-drop]'):null;
}
stage.addEventListener('pointerdown',function(e){
  var c=e.target.closest('[data-card]');if(!c)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(drag)cleanupDrag();
  drag={el:c,id:c.getAttribute('data-card'),sx:e.clientX,sy:e.clientY,moved:false,ghost:null};
  try{c.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved){
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<9)return;
    drag.moved=true;
    var r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);
    g.removeAttribute('data-card');g.removeAttribute('data-drop');g.classList.remove('sel','pulse','over');g.classList.add('ghost');
    g.style.width=r.width+'px';g.style.height=r.height+'px';
    document.body.appendChild(g);drag.ghost=g;drag.w=r.width;drag.h=r.height;
    drag.el.classList.add('lifting');
  }
  drag.ghost.style.left=(e.clientX-drag.w/2)+'px';
  drag.ghost.style.top=(e.clientY-drag.h/2-14)+'px';
  clearOver();
  var t=targetAt(e.clientX,e.clientY);if(t&&t!==drag.el)t.classList.add('over');
});
document.addEventListener('pointerup',function(e){
  if(!drag)return;
  var d=drag;
  if(d.moved){
    var t=targetAt(e.clientX,e.clientY),id=d.id;
    cleanupDrag();
    if(t)handleDrop(id,t.getAttribute('data-drop'));
  }else{
    cleanupDrag();handleTap(d.id);
  }
});
document.addEventListener('pointercancel',cleanupDrag);

function handleDrop(id,drop){
  if(mode==='board')boardDrop(id,drop);
  else if(mode==='chal'&&Q){
    if(Q.type==='ytt')yttDrop(id,drop);
    else if(Q.type==='arrange')arrDrop(id,drop);
  }
}
function handleTap(id){
  if(mode==='chal'&&Q&&Q.type==='arrange'){
    if(sel&&sel!==id){var s=sel;sel=null;arrDrop(s,'pos:'+id.slice(1));return;}
  }
  sel=(sel===id)?null:id;
  rerender();
}
stage.addEventListener('click',function(e){
  var o=e.target.closest('[data-opt]');
  if(o&&mode==='chal'&&Q&&Q.opts){onOpt(+o.getAttribute('data-opt'));return;}
  if(e.target.closest('[data-card]'))return;
  var t=e.target.closest('[data-drop]');
  if(t&&sel){var id=sel;sel=null;handleDrop(id,t.getAttribute('data-drop'));}
});
stage.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var c=e.target.closest('[data-card]');
  if(c){e.preventDefault();handleTap(c.getAttribute('data-card'));return;}
});

/* ---------- Buttons ---------- */
function startChallenge(){
  if(timer){clearTimeout(timer);timer=null;}
  if(HAS_TTS)speechSynthesis.cancel();
  mode='chal';sel=null;Q=makeQ();renderQ();setBtn();
  if(stage.getBoundingClientRect().top<0)stage.scrollIntoView({behavior:'smooth',block:'start'});
}
function onListen(){
  if(muted){toast('🔇 आवाज़ बंद है — ऊपर वाले आइकन से चालू करो');return;}
  if(mode==='board'){
    if(B.complete){speakMany(DAYS.map(function(d){return d.h;}));return;}
    if(lastSpoken>=0){speak(DAYS[lastSpoken].h);return;}
    toast('पहले एक कार्ड सही जगह पर रखो 🙂');return;
  }
  if(mode==='chal'&&Q){
    if(!Q.done){toast('पहले सोचकर जवाब चुनो 🙂');return;}
    if(Q.type==='ytt'){speakMany([DAYS[Q.a-1].h,DAYS[Q.a].h,DAYS[Q.a+1].h]);return;}
    if(Q.type==='arrange'){speakMany(DAYS.map(function(d){return d.h;}));return;}
    speak(DAYS[Q.t].h);return;
  }
}
function reset(){
  if(timer){clearTimeout(timer);timer=null;}
  if(HAS_TTS)speechSynthesis.cancel();
  $('#bListen').classList.remove('on');
  score=0;answered=0;unlocked=false;lastType=null;lastSpoken=-1;sel=null;Q=null;updScore();
  mode='board';B=newBoard();renderBoard();setBtn();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#bChal').addEventListener('click',startChallenge);
$('#bListen').addEventListener('click',onListen);
$('#bReset').addEventListener('click',reset);

/* mute + fullscreen */
var ICO_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var ICO_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
var ICO_FS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
var ICO_XFS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function paintMute(){
  var b=$('#bMute');b.innerHTML=muted?ICO_OFF:ICO_ON;b.classList.toggle('off',muted);
  b.setAttribute('aria-pressed',muted?'true':'false');
  b.setAttribute('aria-label',muted?'आवाज़ चालू करो':'आवाज़ बंद करो');
  $('#bListen').style.opacity=muted?'.55':'';
}
function toggleMute(){
  muted=!muted;try{localStorage.setItem('hdays-muted',muted?'1':'0');}catch(e){}
  if(muted&&HAS_TTS){speechSynthesis.cancel();$('#bListen').classList.remove('on');}
  paintMute();toast(muted?'🔇 आवाज़ बंद':'🔊 आवाज़ चालू');
}
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function paintFs(){var b=$('#bFull'),on=!!fsEl();b.innerHTML=on?ICO_XFS:ICO_FS;b.setAttribute('aria-label',on?'फुलस्क्रीन बंद करो':'फुलस्क्रीन');}
function toggleFs(){
  var de=document.documentElement;
  try{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{
      var req=de.requestFullscreen||de.webkitRequestFullscreen;
      if(!req){toast('इस डिवाइस पर फुलस्क्रीन उपलब्ध नहीं है');return;}
      var p=req.call(de);if(p&&p.catch)p.catch(function(){toast('फुलस्क्रीन की अनुमति नहीं मिली');});
    }
  }catch(e){toast('फुलस्क्रीन उपलब्ध नहीं है');}
}
document.addEventListener('fullscreenchange',paintFs);
document.addEventListener('webkitfullscreenchange',paintFs);
$('#bMute').addEventListener('click',toggleMute);
$('#bFull').addEventListener('click',toggleFs);
paintMute();paintFs();

B=newBoard();renderBoard();setBtn();
})();
</script>
