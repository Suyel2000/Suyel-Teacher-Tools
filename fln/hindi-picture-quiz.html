  const sub=S[cell]; if(!sub) return null;
  const a=q[3]?q[3].replace('~',ADJ[cell]):'';
  return [a,sub,q[4],verb(q[5],q[6],vc)].filter(Boolean).join(' ')+'।';
}
function build(q,lv,i){
  const S=F[q[1]],c=q[2],g=c^1,n=c^2,correct=sentence(S,c,c,q);
  const L=F.L;
  const cand=[[S,c,g],[S,g,g],[S,n,n],[S,c,n],[S,g,c],[S,n,c],[L,g,g],[L,n,n],[L,c^3,c^3]];
  const seen=new Set([correct]),wrong=[];
  for(const [T,cell,vc] of cand){
    if(wrong.length==3)break;
    if(cell==c&&T===S&&vc==c)continue;
    if(T[cell]===0)continue;
    if(NEU.has(q[1])&&T===S&&vc!==c)continue;
    if(cell<2&&vc>=2)continue;                       // singular subject + plural verb: avoids honorific ambiguity
    if(T===S&&cell===n&&S[n]===S[c]&&c<2&&vc>=2)continue;
    const s=sentence(T,cell,vc,q);
    if(s&&!seen.has(s)){seen.add(s);wrong.push(s);}
  }
  const opts=[{t:correct,ok:true},...wrong.map(t=>({t,ok:false}))];
  return {id:'L'+(lv+1)+'-'+String(i+1).padStart(2,'0'),level:lv+1,image:'../images/'+q[0]+'.png',
    alt:q[0].replace(/-/g,' '),instruction:INSTR[(i+lv)%INSTR.length],options:opts,tag:TAGS[q[6]]};
}
const QUESTIONS=BANK.map((lvl,l)=>lvl.map((q,i)=>build(q,l,i)));

/* ---------- Validation (console) ---------- */
(function(){
  let bad=0;
  if(QUESTIONS.length!==3)bad++;
  QUESTIONS.forEach(l=>{if(l.length!==25)bad++;l.forEach(q=>{
    if(q.options.length!==4||q.options.filter(o=>o.ok).length!==1||new Set(q.options.map(o=>o.t)).size!==4||q.options.some(o=>o.t.trim().split(/\s+/).length<2)){bad++;}
  });});
})();

/* ---------- Game ---------- */
const $=id=>document.getElementById(id);
const ST=LEVELS.map(()=>({idx:0,results:Array(25).fill(false)}));
let lv=0,sel=null,solved=false,cur=null;
const LET=['क','ख','ग','घ'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cnt=l=>ST[l].results.filter(Boolean).length;
const calm=()=>{if(window.speechSynthesis)speechSynthesis.cancel();};

function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const E=['🎉','⭐','✨','🎈','🌟','💖'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];
    s.style.left=Math.random()*100+'vw';s.style.fontSize=(16+Math.random()*18)+'px';
    s.style.animationDuration=(1.4+Math.random()*1.4)+'s';s.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3400);}
}

$('tabs').innerHTML=LEVELS.map((l,i)=>`<button class="tab" role="tab" style="--c:${l.c}" data-l="${i}"><span>${l.n}</span><small>${l.d}</small><em id="tp${i}"></em></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)setLevel(+b.dataset.l);};
function setLevel(l){lv=l;$('end').classList.add('hide');calm();load();}
function tabs(){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('on',i===lv);t.setAttribute('aria-selected',i===lv);$('tp'+i).textContent='⭐ '+cnt(i)+'/25';});
}

function load(){
  const s=ST[lv],idx=s.idx;
  cur=QUESTIONS[lv][idx];if(!cur.view)cur.view=shuffle(cur.options);
  sel=null;solved=s.results[idx];
  document.documentElement.style.setProperty('--lc',LEVELS[lv].c);
  $('qNum').textContent='प्रश्न '+(idx+1)+' / 25';
  $('score').textContent='⭐ अंक: '+cnt(lv)+' / 25';
  $('prog').style.width=(idx/25*100)+'%';
  const pic=$('pic');pic.innerHTML='';
  const img=new Image();img.src=cur.image;img.alt=cur.alt;
  img.onerror=()=>{pic.innerHTML='<div class="ph"><div>🖼️</div>चित्र उपलब्ध नहीं है</div>';};
  pic.appendChild(img);
  $('instr').textContent=cur.instruction;
  $('opts').innerHTML=cur.view.map((o,i)=>`<button class="opt c${i}" role="radio" aria-checked="false" data-i="${i}"><span class="bd">${LET[i]}</span><span class="tx">${o.t}</span></button>`).join('');
  $('fb').textContent='';$('fb').className='fb';
  $('check').disabled=true;$('next').disabled=!solved;
  $('back').disabled=idx===0;$('skip').disabled=solved;
  $('next').innerHTML=idx===24?'परिणाम<span class="t"> देखें</span> 🏆':'अगला<span class="t"> प्रश्न</span> 🎯';
  if(solved){
    const bs=document.querySelectorAll('.opt');
    bs.forEach(x=>{x.disabled=true;x.style.animation='none';});
    bs[cur.view.findIndex(o=>o.ok)].classList.add('ok');
    $('fb').textContent='🎉 बहुत बढ़िया! सही वाक्य!';$('fb').className='fb ok';
  }
  tabs();
}
$('opts').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||b.disabled||solved)return;
  sel=+b.dataset.i;
  document.querySelectorAll('.opt').forEach(x=>{const on=x===b;x.classList.toggle('sel',on);x.setAttribute('aria-checked',on);});
  $('check').disabled=false;$('fb').textContent='';$('fb').className='fb';
};
$('check').onclick=()=>{
  if(sel===null||solved)return;
  const s=ST[lv],btn=document.querySelectorAll('.opt')[sel],fb=$('fb');
  if(cur.view[sel].ok){
    solved=true;s.results[s.idx]=true;btn.classList.remove('sel');btn.classList.add('ok');
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    fb.textContent='🎉 बहुत बढ़िया! सही वाक्य!';fb.className='fb ok';
    $('score').textContent='⭐ अंक: '+cnt(lv)+' / 25';
    $('check').disabled=true;$('next').disabled=false;$('skip').disabled=true;
    tabs();confetti(18);
  }else{
    btn.classList.remove('sel');btn.classList.add('no');btn.disabled=true;sel=null;
    fb.textContent='🤔 वाक्य फिर से पढ़ो और कोशिश करो।';fb.className='fb no';
    $('check').disabled=true;
  }
};
function go(d){
  const s=ST[lv],n=s.idx+d;
  if(n<0)return;
  if(n>24){finish();return;}
  s.idx=n;calm();load();
}
$('next').onclick=()=>{if(solved)go(1);};
$('skip').onclick=()=>{if(!solved)go(1);};
$('back').onclick=()=>go(-1);
function finish(){
  const sc=cnt(lv),sk=25-sc;
  $('endTitle').textContent=LEVELS[lv].n+' पूरा हुआ!';
  $('endScore').textContent=sc+' / 25';
  $('endStars').textContent=sc>=20?'⭐⭐⭐':sc>=12?'⭐⭐☆':'⭐☆☆';
  $('endMsg').textContent='🎉 शाबाश! तुमने 25 में से '+sc+' प्रश्न सही किए।'+(sk?' अभी '+sk+' प्रश्न बाकी हैं।':' पूरे किए गए प्रश्न: 25।');
  $('nextLv').classList.toggle('hide',lv>=LEVELS.length-1);
  $('end').classList.remove('hide');confetti(36);
}
$('closeEnd').onclick=()=>$('end').classList.add('hide');
$('nextLv').onclick=()=>setLevel(lv+1);
function reset(){ST[lv]={idx:0,results:Array(25).fill(false)};QUESTIONS[lv].forEach(q=>{q.view=null;});$('end').classList.add('hide');calm();load();}
$('restart').onclick=reset;
$('replay').onclick=reset;
$('listen').onclick=()=>{
  if(!('speechSynthesis' in window)){$('fb').textContent='इस उपकरण में आवाज़ उपलब्ध नहीं है।';return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(cur.instruction);u.lang='hi-IN';u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.replace('_','-').startsWith('hi'));if(v)u.voice=v;
  speechSynthesis.speak(u);
};

/* ---------- Full screen ---------- */
const FS=$('fs'),root=document.documentElement;
const reqFS=root.requestFullscreen||root.webkitRequestFullscreen,exitFS=document.exitFullscreen||document.webkitExitFullscreen;
const inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const IC_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const IC_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function fsUpdate(){const on=inFS();FS.innerHTML=on?IC_OFF:IC_ON;FS.title=FS.ariaLabel=on?'पूर्ण स्क्रीन बंद करें':'पूर्ण स्क्रीन';}
if(!reqFS)FS.classList.add('hide');
FS.onclick=()=>{try{inFS()?exitFS.call(document):reqFS.call(root);}catch(e){}};
document.addEventListener('fullscreenchange',fsUpdate);document.addEventListener('webkitfullscreenchange',fsUpdate);
fsUpdate();

/* ---------- Start: Level 1 opens directly ---------- */
setLevel(0);
</script>
</body>
</html>
