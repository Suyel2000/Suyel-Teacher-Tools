<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पहला अक्षर पहचानो</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a5a;--muted:#5d6794;--ok:#16a37a;--no:#e2761b;--navy:#2b3a8c;--sun:#ffc83d;
--c0:#ef5b6b;--c1:#f5a623;--c2:#1fb6a6;--c3:#6b5bf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:'Baloo 2','Noto Sans Devanagari','Mangal',sans-serif;
background:radial-gradient(circle at 12% 8%,#ffe9b0 0,transparent 32%),radial-gradient(circle at 92% 18%,#cfe9ff 0,transparent 34%),radial-gradient(circle at 80% 96%,#d9f7ee 0,transparent 36%),#f6f8ff;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{position:relative;background:linear-gradient(135deg,#ffe9b0,#ffd6e0 50%,#cfe9ff);color:var(--ink);text-align:center;padding:6px 56px 22px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(43,58,140,.12)}
.fs,.mu{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.7);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.mu{right:auto;left:12px}
.fs:hover,.mu:hover{background:#fff}
.fs:focus-visible,.mu:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1{margin:0;font-size:clamp(22px,4.4vw,32px);font-weight:800;letter-spacing:.3px;line-height:1.25}
.sub{font-size:clamp(13px,2.4vw,16px);opacity:.9;font-weight:500;line-height:1.2}
main{max-width:720px;margin:-10px auto 0;padding:0 16px 28px}
#game{display:flex;flex-direction:column;align-items:center;gap:14px}
.panel{width:100%;background:#fff;border-radius:30px;box-shadow:0 14px 36px rgba(31,42,90,.14);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#eef0ff;color:var(--navy);border-radius:99px;padding:3px 16px;font-weight:800;font-size:clamp(16px,3vw,21px)}
.pill.s{background:#fff4d2;color:#8a5a00}
.bar{width:100%;height:12px;background:#e6e9fb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c3));border-radius:99px;transition:width .5s}
.pic{width:fit-content;max-width:100%;min-width:200px;height:auto;flex:none;border-radius:28px;background:linear-gradient(145deg,#fffdf4,#eef4ff);border:4px solid #fff;outline:3px dashed #c9d0f5;outline-offset:-3px;box-shadow:inset 0 0 0 1px #e1e6fb;display:grid;place-items:center;padding:12px;overflow:hidden}
.pic img{display:block;width:auto;height:auto;max-width:100%;max-height:min(46vh,380px);object-fit:contain;mix-blend-mode:multiply}
.fb{display:none;text-align:center;min-width:200px;min-height:200px;align-content:center}
.fb .em{font-size:clamp(90px,28vw,150px);line-height:1}
.msg{min-height:3.4em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(22px,5vw,32px);font-weight:800;color:var(--navy)}
.msg small{font-size:clamp(20px,4vw,28px);font-weight:700;color:var(--muted)}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.opts{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opt{font:inherit;font-weight:800;font-size:clamp(42px,12vw,80px);line-height:1.35;border:0;border-radius:24px;padding:4px 0;cursor:pointer;background:#fff;color:var(--c);
border:4px solid var(--c);box-shadow:0 7px 0 var(--c);transition:transform .12s,box-shadow .12s,background .2s}
.opt:nth-child(1){--c:var(--c0)}.opt:nth-child(2){--c:var(--c1)}.opt:nth-child(3){--c:var(--c2)}.opt:nth-child(4){--c:var(--c3)}
.opt:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--c)}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c)}
.opt:focus-visible,.btn:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
.opt.wrong{animation:shake .4s;opacity:.4;pointer-events:none}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 7px 0 #0d7a5a;animation:pop .5s}
.opts.done .opt:not(.right){opacity:.35;pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.14)}}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:800;font-size:clamp(17px,3.4vw,22px);border:0;border-radius:99px;padding:8px 24px;min-height:52px;cursor:pointer;background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(31,42,90,.16);border:2px solid #dfe3fa}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.end{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center}
.end .big{font-size:clamp(30px,7vw,46px);font-weight:800;color:var(--navy)}
.end .trophy{font-size:100px;line-height:1}
.end .btn{font-size:clamp(24px,5vw,32px);padding:14px 40px;background:var(--c3);border-color:var(--c3);color:#fff}
.star{position:fixed;pointer-events:none;font-size:28px;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.opts{gap:8px}.panel{padding:12px}}
</style>
</head>
<body>
<header><button class="mu" id="mu" title="आवाज़ बंद" aria-label="आवाज़ बंद करें">🔊</button><button class="fs" id="fs" title="पूरी स्क्रीन" aria-label="पूरी स्क्रीन">⛶</button><h1>पहला अक्षर पहचानो</h1><div class="sub">देखो • सोचो • पहला अक्षर चुनो</div></header>
<main>
 <div id="game">
  <div class="panel">
   <div class="top"><span class="pill" id="prog">प्रश्न 1 / 30</span><span class="pill s" id="score">⭐ सही: 0</span></div>
   <div class="bar"><i id="barfill"></i></div>
   <div class="pic"><img id="img" alt="चित्र"><div class="fb" id="fb"><div class="em" id="em"></div></div></div>
   <div class="msg" id="msg">इसका पहला अक्षर क्या है?</div>
   <div class="opts" id="opts"></div>
   <div class="ctl">
    <button class="btn" id="hear" disabled>🔊 सुनो</button>
    <button class="btn go" id="next" disabled>🎯 अगला</button>
    <button class="btn" id="shuffle">🔀 मिलाओ</button>
    <button class="btn" id="restart">↺ फिर से</button>
   </div>
  </div>
 </div>
 <div class="panel end" id="end"><div class="trophy">🏆</div><div class="big">🎉 बहुत बढ़िया!</div><div class="big" id="final"></div><button class="btn" id="again">🔄 फिर से खेलें</button></div>
</main>
<script>
/* ---- Edit here: [Hindi word, first letter, image file, fallback emoji] ---- */
const IMG_DIR = "../images/";
let Q = [
["आम","आ","mango.png","🥭"],["अनार","अ","pomegranate.png","🖼️"],["केला","क","banana.png","🍌"],["कमल","क","lotus.png","🪷"],
["गमला","ग","flower-pot.png","🪴"],["गाय","ग","cow.png","🐄"],["चम्मच","च","spoon.png","🥄"],["चिड़िया","च","bird.png","🐦"],
["खरगोश","ख","rabbit.png","🐰"],["घर","घ","house.png","🏠"],["जलेबी","ज","jalebi.png","🖼️"],["जहाज","ज","ship.png","🚢"],
["टमाटर","ट","tomato.png","🍅"],["टोपी","ट","cap.png","🧢"],["डमरू","ड","damru.png","🪘"],["तरबूज","त","watermelon.png","🍉"],
["नल","न","tap.png","🚰"],["नारियल","न","coconut.png","🥥"],["पतंग","प","kite.png","🪁"],["पपीता","प","papaya.png","🖼️"],
["बकरी","ब","goat.png","🐐"],["मछली","म","fish.png","🐟"],["मोर","म","peacock.png","🦚"],["रथ","र","chariot.png","🖼️"],
["सेब","स","apple.png","🍎"],["सूरज","स","sun.png","☀️"],["हाथी","ह","elephant.png","🐘"],["हिरन","ह","deer.png","🦌"],
["कमीज़","क","shirt.png","👕"],["गुलाब","ग","rose.png","🌹"]
];
const POOL = ["अ","आ","इ","उ","क","ख","ग","घ","च","छ","ज","झ","ट","ड","त","द","न","प","फ","ब","भ","म","य","र","ल","व","श","स","ह"];
const $ = id => document.getElementById(id);
let i = 0, score = 0, tries = 0, answered = false, muted = false;
const shuffle = a => { a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]} return a; };

function load(){
  const [w,l,f,e] = Q[i]; answered=false; tries=0;
  $("prog").textContent = `प्रश्न ${i+1} / 30`;
  $("barfill").style.width = (i/30*100)+"%";
  $("score").textContent = `⭐ सही: ${score}`;
  $("msg").className="msg"; $("msg").textContent="इसका पहला अक्षर क्या है?";
  $("next").disabled=true; $("hear").disabled=true; $("next").textContent="🎯 अगला";
  const img=$("img"), fb=$("fb"); img.style.display=""; fb.style.display="none";
  img.onerror=()=>{img.style.display="none";fb.style.display="block";$("em").textContent=e};
  img.src=IMG_DIR+f;
  /* avoid confusing look-alike pair अ / आ as distractors */
  const skip = new Set([l, l==="अ"?"आ":l==="आ"?"अ":""]);
  const wrong = shuffle(POOL.filter(x=>!skip.has(x))).slice(0,3);
  const box=$("opts"); box.className="opts"; box.innerHTML="";
  shuffle([l,...wrong]).forEach(c=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=c;
    b.setAttribute("aria-label","अक्षर "+c); b.onclick=()=>pick(b,c); box.appendChild(b);
  });
}
function pick(btn,c){
  if(answered) return;
  const [w,l]=Q[i], m=$("msg");
  if(c===l){
    answered=true; if(tries===0) score++;
    btn.classList.add("right"); $("opts").classList.add("done");
    m.className="msg ok"; m.innerHTML=`बहुत बढ़िया! 🎉<small>${w} — ${l}</small>`;
    $("score").textContent=`⭐ सही: ${score}`;
    $("next").disabled=false; $("hear").disabled=false;
    $("barfill").style.width=((i+1)/30*100)+"%";
    if(i===29) $("next").textContent="🎯 पूरा करो";
    confetti(btn); speak(w);
  } else { tries++; btn.classList.add("wrong"); m.className="msg no"; m.textContent="फिर से सोचो 🤔"; }
}
function speak(w){ try{ if(muted||!window.speechSynthesis) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w); u.lang="hi-IN"; u.rate=.8; speechSynthesis.speak(u);}catch(e){} }
function confetti(el){
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let k=0;k<14;k++){
    const s=document.createElement("div"); s.className="star"; s.textContent=["⭐","✨","🎉","🌟"][k%4];
    s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.setProperty("--dx",((Math.random()-.5)*320)+"px");
    s.style.setProperty("--dy",((Math.random()-.9)*260)+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
}
function finish(){ $("game").style.display="none"; $("end").style.display="flex";
  $("final").textContent=`आपने 30 में से ${score} प्रश्न सही किए।`; }
function restart(){ i=0; score=0; $("end").style.display="none"; $("game").style.display="flex"; load(); }
$("next").onclick=()=>{ if(i===29) finish(); else { i++; load(); } };
$("hear").onclick=()=>speak(Q[i][0]);
$("mu").onclick=()=>{ muted=!muted; try{speechSynthesis.cancel()}catch(e){}
  $("mu").textContent=muted?"🔇":"🔊"; $("mu").title=muted?"आवाज़ चालू":"आवाज़ बंद";
  $("mu").setAttribute("aria-label",muted?"आवाज़ चालू करें":"आवाज़ बंद करें"); $("hear").style.opacity=muted?".5":""; };
$("shuffle").onclick=()=>{ Q=shuffle(Q); restart(); };
$("restart").onclick=restart;
/* full screen toggle */
const root=document.documentElement;
const reqFS=root.requestFullscreen||root.webkitRequestFullscreen;
const exitFS=document.exitFullscreen||document.webkitExitFullscreen;
if(!reqFS) $("fs").style.display="none";
$("fs").onclick=()=>{ const on=document.fullscreenElement||document.webkitFullscreenElement;
  try{ on ? exitFS.call(document) : reqFS.call(root); }catch(e){} };
const syncFS=()=>{ $("fs").textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"✕":"⛶"; };
document.addEventListener("fullscreenchange",syncFS); document.addEventListener("webkitfullscreenchange",syncFS); $("again").onclick=restart;
load();
</script>
</body>
</html>
