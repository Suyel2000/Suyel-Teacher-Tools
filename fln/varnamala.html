<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>🌸 हिन्दी वर्णमाला — Interactive Chart</title>
<meta name="description" content="इंटरैक्टिव हिन्दी वर्णमाला चार्ट — स्वर और व्यंजन">
<style>
/* ==========================================================================
   हिन्दी वर्णमाला — DESIGN TOKENS
   Palette inspired by laminated classroom charts: cream board background,
   thick "marker" borders, poster-bright primary hues per letter family.
   ========================================================================== */
:root{
  --cream:#FFF8EA;
  --board:#FFFDF7;
  --ink:#2B2420;
  --ink-soft:#6b5f52;
  --sun:#FFB703;
  --tangerine:#FB8B24;
  --berry:#E5383B;
  --leaf:#3A9D45;
  --sky:#2196C4;
  --grape:#8E44AD;
  --vowel-a:#FFE3A3;
  --vowel-b:#FFC978;
  --vowel-border:#E08A1E;
  --cons-a:#BFE7F6;
  --cons-b:#9BD8ED;
  --cons-border:#1B7FA3;
  --radius:22px;
  --radius-sm:12px;
  --shadow:0 10px 24px rgba(60,40,10,.14), 0 2px 6px rgba(60,40,10,.10);
  --shadow-lg:0 20px 45px rgba(60,40,10,.22);
  --font-dev:'Noto Sans Devanagari','Nirmala UI','Kohinoor Devanagari','Mangal',system-ui,sans-serif;
  --font-ui:system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif;
  --dur:1;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html.reduce-motion *{animation-duration:.001s !important; transition-duration:.001s !important;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:
    radial-gradient(circle at 10% 0%, #fff5da 0%, transparent 40%),
    radial-gradient(circle at 90% 10%, #d9f2ff 0%, transparent 45%),
    var(--cream);
  color:var(--ink);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:999;transition:top .2s;}
.skip-link:focus{top:8px;}
button{font-family:inherit;}

/* ---------- HEADER ---------- */
header.chart-header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(120deg,#FF7A59,#FFB703 35%,#3AC1D9 70%,#8E44AD);
  padding:26px 16px 84px;
  text-align:center;
  border-bottom:8px solid var(--ink);
}
.header-inner{position:relative;z-index:3;}
.big-title{
  font-family:var(--font-dev);
  font-size:clamp(2rem,6vw,3.4rem);
  font-weight:900;
  color:#fff;
  margin:6px 0 4px;
  text-shadow:3px 3px 0 rgba(0,0,0,.18), 0 0 30px rgba(255,255,255,.25);
  letter-spacing:1px;
}
.subtitle{
  font-family:var(--font-dev);
  font-size:clamp(.95rem,2.4vw,1.3rem);
  color:#fff;
  font-weight:700;
  background:rgba(0,0,0,.18);
  display:inline-block;
  padding:6px 18px;
  border-radius:999px;
  margin-bottom:6px;
}
.deco-svg{position:absolute;z-index:1;pointer-events:none;}
.deco-svg.sun{top:10px;left:4%;width:70px;height:70px;animation:spin 18s linear infinite;}
.deco-svg.cloud1{top:18px;right:6%;width:90px;opacity:.9;animation:float 6s ease-in-out infinite;}
.deco-svg.cloud2{top:70px;left:16%;width:60px;opacity:.85;animation:float 7s ease-in-out infinite .5s;}
.deco-svg.pencil{bottom:8px;right:10%;width:60px;animation:float 5s ease-in-out infinite;}
.deco-svg.book{bottom:6px;left:8%;width:60px;animation:float 6.5s ease-in-out infinite .3s;}
.deco-svg.star1{top:44px;right:24%;width:28px;animation:twinkle 2.4s ease-in-out infinite;}
.deco-svg.star2{top:100px;left:42%;width:20px;animation:twinkle 3s ease-in-out infinite .6s;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

.header-tools{
  position:relative;z-index:3;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px;
}
.icon-btn{
  border:none;background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;
  box-shadow:var(--shadow);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:.95rem;
  transition:transform .15s;
}
.icon-btn:hover{transform:translateY(-2px);}
.icon-btn:active{transform:scale(.95);}

/* ---------- NAV TABS ---------- */
nav#tabNav{
  position:sticky;top:0;z-index:50;
  display:flex;gap:8px;overflow-x:auto;padding:10px 14px;
  background:var(--board);border-bottom:4px solid var(--ink);
  box-shadow:0 6px 14px rgba(0,0,0,.08);
  margin-top:-46px;
  scrollbar-width:thin;
}
nav#tabNav::-webkit-scrollbar{height:6px;}
.tab-btn{
  flex:0 0 auto;
  border:3px solid transparent;background:#fff3de;color:var(--ink);
  font-family:var(--font-dev);font-weight:700;font-size:.95rem;
  padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
  transition:all .18s;
}
.tab-btn:hover{background:#ffe3ad;}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--sun);transform:translateY(-2px);}
.tab-btn:focus-visible, .icon-btn:focus-visible, .card:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:4px solid #1B7FA3;outline-offset:2px;
}

main{max-width:1300px;margin:0 auto;padding:22px 16px 70px;}
.app-section{display:none;animation:fadeIn .35s ease;}
.app-section.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-title{
  font-family:var(--font-dev);font-size:clamp(1.4rem,3.6vw,2rem);font-weight:900;
  display:flex;align-items:baseline;gap:10px;margin:6px 0 18px;color:var(--ink);
}
.section-title small{font-size:.5em;font-weight:600;color:var(--ink-soft);}

/* ---------- CARD GRID & FLIP STYLES ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:16px;
}
.card{
  position:relative;
  border-radius:var(--radius);
  border:4px solid var(--ink);
  padding:0;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .2s, box-shadow .2s;
  min-height:210px;
  text-align:center;
  font-family:var(--font-dev);
  perspective:1000px;
  background:transparent;
}
.card.vowel-card{border-color:var(--vowel-border);}
.card.cons-card{border-color:var(--cons-border);}
.card:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:var(--shadow-lg);}
.card:active{transform:scale(.96);}

.card-inner {
  position:relative;
  width:100%;
  height:100%;
  min-height:210px;
  text-align:center;
  transition:transform 0.6s;
  transform-style:preserve-3d;
  border-radius:calc(var(--radius) - 4px);
}

.card.flipped .card-inner {
  transform:rotateY(180deg);
}

.card-front, .card-back {
  position:absolute;
  width:100%;
  height:100%;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  border-radius:calc(var(--radius) - 4px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 10px 10px;
}

.card.vowel-card .card-front, .card.vowel-card .card-back {
  background:linear-gradient(160deg,var(--vowel-a),var(--vowel-b));
}
.card.cons-card .card-front, .card.cons-card .card-back {
  background:linear-gradient(160deg,var(--cons-a),var(--cons-b));
}

.card-back {
  transform:rotateY(180deg);
  padding:8px;
}

.card .card-index{position:absolute;top:6px;left:10px;font-size:.68rem;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.6);border-radius:8px;padding:1px 6px;}

.big-letter-large{
  font-size:clamp(4rem,11vw,5.5rem);
  font-weight:900;
  color:var(--ink);
  text-shadow:3px 3px 0 rgba(255,255,255,.8);
  line-height:1;
  margin:auto;
}

.card-img-placeholder {
  object-fit:contain;
  aspect-ratio:3 / 4;
  width:100%;
  height:100%;
  display:block;
}

.word-box-large{
  font-size:1.3rem;
  font-weight:800;
  background:var(--sun);
  color:#fff;
  border-radius:10px;
  padding:4px 14px;
  border:2px solid var(--ink);
}

footer{text-align:center;padding:24px;color:var(--ink-soft);font-size:.85rem;}

body.high-contrast{--cream:#000;--board:#111;--ink:#fff;--ink-soft:#ccc;}
body.high-contrast .card{background:#000 !important;color:#fff;border-color:#FFD400 !important;}
body.high-contrast .big-letter-large,body.high-contrast .word-box-large{color:#FFD400;text-shadow:none;}
body.high-contrast nav#tabNav{background:#111;}
body.high-contrast .tab-btn{background:#222;color:#fff;}

@media print{
  header.chart-header, nav#tabNav, .header-tools, footer{display:none !important;}
  .app-section{display:none !important;}
  .app-section.active{display:block !important;}
  .card{break-inside:avoid;}
  body{background:#fff;}
}
</style>
</head>
<body>
<a href="#main" class="skip-link">मुख्य सामग्री पर जाएं</a>

<header class="chart-header">
  <svg class="deco-svg sun" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#FFD65C" stroke="#E08A1E" stroke-width="4"/><g stroke="#FFD65C" stroke-width="6" stroke-linecap="round"><line x1="50" y1="2" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="98"/><line x1="2" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="98" y2="50"/><line x1="15" y1="15" x2="25" y2="25"/><line x1="75" y1="75" x2="85" y2="85"/><line x1="15" y1="85" x2="25" y2="75"/><line x1="75" y1="25" x2="85" y2="15"/></g></svg>
  <svg class="deco-svg cloud1" viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="26" ry="18" fill="#fff"/><ellipse cx="60" cy="28" rx="22" ry="20" fill="#fff"/><ellipse cx="80" cy="38" rx="18" ry="14" fill="#fff"/></svg>
  <svg class="deco-svg cloud2" viewBox="0 0 100 60"><ellipse cx="30" cy="35" rx="26" ry="18" fill="#fff"/><ellipse cx="60" cy="28" rx="22" ry="20" fill="#fff"/></svg>
  <svg class="deco-svg pencil" viewBox="0 0 40 100"><rect x="10" y="20" width="20" height="70" fill="#FFD65C" stroke="#2B2420" stroke-width="3"/><polygon points="10,20 30,20 20,2" fill="#E8B98C" stroke="#2B2420" stroke-width="3"/><rect x="10" y="82" width="20" height="10" fill="#8E44AD" stroke="#2B2420" stroke-width="3"/></svg>
  <svg class="deco-svg book" viewBox="0 0 100 70"><path d="M5 10 C30 0 45 5 50 15 C55 5 70 0 95 10 L95 60 C70 50 55 55 50 65 C45 55 30 50 5 60 Z" fill="#E5383B" stroke="#2B2420" stroke-width="3"/></svg>

  <div class="header-inner">
    <h1 class="big-title">🌸 हिन्दी वर्णमाला</h1>
    <div class="subtitle">देखो • सीखो</div>
    <div class="header-tools">
      <button class="icon-btn" id="contrastBtn" aria-pressed="false">🌓 उच्च कंट्रास्ट</button>
    </div>

</header>

<nav id="tabNav" aria-label="अनुभाग चुनें"></nav>

<main id="main">

  <section class="app-section" id="section-vowels">
    <h2 class="section-title">स्वर <small>Vowels</small></h2>
    <div class="grid" id="vowelsGrid"></div>
  </section>

  <section class="app-section" id="section-consonants">
    <h2 class="section-title">व्यंजन <small>Consonants</small></h2>
    <div class="grid" id="consonantsGrid"></div>
  </section>

</main>

<footer>निर्मित: इंटरैक्टिव हिन्दी वर्णमाला चार्ट • NEP 2020 / NCF 2023 के अनुरूप • ऑफ़लाइन उपयोग हेतु उपयुक्त</footer>

<script>
'use strict';
(function(){

if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.documentElement.classList.add('reduce-motion');
}
var REDUCE_MOTION = document.documentElement.classList.contains('reduce-motion');

/* ============================== AUDIO GENERATOR ========================== */
var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
var audioCtx = null;

function playFlipSound() {
  try {
    if (!audioCtx) {
      audioCtx = new AudioCtxClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.07);
    osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.14);

    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.14);
  } catch (err) {
    // Graceful fallback if Web Audio is unsupported
  }
}

/* ============================== DATA ================================== */
var VOWELS = [
  {id:'v1', letter:'अ', word:'अनार', img:'../quiz-image/anar.png'},
  {id:'v2', letter:'आ', word:'आम', img:'../quiz-image/aam.png'},
  {id:'v3', letter:'इ', word:'इमली', img:'../quiz-image/imli.png'},
  {id:'v4', letter:'ई', word:'ईख', img:'../quiz-image/eekh.png'},
  {id:'v5', letter:'उ', word:'उल्लू', img:'../quiz-image/ullu.png'},
  {id:'v6', letter:'ऊ', word:'ऊन', img:'../quiz-image/oon.png'},
  {id:'v7', letter:'ऋ', word:'ऋषि', img:'../quiz-image/rishi.png'},
  {id:'v8', letter:'ए', word:'एड़ी', img:'../quiz-image/edi.png'},
  {id:'v9', letter:'ऐ', word:'ऐनक', img:'../quiz-image/ainak.png'},
  {id:'v10', letter:'ओ', word:'ओखली', img:'../quiz-image/okhli.png'},
  {id:'v11', letter:'औ', word:'औरत', img:'../quiz-image/aurat.png'},
  {id:'v12', letter:'अं', word:'अंगूर', img:'../quiz-image/angoor.png'},
  {id:'v13', letter:'अः', word:'दुःख', img:'../quiz-image/dukh.png'}
];
var CONSONANTS = [
  {id:'c1', letter:'क', word:'कबूतर', img:'../quiz-image/kabootar.png'},
  {id:'c2', letter:'ख', word:'खरगोश', img:'../quiz-image/khargosh.png'},
  {id:'c3', letter:'ग', word:'गमला', img:'../quiz-image/gamla.png'},
  {id:'c4', letter:'घ', word:'घर', img:'../quiz-image/ghar.png'},
  {id:'c5', letter:'ङ', word:'-', img:'../quiz-image/cross.png'},
  {id:'c6', letter:'च', word:'चम्मच', img:'../quiz-image/chammach.png'},
  {id:'c7', letter:'छ', word:'छाता', img:'../quiz-image/chhata.png'},
  {id:'c8', letter:'ज', word:'जहाज', img:'../quiz-image/jahaj.png'},
  {id:'c9', letter:'झ', word:'झंडा', img:'../quiz-image/jhanda.png'},
  {id:'c10', letter:'ञ', word:'-', img:'../quiz-image/cross.png'},
  {id:'c11', letter:'ट', word:'टमाटर', img:'../quiz-image/tamatar.png'},
  {id:'c12', letter:'ठ', word:'ठेला', img:'../quiz-image/thela.png'},
  {id:'c13', letter:'ड', word:'डमरू', img:'../quiz-image/damru.png'},
  {id:'c14', letter:'ढ', word:'ढोल', img:'../quiz-image/dhol.png'},
  {id:'c15', letter:'ण', word:'-', img:'../quiz-image/cross.png'},
  {id:'c16', letter:'त', word:'तराजू', img:'../quiz-image/taraju.png'},
  {id:'c17', letter:'थ', word:'थाली', img:'../quiz-image/thali.png'},
  {id:'c18', letter:'द', word:'दवाई', img:'../quiz-image/dawai.png'},
  {id:'c19', letter:'ध', word:'धनुष', img:'../quiz-image/dhanush.png'},
  {id:'c20', letter:'न', word:'नल', img:'../quiz-image/nal.png'},
  {id:'c21', letter:'प', word:'पतंग', img:'../quiz-image/patang.png'},
  {id:'c22', letter:'फ', word:'फल', img:'../quiz-image/phal.png'},
  {id:'c23', letter:'ब', word:'बतख', img:'../quiz-image/batakh.png'},
  {id:'c24', letter:'भ', word:'भालू', img:'../quiz-image/bhalu.png'},
  {id:'c25', letter:'म', word:'मछली', img:'../quiz-image/machhli.png'},
  {id:'c26', letter:'य', word:'यज्ञ', img:'../quiz-image/yagya.png'},
  {id:'c27', letter:'र', word:'रथ', img:'../quiz-image/rath.png'},
  {id:'c28', letter:'ल', word:'लड़की', img:'../quiz-image/ladki.png'},
  {id:'c29', letter:'व', word:'वन', img:'../quiz-image/van.png'},
  {id:'c30', letter:'श', word:'शरबत', img:'../quiz-image/sharbat.png'},
  {id:'c31', letter:'ष', word:'षट्कोण', img:'../quiz-image/shatkon.png'},
  {id:'c32', letter:'स', word:'सब्ज़ी', img:'../quiz-image/sabzi.png'},
  {id:'c33', letter:'ह', word:'हथौड़ा', img:'../quiz-image/hathoda.png'},
  {id:'c34', letter:'क्ष', word:'क्षत्रिय', img:'../quiz-image/kshatriya.png'},
  {id:'c35', letter:'त्र', word:'त्रिशूल', img:'../quiz-image/trishul.png'},
  {id:'c36', letter:'ज्ञ', word:'ज्ञानी', img:'../quiz-image/gyani.png'}
];
var ALL = VOWELS.concat(CONSONANTS);
var BY_ID = {};
ALL.forEach(function(it, idx){ it.type = (idx < VOWELS.length) ? 'vowel' : 'consonant'; it.order = idx; BY_ID[it.id] = it; });

var settings = { highContrast:false };

/* ============================== CARD RENDERING ============================ */
function cardHTML(item, idx){
  return '' +
  '<button class="card '+(item.type==='vowel'?'vowel-card':'cons-card')+'" data-id="'+item.id+'" tabindex="0" '+
     'aria-label="अक्षर '+item.letter+'। चित्र देखने के लिए स्पर्श करें।">' +
    '<div class="card-inner">' +
      '<div class="card-front">' +
        '<span class="card-index" aria-hidden="true">'+(idx+1)+'</span>' +
        '<span class="big-letter-large">'+item.letter+'</span>' +
      '</div>' +
      '<div class="card-back">' +
        '<img class="card-img-placeholder" src="'+item.img+'" alt="'+item.word+'" onerror="this.style.visibility=\'hidden\';">' +
      '</div>' +
    '</div>' +
  '</button>';
}
function renderGrids(){
  document.getElementById('vowelsGrid').innerHTML = VOWELS.map(cardHTML).join('');
  document.getElementById('consonantsGrid').innerHTML = CONSONANTS.map(function(it,i){ return cardHTML(it, VOWELS.length+i); }).join('');
}
function handleCardClick(card, e){
  playFlipSound();
  card.classList.toggle('flipped');
}
function attachGridEvents(gridId){
  var grid = document.getElementById(gridId);
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(card) handleCardClick(card, e);
  });
  grid.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){
      var card = e.target.closest('.card');
      if(card){ e.preventDefault(); handleCardClick(card, e); }
    }
  });
}

/* ============================== TABS ====================================== */
var TABS = [
  {id:'vowels', label:'स्वर', icon:'🔤'},
  {id:'consonants', label:'व्यंजन', icon:'🔡'}
];
var currentTab = 'vowels';
function renderTabs(){
  var nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(function(t){
    return '<button class="tab-btn" data-tab="'+t.id+'" aria-selected="false">'+t.icon+' '+t.label+'</button>';
  }).join('');
  nav.addEventListener('click', function(e){
    var b = e.target.closest('.tab-btn');
    if(b){ switchTab(b.dataset.tab); }
  });
}
function switchTab(tabId){
  currentTab = tabId;
  document.querySelectorAll('.app-section').forEach(function(s){ s.classList.remove('active'); });
  var sec = document.getElementById('section-'+tabId);
  if(sec) sec.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(b){
    var active = b.dataset.tab===tabId;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true':'false');
  });
  sec && sec.scrollIntoView({behavior: REDUCE_MOTION ? 'auto' : 'smooth', block:'start'});
}

/* ============================== INIT ====================================== */
document.addEventListener('DOMContentLoaded', function(){
  renderTabs();
  renderGrids();
  attachGridEvents('vowelsGrid');
  attachGridEvents('consonantsGrid');

  var contrastBtn = document.getElementById('contrastBtn');
  if(contrastBtn){
    contrastBtn.addEventListener('click', function(){
      settings.highContrast = !settings.highContrast;
      document.body.classList.toggle('high-contrast', settings.highContrast);
      contrastBtn.setAttribute('aria-pressed', settings.highContrast ? 'true' : 'false');
    });
  }

  switchTab('vowels');
});

})();
</script>
</body>
