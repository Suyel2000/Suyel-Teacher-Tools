<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Abacus</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(#eef6ff,#fff8ec);color:#1f2a44;padding:8px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}html{overflow:hidden;height:100%}
main{max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}main>*{flex:none}
h1{font-size:1.1rem;margin:0;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-bottom:4px}
.bar select,.bar button,.task button{min-height:44px;padding:0 14px;font:inherit;font-weight:600;border:2px solid #9db4d8;border-radius:12px;background:#fff;color:#1f2a44;cursor:pointer}
.seg button.on{background:#2f80ed;border-color:#2f80ed;color:#fff}
.seg{display:flex;gap:4px}
.chk{display:flex;align-items:center;gap:6px;font-weight:600;min-height:44px}
.chk input{width:22px;height:22px}
.num{text-align:center;font-size:clamp(1.4rem,5vw,2.6rem);font-weight:800;color:#2f4a8a;letter-spacing:1px;word-break:break-all}
.name{text-align:center;font-size:clamp(.78rem,2.4vw,1rem);line-height:1.2;margin-bottom:4px;max-height:3.6em;overflow:hidden}
.task{background:#fff;border:2px dashed #9db4d8;border-radius:14px;padding:4px 8px;margin:4px 0;text-align:center;display:none}
.task .big{font-size:1.2rem;font-weight:800}
.task button{margin:4px}
#msg{min-height:1.2em;font-size:.9rem;line-height:1.2;font-weight:600;color:#1b6e3c}
.wrap{flex:1 1 0;min-height:0;overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 4px 16px #0002;padding:6px}
svg{display:block;width:100%;height:100%}
.hit{touch-action:none;cursor:grab;outline:none}
.hit:focus-visible{stroke:#1f2a44;stroke-width:3}
.bead{transition:transform .2s cubic-bezier(.2,.8,.3,1);will-change:transform}.drag .bead{transition:none}.top{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 52px;margin-bottom:8px}.top h1{margin:0}.fs{position:absolute;right:0;top:0;width:44px;height:44px;border:2px solid #9db4d8;border-radius:12px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.fs[hidden]{display:none}
.panel{background:#fff;border-radius:14px;padding:6px;margin-top:6px;overflow:hidden}
table{border-collapse:collapse;margin:0 auto;width:100%;table-layout:fixed}
th,td{border:1px solid #d5dff0;padding:3px 1px;text-align:center;overflow-wrap:anywhere}th{font-size:clamp(.55rem,1.6vw,.85rem)}
td{font-size:clamp(1rem,3vw,1.3rem);font-weight:800}
.exp{text-align:center;margin-top:4px;font-size:clamp(.75rem,2.4vw,1.05rem);line-height:1.25}
@media(max-width:700px){table.many th span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;font-size:.68rem;white-space:nowrap}}@media(max-height:620px){.num{font-size:1.3rem}.bar select,.bar button{min-height:38px}.top{min-height:38px}.fs{width:38px;height:38px}}@media (prefers-reduced-motion:reduce){.bead{transition:none}}
</style></head><body><main>
<div class="top"><h1>Interactive Abacus</h1><button class="fs" id="fs" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24" style="width:22px;height:22px;min-width:0" fill="none" stroke="#1f2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
<div class="bar">
<label>Columns <select id="cols" aria-label="Number of columns"></select></label>
<div class="seg" role="group" aria-label="Mode">
<button data-m="explore" class="on">Explore</button><button data-m="make">Make a Number</button><button data-m="calc">Addition &amp; Subtraction</button></div>
<button id="reset">Reset</button>
<label class="chk"><input type="checkbox" id="showpv" checked>Show Place Value</label>
</div>
<div class="task" id="task"></div>
<div class="num" id="num">0</div>
<div class="name" id="name">Zero</div>
<div class="wrap"><svg id="svg" role="group" aria-label="Abacus" viewBox="0 0 100 100"></svg></div>
<div id="msg" aria-live="polite" style="text-align:center;margin-top:4px"></div>
<div class="panel" id="pv"><table id="tbl"></table><div class="exp" id="exp"></div></div>
</main>
<script>
const NAMES=['Ones','Tens','Hundreds','Thousands','Ten Thousands','Lakhs','Ten Lakhs','Crores','Ten Crores','Hundred Crores','Thousand Crores'];
const COL=['#2f80ed','#27ae60','#f2994a','#9b51e0','#e91e8c','#14b8a6','#e53935','#4338ca','#d4a017','#ff6f61','#7c3aed'];
const CW=76,TOP=92,BH=28,GAP=46,RW=29;
let n=4,d=Array(11).fill(0),mode='explore',target=0,locked=false,calc=null,done=false;
const $=id=>document.getElementById(id),svg=$('svg');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shade(h,p){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16));return '#'+c.map(v=>{v=p>0?v+(255-v)*p:v*(1+p);return Math.round(v).toString(16).padStart(2,'0')}).join('')}
const ind=v=>{const s=String(v);if(s.length<=3)return s;return s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3)};
const O=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],T=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const w2=x=>x<20?O[x]:T[x/10|0]+(x%10?'-'+O[x%10]:'');
const w3=x=>{let s='';if(x>=100){s=O[x/100|0]+' hundred';x%=100;if(x)s+=' '}if(x)s+=w2(x);return s};
function words(v){if(!v)return 'Zero';const cr=v/1e7|0,parts=[];
if(cr)parts.push((cr<1000?w3(cr):w3(cr/1000|0)+' thousand'+(cr%1000?' '+w3(cr%1000):''))+' crore');
const lk=v/1e5%100|0,th=v/1e3%100|0,r=v%1000;
if(lk)parts.push(w2(lk)+' lakh');if(th)parts.push(w2(th)+' thousand');if(r)parts.push(w3(r));
const s=parts.join(' ');return s[0].toUpperCase()+s.slice(1)}
const value=()=>{let v=0;for(let k=0;k<n;k++)v+=d[k]*10**k;return v};
const dig=(v,k)=>Math.floor(v/10**k)%10;
const by=(i,g)=>i<g?TOP+i*BH:TOP+GAP+i*BH;

function build(){
 const W=n*CW+40,H=470;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 
 let h=`<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".35"/></filter>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a4b"/><stop offset=".5" stop-color="#a8672f"/><stop offset="1" stop-color="#7d4a1f"/></linearGradient>
 <linearGradient id="rod" x1="0" x2="1"><stop offset="0" stop-color="#8d96a3"/><stop offset=".4" stop-color="#f2f5f8"/><stop offset="1" stop-color="#7c8592"/></linearGradient>`;
 for(let k=0;k<n;k++)h+=`<linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(COL[k],.45)}"/><stop offset=".45" stop-color="${COL[k]}"/><stop offset="1" stop-color="${shade(COL[k],-.28)}"/></linearGradient>`;
 h+=`</defs><rect x="6" y="52" width="${W-12}" height="372" rx="24" fill="url(#wood)" stroke="#5e3416" stroke-width="3" filter="url(#sh)"/>
 <rect x="20" y="74" width="${W-40}" height="328" rx="12" fill="#fdf3df" stroke="#6b3f1d" stroke-width="2"/>`;
 for(let j=0;j<n;j++){const k=n-1-j,cx=20+j*CW+CW/2,nm=NAMES[k],sp=nm.indexOf(' '),l1=sp<0?nm:nm.slice(0,sp),l2=sp<0?'':nm.slice(sp+1),c=shade(COL[k],-.35);
  h+=`<rect x="${cx-CW/2+4}" y="76" width="${CW-8}" height="324" rx="10" fill="${COL[k]}" opacity=".10"/>
  <text x="${cx}" y="${l2?24:36}" text-anchor="middle" font-size="13" font-weight="800" fill="${c}">${l1}</text>${l2?`<text x="${cx}" y="42" text-anchor="middle" font-size="13" font-weight="800" fill="${c}">${l2}</text>`:''}
  <rect x="${cx-3.5}" y="78" width="7" height="320" rx="3" fill="url(#rod)"/>`;
  for(let i=0;i<9;i++)h+=`<g class="bead" id="b${k}_${i}" style="transform:translate(${cx}px,${by(i,0)}px)" filter="url(#sh)"><ellipse rx="${RW}" ry="13.5" fill="url(#g${k})" stroke="${shade(COL[k],-.45)}" stroke-width="1.5"/><ellipse cx="-10" cy="-5.5" rx="17" ry="4" fill="#fff" opacity=".5"/><rect x="-5" y="-1" width="10" height="2" rx="1" fill="#fff" opacity="0"/></g>`;
  h+=`<rect class="hit" data-k="${k}" x="${cx-CW/2+2}" y="76" width="${CW-4}" height="328" fill="transparent" tabindex="0" role="slider" aria-label="${nm} column" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"/>
  <text id="dg${k}" x="${cx}" y="456" text-anchor="middle" font-size="32" font-weight="800" fill="${c}">0</text>`}
 svg.innerHTML=h;
}
function setDigit(k,v,force){if(locked&&!force)return;v=Math.max(0,Math.min(9,v));if(d[k]===v)return;d[k]=v;update()}
function update(){
 for(let k=0;k<n;k++){const cx=20+(n-1-k)*CW+CW/2;
  for(let i=0;i<9;i++)$(`b${k}_${i}`).style.transform=`translate(${cx}px,${by(i,d[k])}px)`;
  $('dg'+k).textContent=d[k];const hit=svg.querySelector(`.hit[data-k="${k}"]`);hit.setAttribute('aria-valuenow',d[k])}
 const v=value();$('num').textContent=ind(v);$('name').textContent=words(v);
 let hd='<tr>',bd='<tr>';for(let k=n-1;k>=0;k--){hd+=`<th style="color:${shade(COL[k],-.3)}"><span>${NAMES[k]}</span></th>`;bd+=`<td style="color:${shade(COL[k],-.3)}">${d[k]}</td>`}
 $('tbl').className=n>=7?'many':'';$('tbl').innerHTML=hd+'</tr>'+bd+'</tr>';
 const t=[];for(let k=n-1;k>=0;k--)if(d[k])t.push(ind(d[k]*10**k));
 $('exp').innerHTML='<b>Expanded form:</b> '+(t.length?t.join(' + '):'0');
 check(v)}
function check(v){
 if(mode==='make'&&!done&&v===target){done=true;$('msg').textContent='Excellent! You represented the number correctly!'}
 if(mode==='calc'&&calc&&!locked){
  if(calc.stage===0&&v===calc.a){calc.stage=1;$('msg').textContent=`Now ${calc.op==='+'?'add':'take away'} ${ind(calc.b)} by moving beads.`}
  else if(calc.stage===1&&!done&&v===calc.ans){done=true;$('msg').textContent=`Correct! ${ind(calc.a)} ${calc.op} ${ind(calc.b)} = ${ind(calc.ans)}`}}}
function setMode(m){mode=m;done=false;calc=null;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 const t=$('task');t.style.display=m==='explore'?'none':'block';$('msg').textContent='';resetAbacus();
 if(m==='make')newTarget();
 if(m==='calc'){t.innerHTML='<div>Pick a problem type:</div><button id="np1">New addition</button><button id="np2">New subtraction</button><div class="big" id="prob"></div><button id="show" style="display:none">Show me how</button>';
  $('np1').onclick=()=>newProb('+');$('np2').onclick=()=>newProb('-');newProb('+')}}
function newTarget(){done=false;$('msg').textContent='';target=n===1?rnd(1,9):rnd(10**(n-1),10**n-1);
 $('task').innerHTML=`<div>Make the number:</div><div class="big">${ind(target)}</div><button id="nx">Try another number</button>`;$('nx').onclick=()=>{resetAbacus();newTarget()}}
function newProb(op){resetAbacus();done=false;const L=Math.min(n,4),mx=10**L-1;let a,b;
 if(op==='+'){if(mx<2){op='-'}}
 if(op==='+'){a=rnd(Math.min(10**(L-1),mx-1),mx-1);b=rnd(1,mx-a)}else{a=rnd(Math.max(2,10**(L-1)),mx);b=rnd(1,a-1)}
 if(mx<2){a=1;b=1;op='+'}
 calc={a,b,op,ans:op==='+'?a+b:a-b,stage:0};
 $('prob').textContent=`${ind(a)} ${op==='+'?'+':'−'} ${ind(b)}`;$('show').style.display='inline-block';
 $('show').onclick=demo;$('msg').textContent=`Step 1: show ${ind(a)} on the abacus.`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function demo(){if(!calc||locked)return;locked=true;const{a,b,op}=calc;
 $('msg').textContent=`Showing ${ind(a)}…`;for(let k=n-1;k>=0;k--){setDigit(k,dig(a,k),true);await sleep(150)}
 await sleep(900);let c=0;
 for(let k=0;k<n;k++){const bd=dig(b,k),cur=d[k];if(!bd&&!c)continue;const N=NAMES[k],U=NAMES[k+1]||'';let m;
  if(op==='+'){const s=cur+bd+c;m=`${N}: ${cur} + ${bd}${c?' + 1 carried':''} = ${s}.`;
   if(s>=10){m+=` 10 beads in ${N} regroup into 1 bead in ${U}.`;d[k]=s-10;c=1}else{d[k]=s;c=0}}
  else{const s=cur-bd-c;m=`${N}: ${cur} − ${bd}${c?' − 1 borrowed':''}.`;
   if(s<0){m+=` Not enough! Borrow 1 bead from ${U}: it is worth 10 here, so ${s+10} beads are left.`;d[k]=s+10;c=1}else{d[k]=s;c=0}}
  $('msg').textContent=m;update();await sleep(2200)}
 locked=false;done=false;calc.stage=1;update()}
function resetAbacus(){d.fill(0);done=false;update()}
// pointer handling
let drag=null,raf=0;
svg.addEventListener('pointerdown',e=>{const t=e.target.closest('.hit');if(!t||locked)return;const m=svg.getScreenCTM(),k=+t.dataset.k,y=(e.clientY-m.f)/m.d;
 let g=0,best=1e9;for(let i=0;i<9;i++){const q=Math.abs(by(i,d[k])-y);if(q<best){best=q;g=i}}
 drag={k,g,d0:d[k],y0:y,f:m.f,s:m.d,moved:false,dy:0};t.setPointerCapture(e.pointerId);t.focus({preventScroll:true});e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=(e.clientY-drag.f)/drag.s-drag.y0;
 if(!drag.moved){if(Math.abs(drag.dy)<3)return;drag.moved=true;svg.classList.add('drag')}
 if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(drag&&drag.moved)step()})});
function step(){const{k,g,d0,dy}=drag,act=g<d0,s=Math.max(0,Math.min(GAP,act?dy:-dy)),cand=s>GAP/2?(act?g:g+1):d0;
 if(d[k]!==cand){d[k]=cand;update()}
 const cx=20+(n-1-k)*CW+CW/2;
 for(let i=0;i<9;i++){let y=by(i,d0);if(act?(i>=g&&i<d0):(i>=d0&&i<=g))y+=act?s:-s;$(`b${k}_${i}`).style.transform=`translate(${cx}px,${y}px)`}}
const end=e=>{if(!drag)return;const D=drag;drag=null;
 if(D.moved){svg.classList.remove('drag');update();return}
 if(e.type==='pointerup')setDigit(D.k,D.g<D.d0?D.g:D.g+1)};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('keydown',e=>{const t=e.target.closest('.hit');if(!t)return;const k=+t.dataset.k;
 if(e.key==='ArrowUp'||e.key==='ArrowRight'){setDigit(k,d[k]+1);e.preventDefault()}
 if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setDigit(k,d[k]-1);e.preventDefault()}});
// controls
const sel=$('cols');for(let i=1;i<=11;i++)sel.add(new Option(i+(i===1?' (Ones)':''),i));sel.value=4;
sel.onchange=()=>{n=+sel.value;for(let k=n;k<11;k++)d[k]=0;build();setMode(mode)};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('reset').onclick=()=>{if(locked)return;resetAbacus();$('msg').textContent='';if(calc){calc.stage=0;$('msg').textContent=`Step 1: show ${ind(calc.a)} on the abacus.`}};
$('showpv').onchange=e=>$('pv').style.display=e.target.checked?'block':'none';
const fsb=$('fs'),de=document.documentElement,rf=de.requestFullscreen||de.webkitRequestFullscreen;
if(rf&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsb.hidden=false;
fsb.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const p=rf.call(de);if(p&&p.catch)p.catch(()=>{})}};
document.addEventListener('fullscreenchange',()=>{fsb.title=fsb.ariaLabel=document.fullscreenElement?'Exit full screen':'Full screen'});
build();update();
</script></body></html>
