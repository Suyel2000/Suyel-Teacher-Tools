<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dienes Blocks Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6EBF4; --card:#FFFFFF; --ws:#FBFCFE; --dot:#CFD8E8; --ink:#14213D; --muted:#5A6A8A;
  --line:#D0D8E8; --soft:#EEF2FA; --btn:#14213D; --btnInk:#FFFFFF; --good:#13805A; --goodBg:#E3F5EC;
  --shadow:0 1px 2px rgba(20,33,61,.08),0 8px 24px rgba(20,33,61,.08);
  --k:#EE5A45; --h:#3D7BEA; --t:#2FB67C; --o:#F5B82E;
  font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1525; --card:#172036; --ws:#1A2440; --dot:#2A3659; --ink:#EAF0FF; --muted:#9DABCC;
    --line:#2C3960; --soft:#1F2A47; --btn:#EAF0FF; --btnInk:#0E1525; --good:#58D6A1; --goodBg:#143A30;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1525; --card:#172036; --ws:#1A2440; --dot:#2A3659; --ink:#EAF0FF; --muted:#9DABCC;
  --line:#2C3960; --soft:#1F2A47; --btn:#EAF0FF; --btnInk:#0E1525; --good:#58D6A1; --goodBg:#143A30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:inherit}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:22px;height:22px}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.btn{min-height:34px;min-width:0;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .12s,opacity .15s,background .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.btn.pri:hover{background:var(--btn);filter:brightness(1.12)}
.btn.dim{opacity:.42}
.btn:disabled{opacity:.38;cursor:default}
.btn[hidden]{display:none}
.ibtn{width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ibtn svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.tool[aria-pressed="true"]{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
#btnFull[aria-pressed="true"] .ic-enter,#btnFull[aria-pressed="false"] .ic-exit{display:none}
.btn[aria-pressed="true"]{background:var(--soft)}
.btn:focus-visible,.tile:focus-visible,.cue:focus-visible,.bBtn:focus-visible,.bX:focus-visible,.pbtn:focus-visible,.seg button:focus-visible{outline:3px solid var(--h);outline-offset:2px}
.pwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:290px;background:var(--card);border:1.5px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);padding:10px;z-index:10000;display:flex;flex-direction:column;gap:8px}
.pop[hidden]{display:none}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1.5px solid var(--line);
  background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer}
.pbtn b{font-size:15px;font-weight:600}
.pbtn span{font-size:13px;color:var(--muted);font-weight:400}
.pbtn:hover{border-color:var(--ink)}
.lvl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 0;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 11px;border-radius:9px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}

/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px}
.main.noTray{grid-template-columns:0 minmax(0,1fr);gap:0}
.main.noTray .tray{display:none}
.tray{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;
  border:2px solid transparent;transition:border-color .15s,background .15s}
.tray.del{border-color:#D9453A;background:color-mix(in srgb,#D9453A 10%,var(--card))}
.tiles{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.tile{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:16px;border:2px solid var(--line);background:var(--soft);
  background:color-mix(in srgb,var(--c) 11%,var(--card));border-color:color-mix(in srgb,var(--c) 40%,var(--card));
  cursor:grab;touch-action:none;position:relative}
.tile:hover{border-color:var(--c)}
.tile svg{display:block;filter:drop-shadow(0 1.5px 1.5px rgba(20,33,61,.25))}
.tile .lab{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.trayNote{margin:0;font-size:12px;line-height:1.35;color:var(--muted);text-align:center;padding:2px 2px 0}

.stage{background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

.ws{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background-color:var(--ws);
  background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.6px);background-size:28px 28px;background-position:14px 14px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  color:var(--muted);font-size:17px;text-align:center;padding:24px;transition:opacity .2s}
.empty.hide{opacity:0}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3000;pointer-events:none;touch-action:none}
.ws.drawing .ink{pointer-events:auto;cursor:crosshair}
.ws.erasing .ink{cursor:cell}
.marq{position:absolute;border:2px solid var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:6px;pointer-events:none;z-index:7000}
.marq[hidden]{display:none}

/* blocks */
.blk{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 1.5px 1.5px rgba(20,33,61,.28))}
.blk svg{display:block;pointer-events:none}
.blk::before{content:"";position:absolute;inset:-7px}
.blk.t-h::before,.blk.t-k::before{inset:0}
.blk.sel::after{content:"";position:absolute;inset:-5px;border:3px solid var(--ink);border-radius:9px;pointer-events:none;
  box-shadow:0 0 0 2px var(--ws)}
.blk.drag{cursor:grabbing;transform:scale(1.035);filter:drop-shadow(0 9px 9px rgba(20,33,61,.3));transition:transform .12s}
.blk.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.ws.moving .blk{transition:left .52s cubic-bezier(.3,.75,.25,1),top .52s cubic-bezier(.3,.75,.25,1)}
.ws.settle .blk{transition:left .15s ease-out,top .15s ease-out}
.ws.dragging .cue,.ws.dragging .ring{opacity:0;pointer-events:none}
.ghost{position:fixed;pointer-events:none;z-index:20000;filter:drop-shadow(0 10px 10px rgba(20,33,61,.3));transform:scale(1.04)}

/* regroup cue */
.ring{position:absolute;border:2.5px dashed var(--ink);border-radius:12px;opacity:.5;pointer-events:none;z-index:4000}
.cue{position:absolute;z-index:5000;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 16px;border:0;border-radius:999px;
  background:var(--btn);color:var(--btnInk);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transform:translateX(-50%);box-shadow:0 6px 18px rgba(20,33,61,.3);animation:cueIn .25s ease-out}
.cue b{background:var(--btnInk);color:var(--btn);border-radius:999px;padding:7px 14px;font-weight:600}
@keyframes cueIn{from{opacity:0;margin-top:6px}}

/* banner + note */
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:9000;max-width:calc(100% - 24px);
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;background:var(--card);border:2px solid var(--ink);
  border-radius:18px;box-shadow:var(--shadow)}
.banner[hidden]{display:none}
.banner.good{border-color:var(--good);background:var(--goodBg)}
.bMain{font-size:20px;font-weight:600;letter-spacing:-.01em}
.banner.good .bMain{color:var(--good)}
.bSub{font-size:13px;color:var(--muted);margin-top:1px}
.bBtn,.bX{min-height:42px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--soft);color:var(--ink)}
.bBtn{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.bBtn[hidden]{display:none}
.note{position:absolute;bottom:18px;left:50%;transform:translate(-50%,0);z-index:8000;pointer-events:none;
  background:var(--btn);color:var(--btnInk);border-radius:16px;padding:11px 22px;text-align:center;box-shadow:0 8px 24px rgba(20,33,61,.3);
  transition:opacity .25s,transform .25s;max-width:calc(100% - 24px)}
.note.off{opacity:0;transform:translate(-50%,8px)}
.nMain{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.nSub{font-size:15px;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums}

@media (max-width:780px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 96px}
  .main.noTray{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 0;gap:0}
  .tray{flex-direction:row;order:2;padding:8px}
  .tiles{flex-direction:row}
  .trayNote{display:none}
  .stage{order:1}
  .brand span{display:none}
  .btn{padding:0 10px;min-width:0}
  .ibtn{padding:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="2" y="16" width="12" height="12" rx="2" fill="#3D7BEA"/>
        <rect x="16" y="16" width="12" height="12" rx="2" fill="#F5B82E"/>
        <rect x="2" y="2" width="12" height="12" rx="2" fill="#2FB67C"/>
        <rect x="16" y="2" width="12" height="12" rx="2" fill="#EE5A45"/>
      </svg>
      <span>Dienes Blocks</span>
    </div>
    <nav class="actions" aria-label="Controls">
      <button class="btn" id="btnBlocks" aria-pressed="true">Blocks</button>
      <i class="sep"></i>
      <button class="btn pri" id="btnBreak">Break</button>
      <button class="btn pri" id="btnRegroup">Regroup</button>
      <i class="sep"></i>
      <button class="btn" id="btnUndo">Undo</button>
      <button class="btn" id="btnReset">Reset</button>
      <button class="btn ibtn" id="btnDelete" aria-label="Delete selected" title="Delete selected"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button>
      <i class="sep"></i>
      <div class="pwrap">
        <button class="btn" id="btnPractice" aria-expanded="false">Practice</button>
        <div class="pop" id="prac" hidden>
          <button class="pbtn" id="pStart"><b>Challenge</b><span>Build, break or regroup a number</span></button>
          <button class="pbtn" id="pWatch"><b>Watch how</b><span>A Hundred breaks into Tens, then Ones</span></button>
          <div class="lvl"><span>Numbers up to</span>
            <div class="seg" id="seg">
              <button data-l="99" aria-pressed="false">99</button>
              <button data-l="999" aria-pressed="true">999</button>
              <button data-l="9999" aria-pressed="false">9999</button>
            </div>
          </div>
        </div>
      </div>
      <i class="sep"></i>
      <button class="btn tool ibtn" id="btnPen" aria-pressed="false" aria-label="Pencil" title="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
      <button class="btn tool ibtn" id="btnEraser" aria-pressed="false" aria-label="Eraser" title="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
      <i class="sep"></i>
      <button class="btn ibtn" id="btnZoomOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button class="btn ibtn" id="btnZoomIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn ibtn" id="btnFull" aria-pressed="false" aria-label="Full screen" title="Full screen"><svg class="ic-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><svg class="ic-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg></button>
    </nav>
  </header>

  <div class="main" id="main">
    <aside class="tray" id="tray" aria-label="Block tray">
      <div class="tiles" id="tiles"></div>
      <p class="trayNote" id="trayNote">Drag or tap to add. Drag blocks back here to remove them.</p>
    </aside>

    <section class="stage">
      <div class="ws" id="ws">
        <canvas class="ink" id="ink"></canvas>
        <div class="empty" id="empty">Drag blocks from the tray to start building</div>
        <div class="marq" id="marq" hidden></div>
        <div class="banner" id="banner" hidden>
          <div><div class="bMain" id="bMain"></div><div class="bSub" id="bSub"></div></div>
          <button class="bBtn" id="bNext" hidden>Next</button>
          <button class="bX" id="bEnd">Exit</button>
        </div>
        <div class="note off" id="note" aria-live="polite"><div class="nMain" id="nMain"></div><div class="nSub" id="nSub"></div></div>
      </div>
    </section>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TYPES=['k','h','t','o'];
const VAL={o:1,t:10,h:100,k:1000};
const NAME={o:['One','Ones'],t:['Ten','Tens'],h:['Hundred','Hundreds'],k:['Thousand','Thousands']};
const COL={
  o:{b:'#F5B82E',m:'#E2A21B',d:'#A8730A',l:'#FFDF8F'},
  t:{b:'#2FB67C',m:'#25996A',d:'#15704A',l:'#8CE6BC'},
  h:{b:'#3D7BEA',m:'#2F63CC',d:'#1D479F',l:'#9BBEF8'},
  k:{b:'#EE5A45',m:'#D14632',d:'#982A1A',l:'#FAA597'}
};
const DEP=2.2;
const DIM={o:[1,1],t:[1,10],h:[10,10],k:[10+DEP,10+DEP]};
const NEXT={o:'t',t:'h',h:'k'}, PREV={t:'o',h:'t',k:'h'};
const NS='http://www.w3.org/2000/svg';
const nm=(t,n)=>NAME[t][n===1?0:1];
const f=n=>Math.round(n*100)/100;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),Math.max(a,b));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------- SVG blocks ---------- */
const cache={};
function blockSVG(t,u){
  const key=t+'|'+u; if(cache[key]) return cache[key];
  const c=COL[t], sw=Math.max(1,u*0.075); let s;
  if(t==='k'){
    const d=DEP*u,S=10*u,W=S+d,H=S+d; let g='';
    for(let i=1;i<10;i++){
      g+=`M${f(i*u)} ${f(d)}V${f(H)}M0 ${f(d+i*u)}H${f(S)}`;
      g+=`M${f(i*u)} ${f(d)}L${f(i*u+d)} 0M${f(i*d/10)} ${f(d-i*d/10)}H${f(S+i*d/10)}`;
      g+=`M${f(S)} ${f(d+i*u)}L${f(W)} ${f(i*u)}M${f(S+i*d/10)} ${f(d-i*d/10)}V${f(d-i*d/10+S)}`;
    }
    const top=`0,${f(d)} ${f(S)},${f(d)} ${f(W)},0 ${f(d)},0`;
    const right=`${f(S)},${f(d)} ${f(W)},0 ${f(W)},${f(S)} ${f(S)},${f(H)}`;
    s=`<svg xmlns="${NS}" width="${f(W)}" height="${f(H)}" viewBox="0 0 ${f(W)} ${f(H)}" overflow="visible" fill="none" stroke-linejoin="round">`+
      `<polygon points="${top}" fill="${c.l}"/><polygon points="${right}" fill="${c.m}"/>`+
      `<rect x="0" y="${f(d)}" width="${f(S)}" height="${f(S)}" fill="${c.b}"/>`+
      `<path d="${g}" stroke="${c.d}" stroke-opacity=".42" stroke-width="${f(sw*.7)}"/>`+
      `<polygon points="${top}" stroke="${c.d}" stroke-width="${f(sw)}"/><polygon points="${right}" stroke="${c.d}" stroke-width="${f(sw)}"/>`+
      `<rect x="0" y="${f(d)}" width="${f(S)}" height="${f(S)}" stroke="${c.d}" stroke-width="${f(sw)}"/></svg>`;
  }else{
    const cols=t==='h'?10:1, rows=t==='o'?1:10, W=cols*u, H=rows*u, r=Math.min(u*0.18,4); let g='';
    for(let i=1;i<cols;i++) g+=`M${f(i*u)} 0V${f(H)}`;
    for(let j=1;j<rows;j++) g+=`M0 ${f(j*u)}H${f(W)}`;
    s=`<svg xmlns="${NS}" width="${f(W)}" height="${f(H)}" viewBox="0 0 ${f(W)} ${f(H)}" overflow="visible">`+
      `<rect x="${f(sw/2)}" y="${f(sw/2)}" width="${f(W-sw)}" height="${f(H-sw)}" rx="${f(r)}" fill="${c.b}" stroke="${c.d}" stroke-width="${f(sw)}"/>`+
      (g?`<path d="${g}" stroke="${c.d}" stroke-opacity=".5" stroke-width="${f(sw*.7)}" fill="none"/>`:'')+
      `<path d="M${f(sw*2)} ${f(H-sw*2)}V${f(sw*2)}H${f(W-sw*2)}" stroke="${c.l}" stroke-width="${f(sw*1.1)}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".9"/></svg>`;
  }
  return cache[key]=s;
}

/* ---------- state ---------- */
const ws=$('#ws'), tray=$('#tray'), tiles=$('#tiles'), main=$('#main');
let u=16, Wu=60, Hu=34;
const B=new Map(); const els=new Map(); const sel=new Set(); const popQ=new Set();
let nextId=1, zTop=1, busy=false, demo=false, demoTok=0, drag=null, clusters=[], lastTap={id:0,t:0};
let ch=null, level=999, lastText='';
const undoStack=[];
let strokes=[], off=[0,0], tool='select', cur=null, zoom=1;
const isLocked=()=>busy||demo;
const topPad=()=>(ch||demo)?4.6:0.4;

function snapshot(){return {bl:[...B.values()].map(b=>({...b})),st:strokes.slice()};}
function pushUndo(){undoStack.push(snapshot()); if(undoStack.length>60) undoStack.shift();}
function restore(s){B.clear(); s.bl.forEach(b=>B.set(b.id,{...b})); strokes=s.st.slice(); sel.clear(); sync(); redrawInk();}
function counts(){const c={o:0,t:0,h:0,k:0}; for(const b of B.values()) c[b.t]++; return c;}
function clampB(b){const [w,h]=DIM[b.t]; b.x=clamp(b.x,.3,Wu-w-.3); b.y=clamp(b.y,.3,Hu-h-.3);}
function addBlock(t,x,y,o={}){
  const id=nextId++; const b={id,t,x,y,z:++zTop}; clampB(b); B.set(id,b); if(o.pop) popQ.add(id); return id;
}
function normZ(){
  const arr=[...B.values()].sort((a,b)=>a.z-b.z); arr.forEach((b,i)=>b.z=i+1); zTop=arr.length+1;
}

/* ---------- measuring ---------- */
function measure(){
  const W=ws.clientWidth,H=ws.clientHeight; if(!W||!H) return;
  const base=Math.max(9,Math.min(24,Math.floor(Math.min(W/62,H/34))));
  u=Math.max(4,Math.round(base*zoom*100)/100);
  Wu=W/u; Hu=H/u;
}
function renderTray(){
  tiles.innerHTML='';
  const horizontal=window.matchMedia('(max-width:780px)').matches;
  const tw=horizontal?(tray.clientWidth-24-24)/4:tray.clientWidth-20;
  const th=horizontal?tray.clientHeight-16:(tray.clientHeight-20-48-24)/4;
  const ut=clamp(Math.min((th-38)/12.4,(tw-18)/12.4),3,7.5);
  for(const t of TYPES){
    const d=document.createElement('div');
    d.className='tile'; d.dataset.t=t; d.style.setProperty('--c',COL[t].b);
    d.setAttribute('role','button'); d.tabIndex=0; d.setAttribute('aria-label','Add '+NAME[t][0]+' ('+VAL[t]+')');
    d.innerHTML=blockSVG(t,f(ut))+`<span class="lab">${VAL[t]}</span>`;
    tiles.appendChild(d);
  }
}

/* ---------- clusters & cues ---------- */
function gap1(a,aw,ah,b,bw,bh){
  return [Math.max(0,b.x-(a.x+aw),a.x-(b.x+bw)),Math.max(0,b.y-(a.y+ah),a.y-(b.y+bh))];
}
function computeClusters(){
  const out=[]; const tol=Math.max(.45,6/u);
  for(const t of ['o','t','h']){
    const arr=[...B.values()].filter(b=>b.t===t); if(arr.length<10) continue;
    const [w,h]=DIM[t]; const seen=new Set();
    for(const a of arr){
      if(seen.has(a.id)) continue; seen.add(a.id); const stack=[a], comp=[];
      while(stack.length){
        const c=stack.pop(); comp.push(c);
        for(const d of arr){ if(seen.has(d.id)) continue; const [gx,gy]=gap1(c,w,h,d,w,h); if(gx<=tol&&gy<=tol){seen.add(d.id); stack.push(d);} }
      }
      if(comp.length>=10) out.push({t,blocks:comp});
    }
  }
  return out;
}
function groupsFromBlocks(t,blocks){
  const sorted=[...blocks].sort((a,b)=>a.y-b.y||a.x-b.x); const n=Math.floor(sorted.length/10); const g=[];
  for(let i=0;i<n;i++) g.push({t,blocks:sorted.slice(i*10,i*10+10)});
  return g;
}
function groupsFromIds(ids){
  const g=[];
  for(const t of ['o','t','h']){
    const bl=ids.map(i=>B.get(i)).filter(b=>b&&b.t===t); g.push(...groupsFromBlocks(t,bl));
  }
  return g;
}
function renderCues(){
  ws.querySelectorAll('.cue,.ring').forEach(n=>n.remove());
  if(busy||demo||(drag&&drag.moved)) return;
  for(const c of clusters){
    const [w,h]=DIM[c.t]; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const b of c.blocks){x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+w); y1=Math.max(y1,b.y+h);}
    const k=Math.floor(c.blocks.length/10);
    const ring=document.createElement('div'); ring.className='ring';
    Object.assign(ring.style,{left:f(x0*u-7)+'px',top:f(y0*u-7)+'px',width:f((x1-x0)*u+14)+'px',height:f((y1-y0)*u+14)+'px'});
    ws.appendChild(ring);
    const cue=document.createElement('button'); cue.className='cue';
    cue.innerHTML=`<span>${10*k} ${nm(c.t,10*k)} = ${k} ${nm(NEXT[c.t],k)}</span><b>Regroup</b>`;
    ws.appendChild(cue);
    const cw=cue.offsetWidth; let top=y0*u-56; if(top<6) top=y1*u+16;
    cue.style.top=f(top)+'px'; cue.style.left=f(clamp((x0+x1)/2*u,cw/2+8,ws.clientWidth-cw/2-8))+'px';
    cue.addEventListener('click',()=>{ if(!isLocked()) regroupGroups(groupsFromBlocks(c.t,c.blocks)); });
  }
}

/* ---------- snapping ---------- */
function shift(ids,dx,dy){for(const i of ids){const b=B.get(i); if(b){b.x+=dx; b.y+=dy;}}}
function clampGroup(ids){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const i of ids){const b=B.get(i); if(!b) continue; const [w,h]=DIM[b.t]; x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+w); y1=Math.max(y1,b.y+h);}
  let dx=0,dy=0;
  if(x0<.3) dx=.3-x0; else if(x1>Wu-.3) dx=Wu-.3-x1;
  if(y0<.3) dy=.3-y0; else if(y1>Hu-.3) dy=Hu-.3-y1;
  if(x1-x0>Wu-.6) dx=.3-x0; if(y1-y0>Hu-.6) dy=.3-y0;
  shift(ids,dx,dy);
}
function snapOffsets(leaderId,idset){
  const L=B.get(leaderId); const [lw,lh]=DIM[L.t]; const T=Math.max(1.2,20/u);
  let bx=null,by=null;
  for(const S of B.values()){
    if(idset.has(S.id)) continue; const [sw,sh]=DIM[S.t];
    const [gx,gy]=gap1(L,lw,lh,S,sw,sh); if(gx>T||gy>T) continue;
    const xc=[S.x-(L.x+lw),(S.x+sw)-L.x,S.x-L.x,(S.x+sw)-(L.x+lw)];
    const yc=[S.y-(L.y+lh),(S.y+sh)-L.y,S.y-L.y,(S.y+sh)-(L.y+lh)];
    for(const c of xc) if(Math.abs(c)<=T&&(bx===null||Math.abs(c)<Math.abs(bx))) bx=c;
    for(const c of yc) if(Math.abs(c)<=T&&(by===null||Math.abs(c)<Math.abs(by))) by=c;
  }
  return [bx||0,by||0];
}
function overlapPush(leaderId,idset){
  const L=B.get(leaderId); const [lw,lh]=DIM[L.t];
  for(const S of B.values()){
    if(idset.has(S.id)) continue; const [sw,sh]=DIM[S.t];
    const ox=Math.min(L.x+lw,S.x+sw)-Math.max(L.x,S.x), oy=Math.min(L.y+lh,S.y+sh)-Math.max(L.y,S.y);
    if(ox<=.15||oy<=.15) continue;
    if(ox*oy<.3*Math.min(lw*lh,sw*sh)) continue;
    const cands=[[S.x+sw-L.x,0],[S.x-lw-L.x,0],[0,S.y+sh-L.y],[0,S.y-lh-L.y]]
      .filter(([dx,dy])=>L.x+dx>=.3&&L.x+dx<=Wu-lw-.3&&L.y+dy>=.3&&L.y+dy<=Hu-lh-.3)
      .sort((a,b)=>Math.abs(a[0])+Math.abs(a[1])-Math.abs(b[0])-Math.abs(b[1]));
    if(cands.length) return cands[0];
  }
  return null;
}
function finalize(ids,leaderId){
  const set=new Set(ids); clampGroup(ids);
  const [sx,sy]=snapOffsets(leaderId,set); shift(ids,sx,sy);
  for(let k=0;k<4;k++){const p=overlapPush(leaderId,set); if(!p) break; shift(ids,p[0],p[1]);}
  clampGroup(ids);
}
function freeSpot(t){
  const [w,h]=DIM[t], pad=.8, y0=topPad(), cx=Wu/2, cy=(Hu+y0)/2; let best=null,bd=1e9;
  for(let y=y0;y<=Hu-h-.3;y+=1) for(let x=.3;x<=Wu-w-.3;x+=1){
    let ok=true;
    for(const s of B.values()){const [sw,sh]=DIM[s.t]; if(x<s.x+sw+pad&&x+w+pad>s.x&&y<s.y+sh+pad&&y+h+pad>s.y){ok=false;break;}}
    if(ok){const d=Math.hypot(x+w/2-cx,y+h/2-cy); if(d<bd){bd=d; best=[x,y];}}
  }
  return best||[(Wu-w)/2,(Hu-h)/2];
}

/* ---------- pointer interaction ---------- */
const marq=$('#marq');
const inRect=(e,r)=>e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
function overTray(e){const r=tray.getBoundingClientRect(); return r.width>0&&inRect(e,r);}

ws.addEventListener('pointerdown',e=>{
  if(isLocked()||e.button>0) return;
  if(e.target.closest('.cue,.banner,.note')) return;
  closePractice();
  const bel=e.target.closest('.blk'); const additive=e.shiftKey||e.ctrlKey||e.metaKey;
  const rect=ws.getBoundingClientRect();
  if(bel){
    e.preventDefault(); const id=+bel.dataset.id;
    if(sel.has(id)&&additive){sel.delete(id); sync(); return;}
    if(!sel.has(id)){ if(!additive) sel.clear(); sel.add(id); }
    for(const i of sel){const b=B.get(i); if(b) b.z=++zTop;}
    const orig=new Map([...sel].map(i=>[i,{x:B.get(i).x,y:B.get(i).y}]));
    drag={mode:'move',id,sx:e.clientX,sy:e.clientY,moved:false,orig,wasMulti:sel.size>1,additive};
    sync();
  }else{
    e.preventDefault();
    drag={mode:'marq',sx:e.clientX-rect.left,sy:e.clientY-rect.top,rect,moved:false,additive,base:new Set(additive?sel:[])};
    if(!additive){sel.clear(); paintSel(); updateButtons();}
  }
});
tiles.addEventListener('pointerdown',e=>{
  const tile=e.target.closest('.tile'); if(!tile||isLocked()) return;
  e.preventDefault(); closePractice();
  drag={mode:'tray',t:tile.dataset.t,sx:e.clientX,sy:e.clientY,moved:false,ghost:null};
});
function tapAdd(t){
  if(isLocked()) return;
  pushUndo(); const [x,y]=freeSpot(t); const id=addBlock(t,x,y,{pop:true});
  sel.clear(); sel.add(id); sync();
}
tiles.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const tile=e.target.closest('.tile'); if(tile){e.preventDefault(); tapAdd(tile.dataset.t);}}
});

window.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(drag.mode==='move'){
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(!drag.moved){
      if(Math.hypot(dx,dy)<5) return;
      drag.moved=true; pushUndo(); ws.classList.add('dragging');
      for(const i of drag.orig.keys()){const el=els.get(i); if(el) el.classList.add('drag');}
      ws.querySelectorAll('.cue,.ring').forEach(n=>n.remove());
    }
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const [i,o] of drag.orig){const b=B.get(i); const [w,h]=DIM[b.t]; x0=Math.min(x0,o.x); y0=Math.min(y0,o.y); x1=Math.max(x1,o.x+w); y1=Math.max(y1,o.y+h);}
    const ddx=clamp(dx/u,.2-x0,Wu-.2-x1), ddy=clamp(dy/u,.2-y0,Hu-.2-y1);
    for(const [i,o] of drag.orig){const b=B.get(i),el=els.get(i); b.x=o.x+ddx; b.y=o.y+ddy; el.style.left=f(b.x*u)+'px'; el.style.top=f(b.y*u)+'px';}
    tray.classList.toggle('del',overTray(e));
    $('#trayNote').textContent=overTray(e)?'Release to remove':'Drag or tap to add. Drag blocks back here to remove them.';
  }else if(drag.mode==='marq'){
    const rect=drag.rect; const cx=clamp(e.clientX-rect.left,0,rect.width), cy=clamp(e.clientY-rect.top,0,rect.height);
    if(!drag.moved&&Math.hypot(cx-drag.sx,cy-drag.sy)<5) return;
    drag.moved=true;
    const x0=Math.min(cx,drag.sx),y0=Math.min(cy,drag.sy),x1=Math.max(cx,drag.sx),y1=Math.max(cy,drag.sy);
    marq.hidden=false; Object.assign(marq.style,{left:x0+'px',top:y0+'px',width:(x1-x0)+'px',height:(y1-y0)+'px'});
    sel.clear(); drag.base.forEach(i=>sel.add(i));
    for(const b of B.values()){const [w,h]=DIM[b.t]; if(b.x*u<x1&&(b.x+w)*u>x0&&b.y*u<y1&&(b.y+h)*u>y0) sel.add(b.id);}
    paintSel();
  }else if(drag.mode==='tray'){
    if(!drag.moved){
      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
      drag.moved=true; const [w,h]=DIM[drag.t]; const g=document.createElement('div'); g.className='ghost';
      g.innerHTML=blockSVG(drag.t,u); g.style.width=f(w*u)+'px'; g.style.height=f(h*u)+'px'; document.body.appendChild(g); drag.ghost=g;
    }
    const [w,h]=DIM[drag.t]; drag.ghost.style.left=f(e.clientX-w*u/2)+'px'; drag.ghost.style.top=f(e.clientY-h*u/2)+'px';
    drag.ghost.style.opacity=inRect(e,ws.getBoundingClientRect())?1:.55;
  }
});
function endDrag(e,cancelled){
  if(!drag) return; const d=drag; drag=null;
  tray.classList.remove('del'); $('#trayNote').textContent='Drag or tap to add. Drag blocks back here to remove them.';
  ws.classList.remove('dragging');
  if(d.mode==='move'){
    for(const i of d.orig.keys()){const el=els.get(i); if(el) el.classList.remove('drag');}
    if(d.moved){
      const ids=[...d.orig.keys()];
      if(!cancelled&&overTray(e)){ ids.forEach(i=>{B.delete(i); sel.delete(i);}); }
      else{ ws.classList.add('settle'); finalize(ids,d.id); setTimeout(()=>ws.classList.remove('settle'),200); }
      sync();
    }else{
      if(!d.additive&&d.wasMulti){sel.clear(); sel.add(d.id);}
      const now=performance.now();
      if(lastTap.id===d.id&&now-lastTap.t<380){lastTap={id:0,t:0}; sel.clear(); sel.add(d.id); sync(); doBreak([d.id]); return;}
      lastTap={id:d.id,t:now}; sync();
    }
  }else if(d.mode==='marq'){
    marq.hidden=true; if(!d.moved&&!d.additive) sel.clear(); sync();
  }else if(d.mode==='tray'){
    if(!d.moved){ tapAdd(d.t); return; }
    d.ghost.remove();
    const r=ws.getBoundingClientRect();
    if(!cancelled&&inRect(e,r)){
      pushUndo(); const [w,h]=DIM[d.t];
      const id=addBlock(d.t,(e.clientX-r.left)/u-w/2,(e.clientY-r.top)/u-h/2,{pop:false});
      finalize([id],id); sel.clear(); sel.add(id); sync();
    }
  }
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

/* ---------- Break ---------- */
function layoutSpread(pt,cx,cy){
  const out=[];
  if(pt==='t'){ const gw=5*1.5-.5,gh=2*1.5-.5; for(let i=0;i<10;i++) out.push({x:cx-gw/2+(i%5)*1.5,y:cy-gh/2+Math.floor(i/5)*1.5}); }
  else if(pt==='h'){ const gw=10*1.5-.5; for(let i=0;i<10;i++) out.push({x:cx-gw/2+i*1.5,y:cy-5}); }
  else { const p=11.4,gw=5*p-1.4,gh=2*p-1.4; for(let i=0;i<10;i++) out.push({x:cx-gw/2+(i%5)*p,y:cy-gh/2+Math.floor(i/5)*p}); }
  return out;
}
function fitTargets(arr,ct){
  const [w,h]=DIM[ct]; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  arr.forEach(p=>{x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x+w); y1=Math.max(y1,p.y+h);});
  let dx=0,dy=0; if(x0<.3) dx=.3-x0; else if(x1>Wu-.3) dx=Wu-.3-x1; if(y0<topPad()) dy=topPad()-y0; else if(y1>Hu-.3) dy=Hu-.3-y1;
  arr.forEach(p=>{p.x+=dx; p.y+=dy;});
}
function breakNote(tally){
  const types=Object.keys(tally);
  if(types.length!==1){ const n=types.reduce((a,t)=>a+tally[t],0); note('Broke '+n+' blocks into smaller ones',''); return; }
  const t=types[0], n=tally[t], c=PREV[t];
  note(`${n} ${nm(t,n)} = ${10*n} ${nm(c,10*n)}`, `${n*VAL[t]} = ${10*n} × ${VAL[c]}`, demo?0:4200);
}
function breakNow(ids){
  const parents=ids.map(i=>B.get(i)).filter(b=>b&&b.t!=='o');
  if(!parents.length) return Promise.resolve(false);
  pushUndo(); busy=true; const tally={}; const moves=[];
  for(const p of parents){
    tally[p.t]=(tally[p.t]||0)+1;
    const ct=PREV[p.t], [pw,ph]=DIM[p.t];
    const targets=layoutSpread(p.t,p.x+pw/2,p.y+ph/2); fitTargets(targets,ct);
    B.delete(p.id); sel.delete(p.id);
    for(let i=0;i<10;i++){
      let sx,sy;
      if(p.t==='t'){sx=p.x; sy=p.y+i;} else if(p.t==='h'){sx=p.x+i; sy=p.y;} else {sx=p.x+i*DEP/10; sy=p.y+DEP-i*DEP/10;}
      const id=nextId++; const b={id,t:ct,x:sx,y:sy,z:p.t==='k'?zTop+10-i:zTop+1}; B.set(id,b); moves.push({b,tx:targets[i].x,ty:targets[i].y});
    }
    zTop+=11;
  }
  sync(); void ws.offsetWidth; ws.classList.add('moving');
  moves.forEach(m=>{m.b.x=m.tx; m.b.y=m.ty;}); sync();
  return new Promise(res=>setTimeout(()=>{ws.classList.remove('moving'); busy=false; sync(); breakNote(tally); res(true);},580));
}
function doBreak(ids){
  if(isLocked()) return;
  const ok=ids.filter(i=>B.get(i)&&B.get(i).t!=='o');
  if(!ok.length){
    if(ids.length) note('A One is the smallest block','It cannot be broken any further.');
    else if([...B.values()].some(b=>b.t!=='o')) note('Tap a block to select it, then press Break','Or double-tap a block.');
    else note('Add a Ten, Hundred or Thousand to break');
    return;
  }
  breakNow(ok);
}

/* ---------- Regroup ---------- */
function regroupGroups(groups){
  if(!groups.length) return Promise.resolve(false);
  pushUndo(); busy=true; const plan=[]; const tally={};
  for(const g of groups){
    const [w,h]=DIM[g.t]; const nt=NEXT[g.t], [nw,nh]=DIM[nt];
    const cx=g.blocks.reduce((a,b)=>a+b.x+w/2,0)/10, cy=g.blocks.reduce((a,b)=>a+b.y+h/2,0)/10;
    const nx=clamp(cx-nw/2,.3,Wu-nw-.3), ny=clamp(cy-nh/2,.3,Hu-nh-.3);
    g.blocks.forEach((b,i)=>{
      let tx,ty; if(nt==='t'){tx=nx; ty=ny+i;} else if(nt==='h'){tx=nx+i; ty=ny;} else {tx=nx+i*DEP/10; ty=ny+DEP-i*DEP/10;}
      plan.push({b,tx,ty}); b.z=nt==='k'?zTop+10-i:zTop+1;
    });
    zTop+=11; tally[g.t]=(tally[g.t]||0)+1;
    g.nt=nt; g.nx=nx; g.ny=ny;
  }
  ws.classList.add('moving'); plan.forEach(m=>{m.b.x=m.tx; m.b.y=m.ty;}); sel.clear(); sync();
  return new Promise(res=>setTimeout(()=>{
    for(const g of groups){
      g.blocks.forEach(b=>B.delete(b.id));
      const id=addBlock(g.nt,g.nx,g.ny,{pop:true}); const nb=B.get(id); nb.x=g.nx; nb.y=g.ny;
    }
    ws.classList.remove('moving'); busy=false; sync();
    const types=Object.keys(tally);
    if(types.length===1){
      const t=types[0], k=tally[t];
      note(`${10*k} ${nm(t,10*k)} = ${k} ${nm(NEXT[t],k)}`,`${10*k} × ${VAL[t]} = ${k*VAL[NEXT[t]]}`,demo?0:4200);
    }else note('Regrouped into bigger blocks');
    res(true);
  },560));
}
function doRegroup(){
  if(isLocked()) return;
  let groups=[];
  if(sel.size){
    groups=groupsFromIds([...sel]);
    if(!groups.length){
      const c={o:0,t:0,h:0}; sel.forEach(i=>{const b=B.get(i); if(b&&c[b.t]!==undefined) c[b.t]++;});
      const t=['o','t','h'].sort((a,b)=>c[b]-c[a])[0];
      if(c[t]>0) note(`Select 10 ${NAME[t][1]} to make 1 ${NAME[NEXT[t]][0]}`,`You have ${c[t]} selected.`);
      else note('Thousands are the biggest block','They cannot be regrouped.');
      return;
    }
  }else{
    clusters.forEach(c=>groups.push(...groupsFromBlocks(c.t,c.blocks)));
    if(!groups.length){
      const c=counts(); const t=['o','t','h'].find(t=>c[t]>=10);
      if(t) note(`Move 10 ${NAME[t][1]} close together`,'Then press Regroup.');
      else note('Put 10 of the same block together','Then press Regroup.');
      return;
    }
  }
  regroupGroups(groups);
}

/* ---------- toolbar actions ---------- */
function deleteSel(){
  if(isLocked()||!sel.size) return; pushUndo(); sel.forEach(i=>B.delete(i)); sel.clear(); sync();
}
function doUndo(){
  if(isLocked()||!undoStack.length) return; restore(undoStack.pop());
  if(ch&&ch.done){ch.done=false; showChallengeBanner();}
}
function doReset(){
  if(isLocked()) return;
  if(B.size||strokes.length) pushUndo();
  strokes=[]; redrawInk();
  if(ch){ch.done=false; setupChallenge(ch); showChallengeBanner();}
  else{B.clear(); sel.clear(); sync();}
  hideNote();
}
btnBreak.addEventListener('click',()=>doBreak([...sel]));
btnRegroup.addEventListener('click',doRegroup);
btnUndo.addEventListener('click',doUndo);
btnReset.addEventListener('click',doReset);
btnDelete.addEventListener('click',()=>{ if(isLocked()) return; if(!sel.size){note('Tap a block to select it, then press Delete'); return;} deleteSel(); });
$('#btnBlocks').addEventListener('click',e=>{
  const open=main.classList.toggle('noTray'); e.currentTarget.setAttribute('aria-pressed',String(!open));
});
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault(); doUndo();}
  else if(e.key==='Delete'||e.key==='Backspace'){ if(document.activeElement===document.body) deleteSel(); }
  else if(e.key==='Escape'){sel.clear(); sync(); closePractice();}
});

/* ---------- practice menu ---------- */
const prac=$('#prac'), btnPractice=$('#btnPractice');
function closePractice(){prac.hidden=true; btnPractice.setAttribute('aria-expanded','false');}
btnPractice.addEventListener('click',e=>{e.stopPropagation(); const open=prac.hidden; prac.hidden=!open; btnPractice.setAttribute('aria-expanded',String(open));});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pwrap')) closePractice();});
$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; level=+b.dataset.l;
  $('#seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});
$('#pStart').addEventListener('click',()=>{closePractice(); newChallenge();});
$('#pWatch').addEventListener('click',()=>{closePractice(); runDemo();});

/* ---------- challenge ---------- */
const RANGE={99:[10,99],999:[100,999],9999:[1000,9999]};
function genChallenge(){
  const pairs=level===99?[['t','o']]:level===999?[['t','o'],['h','t']]:[['t','o'],['h','t'],['k','h']];
  let c,tries=0;
  do{
    const r=Math.random();
    if(r<.55){const [a,b]=RANGE[level]; const n=randInt(a,b); c={kind:'build',n,text:'Build '+n};}
    else{
      const [big,small]=pairs[randInt(0,pairs.length-1)];
      if(r<.8) c={kind:'break',from:big,to:small,text:`Break 1 ${NAME[big][0]} into ${NAME[small][1]}.`};
      else c={kind:'regroup',from:small,to:big,text:`Regroup 10 ${NAME[small][1]} into 1 ${NAME[big][0]}.`};
    }
  }while(c.text===lastText&&++tries<20);
  lastText=c.text; return c;
}
function setupChallenge(c){
  B.clear(); sel.clear();
  if(c.kind==='break'){
    const [w,h]=DIM[c.from]; addBlock(c.from,(Wu-w)/2,topPad()+(Hu-topPad()-h)/2,{pop:true});
  }else if(c.kind==='regroup'){
    const [w,h]=DIM[c.from]; const gap=c.from==='h'?1.5:2.6, px=w+gap, py=h+gap;
    const gw=5*px-gap, gh=2*py-gap, ox=(Wu-gw)/2, oy=topPad()+(Hu-topPad()-gh)/2, j=c.from==='h'?.25:.5;
    for(let i=0;i<10;i++) addBlock(c.from,ox+(i%5)*px+(Math.random()-.5)*2*j,oy+Math.floor(i/5)*py+(Math.random()-.5)*2*j,{pop:true});
  }
  sync();
}
function showChallengeBanner(){
  if(!ch) return;
  showBanner(ch.text,'', null,'Exit','');
  onEnd=endChallenge;
}
function newChallenge(){
  demoTok++; demo=false; hideNote();
  if(B.size) pushUndo();
  ch=genChallenge(); ch.done=false; setupChallenge(ch); showChallengeBanner(); onNext=newChallenge;
  sync();
}
function endChallenge(){ch=null; hideBanner(); sync();}
function checkChallenge(){
  if(!ch||ch.done||busy||demo) return;
  const c=counts(); let ok=false, hint='';
  if(ch.kind==='build'){
    const n=ch.n, d={k:Math.floor(n/1000),h:Math.floor(n/100)%10,t:Math.floor(n/10)%10,o:n%10};
    const total=c.k*1000+c.h*100+c.t*10+c.o;
    ok=TYPES.every(t=>c[t]===d[t]);
    if(!ok&&total===n) hint='Right total! Use fewer blocks by regrouping.';
  }else if(ch.kind==='break') ok=c[ch.to]===10&&TYPES.every(t=>t===ch.to||c[t]===0);
  else ok=c[ch.to]===1&&TYPES.every(t=>t===ch.to||c[t]===0);
  if(ok){
    ch.done=true;
    const msg=ch.kind==='build'?`✓ Great! You built ${ch.n}.`:ch.kind==='break'?`✓ Great! 1 ${NAME[ch.from][0]} = 10 ${NAME[ch.to][1]}.`:`✓ Great! 10 ${NAME[ch.from][1]} = 1 ${NAME[ch.to][0]}.`;
    showBanner(msg,'','Next challenge','Exit','good'); onNext=newChallenge; onEnd=endChallenge;
  }else{
    const s=$('#bSub'); s.textContent=hint; s.style.display=hint?'':'none';
  }
}

/* ---------- guided demo ---------- */
async function runDemo(){
  endChallengeSilently();
  const tok=++demoTok; demo=true; const alive=()=>tok===demoTok; hideNote();
  if(B.size) pushUndo(); B.clear(); sel.clear(); sync();
  showBanner('Watch: breaking a Hundred','', null,'Stop',''); onEnd=()=>{demoTok++; demo=false; hideNote(); showDemoDone(false); sync();};
  const cy=Hu*.33;
  const hid=addBlock('h',(Wu-10)/2,cy-5,{pop:true}); sync();
  note('1 Hundred','100',0); await sleep(1500); if(!alive()) return;
  sel.add(hid); sync(); await sleep(900); if(!alive()) return;
  await breakNow([hid]); if(!alive()) return;
  await sleep(3000); if(!alive()) return;
  hideNote();
  const tens=[...B.values()].filter(b=>b.t==='t').sort((a,b)=>a.x-b.x); const tb=tens[4];
  sel.clear(); sel.add(tb.id); sync(); await sleep(800); if(!alive()) return;
  ws.classList.add('moving'); tb.x=(Wu-1)/2; tb.y=Math.min(Hu-10.6,cy+7); sync(); await sleep(700); ws.classList.remove('moving'); if(!alive()) return;
  note('Now break 1 Ten','',0); await sleep(1100); if(!alive()) return;
  await breakNow([tb.id]); if(!alive()) return;
  await sleep(3000); if(!alive()) return;
  note('And back again','Regroup 10 Ones into 1 Ten',0); await sleep(1500); if(!alive()) return;
  await regroupGroups(groupsFromBlocks('o',[...B.values()].filter(b=>b.t==='o'))); if(!alive()) return;
  await sleep(2200); if(!alive()) return;
  await regroupGroups(groupsFromBlocks('t',[...B.values()].filter(b=>b.t==='t'))); if(!alive()) return;
  await sleep(2600); if(!alive()) return;
  demo=false; hideNote(); showDemoDone(true); sync();
}
function showDemoDone(){
  showBanner('Now you try!','Break a block, or press Regroup to join 10 back together.','Watch again','Close','');
  onNext=runDemo; onEnd=()=>{hideBanner();};
}
function endChallengeSilently(){ch=null;}

/* ---------- drawing (pencil & eraser) ---------- */
const ink=$('#ink'), ictx=ink.getContext('2d');
const btnPen=$('#btnPen'), btnEraser=$('#btnEraser');
const PEN_PX=3.2, ERASE_PX=28;
let inkCol='#14213D';
function sizeInk(){
  const d=window.devicePixelRatio||1, W=ws.clientWidth, H=ws.clientHeight; if(!W||!H) return;
  ink.width=Math.round(W*d); ink.height=Math.round(H*d); redrawInk();
}
function drawStroke(c,s,i0){
  const n=s.p.length; if(!n) return;
  const d=window.devicePixelRatio||1;
  c.save(); c.setTransform(d,0,0,d,0,0);
  c.lineCap='round'; c.lineJoin='round'; c.lineWidth=Math.max(1,s.w*u);
  const col=s.e?'#000':inkCol; c.strokeStyle=col; c.fillStyle=col;
  c.globalCompositeOperation=s.e?'destination-out':'source-over';
  const P=i=>[(s.p[i][0]+off[0])*u,(s.p[i][1]+off[1])*u];
  const a=P(i0); c.beginPath();
  if(n-i0===1){ c.arc(a[0],a[1],c.lineWidth/2,0,Math.PI*2); c.fill(); }
  else{
    c.moveTo(a[0],a[1]);
    for(let i=i0+1;i<n-1;i++){const p=P(i),q=P(i+1); c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
    const l=P(n-1); c.lineTo(l[0],l[1]); c.stroke();
  }
  c.restore();
}
function redrawInk(){
  inkCol=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#14213D';
  ictx.clearRect(0,0,ink.width,ink.height);
  for(const s of strokes) drawStroke(ictx,s,0);
}
if(window.matchMedia) window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>setTimeout(redrawInk,50));
function setTool(t){
  tool=(tool===t)?'select':t;
  ws.classList.toggle('drawing',tool!=='select'); ws.classList.toggle('erasing',tool==='eraser');
  btnPen.setAttribute('aria-pressed',String(tool==='pen')); btnEraser.setAttribute('aria-pressed',String(tool==='eraser'));
  if(tool!=='select'&&sel.size){sel.clear(); sync();}
}
btnPen.addEventListener('click',()=>setTool('pen'));
btnEraser.addEventListener('click',()=>setTool('eraser'));
ink.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  e.preventDefault(); e.stopPropagation();
  if(cur||isLocked()) return;
  closePractice();
  try{ink.setPointerCapture(e.pointerId);}catch(_){}
  const r=ink.getBoundingClientRect(), er=tool==='eraser';
  const x=(e.clientX-r.left)/u-off[0], y=(e.clientY-r.top)/u-off[1];
  pushUndo();
  cur={id:e.pointerId,e:er,w:(er?ERASE_PX:PEN_PX)/u,p:[[x,y]],r};
  strokes.push(cur); drawStroke(ictx,cur,0); updateButtons();
});
ink.addEventListener('pointermove',e=>{
  if(!cur||e.pointerId!==cur.id) return;
  e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; let added=false;
  for(const ev of (evs.length?evs:[e])){
    const x=(ev.clientX-cur.r.left)/u-off[0], y=(ev.clientY-cur.r.top)/u-off[1];
    const l=cur.p[cur.p.length-1];
    if(Math.hypot((x-l[0])*u,(y-l[1])*u)<1.2) continue;
    cur.p.push([x,y]); added=true;
  }
  if(added) drawStroke(ictx,cur,Math.max(0,cur.p.length-4));
});
const endInk=e=>{ if(cur&&e.pointerId===cur.id){ cur=null; } };
ink.addEventListener('pointerup',endInk);
ink.addEventListener('pointercancel',endInk);
ink.addEventListener('lostpointercapture',endInk);

/* ---------- zoom ---------- */
const ZS=[.5,.6,.7,.8,.9,1,1.15,1.3,1.5,1.75,2];
const btnZoomIn=$('#btnZoomIn'), btnZoomOut=$('#btnZoomOut');
function updateZoomBtns(){btnZoomOut.disabled=zoom<=ZS[0]; btnZoomIn.disabled=zoom>=ZS[ZS.length-1];}
function zoomStep(dir){
  if(isLocked()) return;
  let idx=0; ZS.forEach((z,i)=>{ if(Math.abs(z-zoom)<Math.abs(ZS[idx]-zoom)) idx=i; });
  const z=ZS[clamp(idx+dir,0,ZS.length-1)]; if(z===zoom) return;
  const oW=Wu,oH=Hu; zoom=z; measure();
  const dx=(Wu-oW)/2, dy=(Hu-oH)/2;
  for(const b of B.values()){b.x+=dx; b.y+=dy;}
  for(const sn of undoStack) for(const b of sn.bl){b.x+=dx; b.y+=dy;}
  off[0]+=dx; off[1]+=dy;
  sync(); redrawInk(); updateZoomBtns();
}
btnZoomIn.addEventListener('click',()=>zoomStep(1));
btnZoomOut.addEventListener('click',()=>zoomStep(-1));
updateZoomBtns();

/* ---------- full screen ---------- */
const btnFull=$('#btnFull'), docEl=document.documentElement;
const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled)) btnFull.hidden=true;
btnFull.addEventListener('click',()=>{
  let p;
  if(fsOn()) p=(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else p=(docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl);
  if(p&&p.catch) p.catch(()=>{});
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const on=!!fsOn(); btnFull.setAttribute('aria-pressed',String(on));
  btnFull.setAttribute('aria-label',on?'Exit full screen':'Full screen'); btnFull.title=on?'Exit full screen':'Full screen';
}));

/* ---------- resize ---------- */
let rsT=0;
function relayout(){
  const oldU=u; measure(); sizeInk();
  for(const b of B.values()) clampB(b);
  renderTray();
  if(oldU!==u||els.size===0||true) sync();
}
new ResizeObserver(()=>{cancelAnimationFrame(rsT); rsT=requestAnimationFrame(relayout);}).observe(main);
relayout();
})();
</script>
