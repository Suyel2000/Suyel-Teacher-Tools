<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fraction Strips Manipulative</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --border-heavy: #000000;
            --primary: #2563eb;

            /* Exact palette progression from reference image */
            --c1: #ff4d4d;   /* Whole - Bright Coral/Red */
            --c2: #ff9933;   /* Halves - Vibrant Orange */
            --c3: #ffeb3b;   /* Thirds - Bright Yellow */
            --c4: #8bc34a;   /* Fourths - Light Green */
            --c5: #2ecc71;   /* Fifths - Turquoise/Green */
            --c6: #38bdf8;   /* Sixths - Light Blue */
            --c7: #3b82f6;   /* Sevenths - Deep Blue */
            --c8: #a855f7;   /* Eighths - Purple */
            --c9: #ec4899;   /* Ninths - Pink */
            --c10: #c084fc;  /* Tenths - Lavender/Purple */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 0.4rem 1rem;
            border: 3px solid var(--border-heavy);
            border-radius: 12px;
            height: 48px;
            box-shadow: 3px 3px 0px var(--border-heavy);
            flex-shrink: 0;
        }

        header h1 {
            color: #000000;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        .instruction-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            background: #f1f5f9;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            border: 2px solid var(--border-heavy);
        }

        .main-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 0.5rem;
            height: calc(100vh - 64px);
            overflow: hidden;
        }

        .panel {
            background: var(--bg-card);
            border: 3px solid var(--border-heavy);
            border-radius: 12px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            height: 100%;
            position: relative;
            box-shadow: 3px 3px 0px var(--border-heavy);
            overflow: hidden;
        }

        .panel h2 {
            font-size: 0.85rem;
            color: var(--border-heavy);
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-heavy);
            padding-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f8fafc;
            padding: 0.3rem;
            border-radius: 8px;
            border: 2px solid var(--border-heavy);
            flex-shrink: 0;
        }

        button {
            border: 2px solid var(--border-heavy);
            padding: 0.3rem 0.6rem;
            font-weight: 800;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            background: white;
            color: var(--border-heavy);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s ease;
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        .btn-active {
            background: #2563eb !important;
            color: white !important;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-toggle-unit {
            background: #e0f2fe;
            color: #0369a1;
        }

        .btn-toggle-unit.active-double {
            background: #16a34a;
            color: white;
        }

        /* Sidebar Strips Drawer */
        .source-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            overflow-y: auto;
            flex: 1;
            padding-right: 0.2rem;
        }

        .source-list::-webkit-scrollbar {
            width: 6px;
        }

        .source-list::-webkit-scrollbar-thumb {
            background: var(--border-heavy);
            border-radius: 3px;
        }

        .source-strip-item {
            background: #ffffff;
            border: 2px solid var(--border-heavy);
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .source-strip-item:hover {
            transform: translateY(-1px);
            box-shadow: 2px 3px 0px var(--border-heavy);
        }

        .single-piece-unit {
            width: 44px;
            height: 26px;
            border: 2px solid var(--border-heavy);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-weight: 900;
        }

        .source-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--border-heavy);
            text-transform: capitalize;
        }

        /* Stacked Fraction Formatting */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-weight: 900;
            line-height: 1;
            color: #000000;
        }

        .frac .top {
            border-bottom: 2px solid #000000;
            padding-bottom: 1px;
            margin-bottom: 1px;
            font-size: 0.85em;
        }

        .frac .bottom {
            font-size: 0.85em;
        }

        .whole-num {
            font-size: 1.3em;
            font-weight: 900;
            color: #000000;
        }

        /* Workspace & Canvas Wrapper */
        .workspace-canvas-wrapper {
            position: relative;
            flex: 1;
            border-radius: 8px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
            overflow: hidden;
            border: 3px solid var(--border-heavy);
        }

        /* Fraction Tracks - Clean, Solid Polished Appearance */
        .work-box-row {
            display: flex;
            align-items: center;
            width: 100%;
            height: 10%;
            position: relative;
            box-sizing: border-box;
            background: #ffffff;
            border-bottom: 3px solid var(--border-heavy);
        }

        .work-box-row:last-child {
            border-bottom: none;
        }

        .work-box-row.drag-over {
            background: #f0f9ff;
        }

        .row-action-delete {
            position: absolute;
            right: 6px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--border-heavy);
            color: #ef4444;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.75rem;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex; /* Always visible */
            align-items: center;
            justify-content: center;
            box-shadow: 1px 1px 0px var(--border-heavy);
            padding: 0;
        }

        .row-action-delete:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.1);
        }

        .fraction-builder-track {
            display: flex;
            width: 100%;
            height: 100%;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .work-segment-block {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border-right: 3px solid var(--border-heavy);
            position: relative;
        }

        .work-segment-block:last-child {
            border-right: none;
        }

        .unit-divider-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #000000;
            z-index: 10;
            pointer-events: none;
        }

        #annotation-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        #annotation-overlay.drawing-active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* Responsive Scaling Adjustments */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .panel {
                height: auto;
            }
            .workspace-canvas-wrapper {
                height: 500px;
            }
            .frac .top, .frac .bottom {
                font-size: 0.7em;
            }
            .whole-num {
                font-size: 1em;
            }
        }
    </style>

</head>
<body>

    <header>
        <h1>Fraction Strips</h1>
        <div class="instruction-tag">Drag or click fraction pieces to build horizontal fraction strips</div>
    </header>

    <main class="main-container">

        <!-- Sidebar Drawer -->
        <section class="panel">
            <h2>Fraction Pieces</h2>
            <div class="source-list" id="source-strips-container">
                <!-- Programmatically generated list -->
            </div>
        </section>

        <!-- Main Workspace -->
        <section class="panel" style="flex:1;">
            
            <div class="controls-row">
                <button id="unit-toggle-btn" class="btn-toggle-unit" onclick="lab.toggleUnitScaling()">📏 Mode: 1 Whole</button>
                
                <div style="width: 2px; height: 18px; background: var(--border-heavy); margin: 0 0.2rem;"></div>

                <button id="tool-draw-btn" onclick="lab.setAnnotationTool('draw')">✏️ Draw</button>
                <button id="tool-erase-btn" onclick="lab.setAnnotationTool('erase')">🧽 Erase</button>
                <button class="btn-danger" style="background:none; border-color:transparent; box-shadow:none;" onclick="lab.clearAnnotationInk()">Clear Ink</button>
                
                <div style="width: 2px; height: 18px; background: var(--border-heavy); margin: 0 0.1rem; margin-left: auto;"></div>
                
                <button class="btn-danger" onclick="lab.clearAllWorkspaceSlots()">🔄 Reset All Strips</button>
            </div>
            
            <div class="workspace-canvas-wrapper" id="canvas-container-frame">
                
                <canvas id="annotation-overlay"></canvas>
                
                <div id="workspace-slots-target" style="display:flex; flex-direction:column; height:100%; width:100%; z-index:2;">
                    <!-- 10 Full-Width Interactive Fraction Bars -->
                </div>

            </div>
        </section>

    </main>

    <script>
        class EngagingFractionLab {
            constructor() {
                // Config matching exact palette and stacked fraction typography
                this.fractionConfig = {
                    1:  { textLabel: '1 Whole',   color: 'var(--c1)' },
                    2:  { textLabel: 'Halves',    color: 'var(--c2)' },
                    3:  { textLabel: 'Thirds',    color: 'var(--c3)' },
                    4:  { textLabel: 'Fourths',   color: 'var(--c4)' },
                    5:  { textLabel: 'Fifths',    color: 'var(--c5)' },
                    6:  { textLabel: 'Sixths',    color: 'var(--c6)' },
                    7:  { textLabel: 'Sevenths',  color: 'var(--c7)' },
                    8:  { textLabel: 'Eighths',   color: 'var(--c8)' },
                    9:  { textLabel: 'Ninths',    color: 'var(--c9)' },
                    10: { textLabel: 'Tenths',    color: 'var(--c10)' }
                };

                this.totalSlotsCount = 10;
                // Initialize workspace with all rows blank by default
                this.slotStates = Array.from({ length: this.totalSlotsCount }, () => []);
                
                this.isDoubleUnitMode = false;
                this.draggedDenominator = null;

                this.activeTool = 'none'; 
                this.isDrawing = false;
                this.ctx = null;
                this.canvas = null;
            }

            init() {
                this.renderSourceStripsDrawer();
                this.renderWorkspaceSlotsGrid();
                this.initAnnotationCanvasEngine();
                
                window.addEventListener('resize', () => this.resizeAnnotationCanvasSize());
            }

            getFractionHTML(denom) {
                if (denom === 1) {
                    return `<span class="whole-num">1</span>`;
                }
                return `<div class="frac"><span class="top">1</span><span class="bottom">${denom}</span></div>`;
            }

            renderSourceStripsDrawer() {
                const container = document.getElementById('source-strips-container');
                container.innerHTML = '';

                Object.keys(this.fractionConfig).map(Number).forEach(d => {
                    const cfg = this.fractionConfig[d];
                    
                    const item = document.createElement('div');
                    item.className = 'source-strip-item';
                    item.setAttribute('draggable', 'true');
                    
                    item.addEventListener('dragstart', () => { this.draggedDenominator = d; });
                    item.addEventListener('dragend', () => { this.draggedDenominator = null; });
                    item.addEventListener('click', () => { this.autoAddPieceToNextTrack(d); });

                    // Touch support for mobile/tablet drag-and-drop
                    item.addEventListener('touchstart', (e) => {
                        this.draggedDenominator = d;
                    }, { passive: true });

                    const labelText = document.createElement('div');
                    labelText.className = 'source-label';
                    labelText.innerText = cfg.textLabel;

                    const blockIcon = document.createElement('div');
                    blockIcon.className = 'single-piece-unit';
                    blockIcon.style.backgroundColor = cfg.color;
                    blockIcon.innerHTML = this.getFractionHTML(d);

                    item.appendChild(labelText);
                    item.appendChild(blockIcon);
                    container.appendChild(item);
                });
            }

            renderWorkspaceSlotsGrid() {
                const target = document.getElementById('workspace-slots-target');
                target.innerHTML = '';

                for (let idx = 0; idx < this.totalSlotsCount; idx++) {
                    const activePiecesList = this.slotStates[idx];

                    const row = document.createElement('div');
                    row.className = 'work-box-row';
                    
                    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
                    row.addEventListener('dragleave', () => { row.classList.remove('drag-over'); });
                    row.addEventListener('drop', (e) => {
                        e.preventDefault();
                        row.classList.remove('drag-over');
                        if (this.draggedDenominator) this.addPieceToSlotIndex(idx, this.draggedDenominator);
                    });

                    const builderTrack = document.createElement('div');
                    builderTrack.className = 'fraction-builder-track';

                    if (activePiecesList.length > 0) {
                        const maxDenominatorUnits = this.isDoubleUnitMode ? 2 : 1;

                        activePiecesList.forEach(denom => {
                            const cfg = this.fractionConfig[denom];
                            const segment = document.createElement('div');
                            segment.className = 'work-segment-block';
                            segment.style.backgroundColor = cfg.color;
                            
                            const baseWidthPercentage = (1 / denom) * (100 / maxDenominatorUnits);
                            segment.style.width = `${baseWidthPercentage}%`;
                            
                            segment.innerHTML = this.getFractionHTML(denom);
                            builderTrack.appendChild(segment);
                        });

                        if (this.isDoubleUnitMode) {
                            const unitDivider = document.createElement('div');
                            unitDivider.className = 'unit-divider-line';
                            builderTrack.appendChild(unitDivider);
                        }
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'row-action-delete';
                    delBtn.innerHTML = '✕';
                    delBtn.title = 'Clear Strip';
                    delBtn.onclick = () => { this.clearSingleTrackIndex(idx); };

                    row.appendChild(builderTrack);
                    row.appendChild(delBtn);
                    target.appendChild(row);
                }
            }

            addPieceToSlotIndex(slotIdx, denom) {
                const currentTrackLength = this.slotStates[slotIdx].reduce((acc, d) => acc + (1 / d), 0);
                const limitMax = this.isDoubleUnitMode ? 2 : 1;

                if (currentTrackLength + (1 / denom) <= limitMax + 0.0001) {
                    this.slotStates[slotIdx].push(denom);
                    this.renderWorkspaceSlotsGrid();
                }
            }

            autoAddPieceToNextTrack(denom) {
                const limitMax = this.isDoubleUnitMode ? 2 : 1;
                let targetRowIdx = this.slotStates.findIndex(pieces => {
                    const currentLength = pieces.reduce((acc, d) => acc + (1 / d), 0);
                    return currentLength + (1 / denom) <= limitMax + 0.0001;
                });

                if (targetRowIdx !== -1) {
                    this.addPieceToSlotIndex(targetRowIdx, denom);
                } else {
                    this.slotStates[0] = [denom];
                    this.renderWorkspaceSlotsGrid();
                }
            }

            clearSingleTrackIndex(slotIdx) {
                this.slotStates[slotIdx] = [];
                this.renderWorkspaceSlotsGrid();
            }

            clearAllWorkspaceSlots() {
                // Reset to blank fraction strip view
                this.slotStates = Array.from({ length: this.totalSlotsCount }, () => []);
                this.renderWorkspaceSlotsGrid();
            }

            toggleUnitScaling() {
                this.isDoubleUnitMode = !this.isDoubleUnitMode;
                const btn = document.getElementById('unit-toggle-btn');
                
                if (this.isDoubleUnitMode) {
                    btn.innerText = '📏 Mode: 2 Wholes';
                    btn.classList.add('active-double');
                } else {
                    btn.innerText = '📏 Mode: 1 Whole';
                    btn.classList.remove('active-double');
                }
                this.renderWorkspaceSlotsGrid();
            }

            /* Canvas Drawing Engine */
            initAnnotationCanvasEngine() {
                this.canvas = document.getElementById('annotation-overlay');
                this.ctx = this.canvas.getContext('2d');
                this.resizeAnnotationCanvasSize();

                this.canvas.addEventListener('mousedown', (e) => this.startDrawingSequence(e));
                this.canvas.addEventListener('mousemove', (e) => this.executeDrawingMove(e));
                this.canvas.addEventListener('mouseup', () => this.terminateDrawingSequence());
                this.canvas.addEventListener('mouseleave', () => this.terminateDrawingSequence());

                this.canvas.addEventListener('touchstart', (e) => {
                    const t = e.touches[0];
                    this.startDrawingSequence({ clientX: t.clientX, clientY: t.clientY });
                    e.preventDefault();
                }, { passive: false });
                this.canvas.addEventListener('touchmove', (e) => {
                    const t = e.touches[0];
                    this.executeDrawingMove({ clientX: t.clientX, clientY: t.clientY });
                    e.preventDefault();
                }, { passive: false });
                this.canvas.addEventListener('touchend', () => this.terminateDrawingSequence());
            }

            resizeAnnotationCanvasSize() {
                const container = document.getElementById('canvas-container-frame');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.canvas.width;
                tempCanvas.height = this.canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(this.canvas, 0, 0);

                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;

                this.ctx.drawImage(tempCanvas, 0, 0);
                this.configureContextPenRenderingDefaults();
            }

            setAnnotationTool(toolChoice) {
                if (this.activeTool === toolChoice) {
                    this.activeTool = 'none';
                } else {
                    this.activeTool = toolChoice;
                }

                document.getElementById('tool-draw-btn').className = (this.activeTool === 'draw') ? 'btn-active' : '';
                document.getElementById('tool-erase-btn').className = (this.activeTool === 'erase') ? 'btn-active' : '';

                this.canvas.className = (this.activeTool === 'none') ? '' : 'drawing-active';
                this.configureContextPenRenderingDefaults();
            }

            configureContextPenRenderingDefaults() {
                if (!this.ctx) return;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';

                if (this.activeTool === 'erase') {
                    this.ctx.globalCompositeOperation = 'destination-out';
                    this.ctx.lineWidth = 28;
                } else {
                    this.ctx.globalCompositeOperation = 'source-over';
                    this.ctx.lineWidth = 4;
                    this.ctx.strokeStyle = '#000000';
                }
            }

            startDrawingSequence(e) {
                if (this.activeTool === 'none') return;
                this.isDrawing = true;
                const rect = this.canvas.getBoundingClientRect();
                this.ctx.beginPath();
                this.ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            }

            executeDrawingMove(e) {
                if (!this.isDrawing || this.activeTool === 'none') return;
                const rect = this.canvas.getBoundingClientRect();
                this.ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                this.ctx.stroke();
            }

            terminateDrawingSequence() {
                this.isDrawing = false;
            }

            clearAnnotationInk() {
                if (!this.ctx) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        const lab = new EngagingFractionLab();
        window.addEventListener('DOMContentLoaded', () => lab.init());
    </script>
</body>
</html>
