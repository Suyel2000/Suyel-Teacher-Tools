<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Bonds Builder</title>
<style>
:root{--a:#2563eb;--b:#ea580c;--w:#7c3aed;--ink:#1f2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#eef3ff,#fff4f7 60%,#f2fff6);color:var(--ink);min-height:100vh}
header{text-align:center;padding:12px 60px 2px;position:relative}
#fs{position:absolute;right:12px;top:10px;width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(60,60,120,.2);display:grid;place-items:center;padding:0}
#fs svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{margin-top:8px;background:#ecfdf3;border-radius:16px;padding:8px 12px}
.fl h3{margin:0 0 6px;font-size:1rem;color:#166534}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.fc{background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;border:2px solid #86efac}
h1{margin:0;font-size:clamp(1.5rem,4.5vw,2.6rem);color:var(--w)}
header p{margin:2px 0 0;font-size:clamp(.9rem,2.2vw,1.2rem);color:#4b5080}
main{max-width:1100px;margin:0 auto;padding:8px 12px 28px;display:grid;gap:12px}
.card{background:#fff;border-radius:22px;padding:12px;box-shadow:0 4px 18px rgba(60,60,120,.12)}
button{font:inherit;cursor:pointer;border:0;color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #111;outline-offset:2px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px 6px;border-radius:16px;background:#fff;font-weight:800;font-size:clamp(.85rem,2.2vw,1.15rem);box-shadow:0 2px 8px rgba(60,60,120,.15);min-height:54px}
.tabs button.on{background:var(--w);color:#fff}
.sel{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-weight:800;color:#4b5080}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 14px;min-height:44px;border-radius:14px;background:#eef0fb;font-weight:800}
.chips button.on{background:var(--ink);color:#fff}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;position:relative;scroll-behavior:smooth}
.wt,.t{flex:0 0 auto;min-width:48px;height:48px;border-radius:14px;font-weight:900;font-size:1.25rem;background:hsl(var(--h) 90% 90%);border:3px solid hsl(var(--h) 60% 75%)}
.wt.on,.t.on{background:hsl(var(--h) 65% 38%);border-color:hsl(var(--h) 65% 28%);color:#fff;transform:scale(1.1)}
.work{display:grid;gap:12px}
@media(min-width:860px){.work{grid-template-columns:1.05fr 1fr}}
#prompt{text-align:center;min-height:2.2em;font-size:clamp(.95rem,2.2vw,1.15rem);display:flex;align-items:center;justify-content:center}
.big{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900}
#dia{width:100%;max-width:440px;display:block;margin:0 auto;max-height:46vh}
#dia g[data-slot]{cursor:pointer}
#dia .lab{font:800 13px sans-serif;fill:#fff;text-anchor:middle}
#dia .num{font-weight:900;fill:#fff;text-anchor:middle;font-family:inherit}
#msg{text-align:center;font-weight:800;font-size:clamp(1rem,2.4vw,1.25rem);min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:4px}
.nx,.chk{background:var(--w);color:#fff;border-radius:14px;padding:10px 18px;font-weight:800;min-height:46px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button{padding:10px 16px;min-height:48px;border-radius:14px;background:#eef0fb;font-weight:800}
.seg{display:flex;border-radius:14px;overflow:hidden;background:#eef0fb}
.seg button{background:none;border-radius:0}
.seg button.on{background:var(--ink);color:#fff}
.pt{text-align:center;font-weight:800;margin:10px 0 6px}
.ca{color:var(--a)}.cb{color:var(--b)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.t:disabled{opacity:.5}
.sl{display:flex;align-items:center;gap:8px}
.sl input{flex:1;height:36px;accent-color:var(--w)}
.sl .st{width:48px;height:48px;border-radius:50%;background:#eef0fb;font-size:1.6rem;font-weight:900}
.sl output{min-width:2.4em;text-align:center;font-weight:900;font-size:1.6rem}
.chk{display:block;margin:8px auto 0}
.pn{border:3px solid;border-radius:18px;padding:8px;margin-bottom:8px;flex:1 1 200px}
.pn.w{border-color:var(--w)}.pn.a{border-color:var(--a)}.pn.b{border-color:var(--b)}
.pn h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:1.1rem}
.pn.w h4{color:var(--w)}.pn.a h4{color:var(--a)}.pn.b h4{color:var(--b)}
.pp{display:flex;gap:8px;flex-wrap:wrap}
.boxes{display:flex;flex-wrap:wrap;gap:8px;--s:28px}
#wp{touch-action:none;cursor:grab;user-select:none}
.box{display:grid;grid-template-columns:repeat(5,var(--s));gap:calc(var(--s)/7);padding:6px;background:#f3f4fc;border-radius:10px}
.c{width:var(--s);height:var(--s);border-radius:50%;display:block;transition:background .25s}
.c.a{background:var(--a)}.c.b{background:var(--b)}.c.n{background:#a78bfa}
.c.e{background:#fff;border:2px dashed #9a9fcc}.c.x{background:#e3e5f4}
.eqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eqc{background:#f7f5ff;border-radius:16px;padding:8px 12px}
.eqc h3{margin:0 0 4px;font-size:.95rem;color:var(--w)}
.eqc p{margin:2px 0;font-size:clamp(1.1rem,2.6vw,1.4rem);font-weight:800}
.warn{color:#b45309}.hint{grid-column:1/-1;text-align:center;color:#4b5080;margin:6px}
#bonds h3{margin:0 0 8px}#bonds small{color:#4b5080;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:340px;overflow:auto;padding:4px}
.bc{background:#f7f5ff;border-radius:14px;padding:10px 6px;font-weight:900;font-size:1.15rem;min-height:52px;border:3px solid transparent}
.bc.f{background:#ecfdf3}.bc.cur{border-color:var(--w)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop .wc{animation:pop .6s ease;transform-box:fill-box;transform-origin:center}
.ok{animation:pop .5s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><button id="fs" aria-label="Full screen" title="Full screen"></button><h1>Number Bonds Builder</h1><p>Explore numbers. Discover parts. Build the whole!</p></header>
<main>
<nav class="tabs" id="tabs" role="tablist"></nav>
<section class="card sel">
  <div class="row"><span class="lbl">Range</span><div class="chips" id="ranges"></div></div>
  <div class="row" style="flex-wrap:nowrap"><span class="lbl">Whole</span><div class="strip" id="wstrip" style="flex:1;min-width:0"></div></div>
</section>
<div class="work">
  <section class="card">
    <div id="prompt"></div>
    <svg id="dia" viewBox="0 0 400 292" role="group" aria-label="Number bond diagram"></svg>
    <div id="msg" aria-live="polite"></div>
    <div class="bar">
      <button data-act="bonds" id="bbtn"></button>
      <button data-act="reset">↺ Reset</button>
    </div>
    <div id="picker"></div>
  </section>
  <section class="card">
    <div id="counters" role="img" aria-label="Counters showing the whole and its parts"></div>
    <div class="eqs" id="eqs"></div>
    <div class="fl" id="found" hidden></div>
  </section>
</div>
<section class="card" id="bonds" hidden></section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),AC='#2563eb',BC='#ea580c',WC='#7c3aed';
const S={mode:'explore',lo:1,hi:10,W:10,p:[6,4],auto:false,active:0,found:{},show:false,q:null,tries:0,solved:false,slots:[null,null],pv:0,msg:'',pop:0,done:false,tok:0};
let lastPop=0,lastW=0,lastLo=0;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cl=(v,m)=>Math.max(0,Math.min(m,v));
$('#tabs').innerHTML=[['explore','🔍 Explore'],['missing','❓ Find the Missing Part'],['build','🧱 Build the Bond']].map(m=>`<button role="tab" data-mode="${m[0]}">${m[1]}</button>`).join('');
$('#ranges').innerHTML=Array.from({length:10},(_,i)=>`<button data-r="${i*10+1}" data-h="${i*10+10}">${i*10+1}–${i*10+10}</button>`).join('');
const buildWhole=()=>{$('#wstrip').innerHTML=Array.from({length:S.hi-S.lo+1},(_,i)=>`<button class="wt" data-w="${S.lo+i}" style="--h:${((S.lo+i)*47)%360}" aria-label="Whole ${S.lo+i}">${S.lo+i}</button>`).join('')};
function buildPicker(){
  const W=S.W;let h='<div id="pt" class="pt"></div>';
  if(W<=20)h+='<div class="tiles">'+Array.from({length:W+1},(_,i)=>`<button class="t" data-v="${i}" style="--h:${(i*47)%360}">${i}</button>`).join('')+'</div>';
  else h+=`<div class="sl"><button class="st" data-d="-1" aria-label="minus one">−</button><input id="sr" type="range" min="0" max="${W}" value="0" aria-label="Choose a number"><button class="st" data-d="1" aria-label="plus one">+</button><output id="so">0</output></div><button class="chk" data-act="check" id="chk">Check ✓</button>`;
  $('#picker').innerHTML=h;
}
function newQ(){const W=S.W,a=W<2?Math.round(Math.random()):1+Math.floor(Math.random()*(W-1));S.q={W,known:a,ans:W-a,miss:Math.round(Math.random())}}
function reset(keep){
  const W=S.W;S.tok++;S.done=false;S.tries=0;S.solved=false;S.pv=0;S.active=0;
  if(S.mode==='explore'){S.p=[null,null];S.msg='🔍 Pick both parts — find pairs that make '+W+'!'}
  else if(S.mode==='missing'){if(!keep||!S.q||S.q.W!==W)newQ();S.msg='🤔 Which number is missing?'}
  else{S.slots=[null,null];S.msg='✏️ Choose two parts that make '+W+'.'}
  buildPicker();render();
}
function setRange(lo,hi){S.lo=lo;S.hi=hi;buildWhole();if(S.W<lo||S.W>hi)setWhole(lo===1?hi:lo);else render()}
function setWhole(w){S.W=w;reset(false)}
function vals(){
  if(S.mode==='explore')return S.p.slice();
  if(S.mode==='missing'){const q=S.q,r=[0,0];r[1-q.miss]=q.known;r[q.miss]=S.solved?q.ans:null;return r}
  return S.slots.slice();
}
function markFound(a,b){const k=S.W+':'+Math.min(a,b);const n=!S.found[k];S.found[k]=1;return n}
const foundN=()=>Object.keys(S.found).filter(k=>k.startsWith(S.W+':')).length;
function setPart(i,val){
  const W=S.W;val=cl(val,W);S.tok++;
  if(S.mode==='explore'){
    if(S.done){S.p=[null,null];S.done=false}
    S.p[i]=val;const o=1-i,[a,b]=S.p;
    if(S.p[o]==null){S.active=o;S.msg='👉 Now choose Part '+(o+1)+'.'}
    else{const s=a+b;
      if(s!==W)S.msg=`💡 ${a} + ${b} = ${s}, not ${W}. Try another combination!`;
      else{const n=markFound(a,b);S.done=true;S.msg=n?`🌟 New bond discovered! ${a} + ${b} = ${W}`:`👏 ${a} + ${b} = ${W} — you found that one already. Try another!`;if(n)S.pop++;}}
  }else if(S.mode==='build'){  }else if(S.mode==='build'){
    S.slots[i]=val;const o=1-i;if(S.slots[o]==null)S.active=o;
    const[a,b]=S.slots;
    if(a==null||b==null){S.msg='👉 Now choose the other part.';S.solved=false}
    else{const s=a+b;
      if(s===W){S.solved=true;S.pop++;markFound(a,b);S.msg=`🎉 Great thinking! ${a} + ${b} = ${W}`}
      else{S.solved=false;S.msg=s>W?`💡 ${a} + ${b} = ${s} — that's too many. Try a smaller part!`:`💡 ${a} + ${b} = ${s} — you need more to make ${W}. Try again!`}}
  }
  render();
}
function answer(v){
  if(S.solved)return;const q=S.q;
  if(v===q.ans){S.solved=true;S.pop++;S.msg='🎉 Excellent! You found the missing part!'}
  else{S.tries++;S.msg=v<q.ans?`💡 ${q.known} + ${v} = ${q.known+v} — not enough yet. Look at the empty counters!`:`💡 ${q.known} + ${v} = ${q.known+v} — that's too many. Try a smaller number!`}
  render();
}
function loadBond(a){S.tok++;S.mode='explore';S.done=true;S.p=[a,S.W-a];S.active=0;markFound(a,S.W-a);S.msg=`🌟 ${a} + ${S.W-a} = ${S.W}`;buildPicker();render()}
function act(a){
  if(a==='reset')reset(true);
  else if(a==='bonds'){S.show=!S.show;render();if(S.show)$('#bonds').scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a==='next'){if(S.mode==='build'){S.W=Math.max(2,S.lo+Math.floor(Math.random()*(S.hi-S.lo+1)))}reset(false)}
  else if(a==='check')answer(S.pv);
}
/* ---------- drawing ---------- */
function box(u,drag){
  const n=Math.max(10,Math.ceil(u.length/10)*10);let h='';
  for(let g=0;g<n;g+=10){h+='<div class="box">';for(let i=g;i<g+10;i++)h+=`<i class="c ${u[i]||'x'}"${drag?` data-i="${i}"`:''}></i>`;h+='</div>'}
  return h;
}
function panel(t,n,k,u,drag,s){return `<div class="pn ${k}"><h4><span>${t}</span><span>${n}</span></h4><div class="boxes" style="--s:${s}px"${drag?' id="wp"':''}>${box(u,drag)}</div></div>`}
function wholeUnits(v){
  const W=S.W,u=[];
  if(S.mode==='missing'&&!S.solved){
    if(!S.tries)return Array(W).fill('n');
    const kc=S.q.miss===1?'a':'b';for(let i=0;i<W;i++)u.push(i<S.q.known?kc:'e');return u;
  }
  const a=v[0]||0,b=v[1]||0;
  for(let i=0;i<a;i++)u.push('a');for(let i=0;i<b;i++)u.push('b');while(u.length<W)u.push('e');return u;
}
function counters(v){
  const W=S.W,s=W<=10?28:W<=20?20:W<=50?16:13,pu=i=>Array(v[i]||0).fill(i?'b':'a'),pn=i=>v[i]==null?'?':v[i];
  return panel('Whole',W,'w',wholeUnits(v),S.mode==='explore',s)+'<div class="pp">'+panel('Part 1',pn(0),'a',pu(0),0,s)+panel('Part 2',pn(1),'b',pu(1),0,s)+'</div>';
}
function svg(v){
  const W=S.W,pos=[[95,232],[305,232]];
  let h='<g stroke="#c4b5fd" stroke-width="12" stroke-linecap="round"><line x1="172.7" y1="106.2" x2="122.3" y2="187.8"/><line x1="227.3" y1="106.2" x2="277.7" y2="187.8"/></g>';
  const txt=(x,y,n,l)=>`<text class="lab" x="${x}" y="${y-24}">${l}</text><text class="num" x="${x}" y="${y+16}" style="font-size:${String(n).length>2?38:48}px">${n}</text>`;
  h+=`<g class="wc"><circle cx="200" cy="62" r="52" fill="${WC}"/>${txt(200,62,W,'WHOLE')}</g>`;
  pos.forEach((p,i)=>{
    const c=i?BC:AC,n=v[i]==null?'?':v[i],ring=S.mode!=='missing'&&S.active===i;
    h+=`<g data-slot="${i}" tabindex="0" role="button" aria-label="Part ${i+1}: ${n}">${ring?`<circle cx="${p[0]}" cy="${p[1]}" r="60" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="7 6"/>`:''}<circle cx="${p[0]}" cy="${p[1]}" r="52" fill="${c}"/>${txt(p[0],p[1],n,'PART '+(i+1))}</g>`;
  });
  return h;
}
function prompt(v){
  const W=S.W,m=S.mode;
  if(m==='explore')return `<span><b>Discovery:</b> pick both parts. Do they make ${W}? Tap a part, then a number — or drag across the whole's counters.</span>`;

  if(m==='missing'){const q=S.q,x=S.solved?q.ans:'?';return `<span class="big">${q.miss===0?x+' + '+q.known:q.known+' + '+x} = ${W}</span>`}
  return `<span class="big">Make ${W}: ${v[0]??'?'} + ${v[1]??'?'} = ${W}</span>`;
}
function eqs(v){
  const W=S.W,a=v[0],b=v[1];
  if(a==null||b==null||(S.mode==='missing'&&!S.solved))return '<p class="hint">➕ ➖ Addition and subtraction facts appear when the bond is complete.</p>';
  const s=a+b;
  if(s!==W)return `<div class="eqc"><h3>Addition</h3><p>${a} + ${b} = ${s}</p><p class="warn">${s} is not ${W} yet</p></div>`;
  const sub=a===b?`<p>${W} − ${a} = ${b}</p>`:`<p>${W} − ${a} = ${b}</p><p>${W} − ${b} = ${a}</p>`;
  return `<div class="eqc"><h3>Addition</h3><p>${a} + ${b} = ${W}</p>${a===b?'':`<p>${b} + ${a} = ${W}</p>`}</div><div class="eqc"><h3>Subtraction</h3>${sub}</div>`;
}
function bonds(){
  const W=S.W,v=S.p;let h=`<h3>All bonds for ${W} <small>— ${foundN()} of ${Math.floor(W/2)+1} discovered. Tap one to load it!</small></h3><div class="grid">`;
  for(let a=0;a<=Math.floor(W/2);a++){
    const f=S.found[W+':'+a],cur=S.mode==='explore'&&v[0]+v[1]===W&&Math.min(v[0],v[1])===a;
    h+=`<button class="bc${f?' f':''}${cur?' cur':''}" data-a="${a}"><span style="color:${AC}">${a}</span> + <span style="color:${BC}">${W-a}</span> = ${W}${f?' ⭐':''}</button>`;
  }
  return h+'</div>';
}
function updatePicker(v){
  const m=S.mode,pt=$('#pt');if(!pt)return;
  pt.innerHTML=m==='missing'?'Pick the missing number':`Set <b class="${S.active?'cb':'ca'}">Part ${S.active+1}</b> <span style="font-weight:600">(tap a circle to switch part)</span>`;
  document.querySelectorAll('#picker .t').forEach(t=>{t.classList.toggle('on',m!=='missing'&&v[S.active]===+t.dataset.v);t.disabled=m==='missing'&&S.solved});
  const sr=$('#sr');
  if(sr){const x=m==='missing'?S.pv:(v[S.active]??0);sr.value=x;$('#so').textContent=x;sr.disabled=m==='missing'&&S.solved;$('#chk').hidden=m!=='missing';$('#chk').disabled=S.solved}
}
function render(){
  const v=vals(),W=S.W,m=S.mode;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.classList.toggle('on',b.dataset.mode===m)));
  document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.lo));
  document.querySelectorAll('#wstrip .wt').forEach(b=>b.classList.toggle('on',+b.dataset.w===W));
  if(lastW!==W||lastLo!==S.lo){const e=$('#wstrip .on'),st=$('#wstrip');if(e)st.scrollLeft=e.offsetLeft-st.clientWidth/2+e.offsetWidth/2;lastW=W;lastLo=S.lo}
  $('#prompt').innerHTML=prompt(v);
  const d=$('#dia');d.classList.remove('pop');d.innerHTML=svg(v);
  const ms=$('#msg');ms.classList.remove('ok');
  ms.innerHTML='<span>'+S.msg+'</span>'+((m==='explore'?S.done:S.solved)?'<button class="nx" data-act="next">Next ➜</button>':'');
  if(S.pop!==lastPop){lastPop=S.pop;d.classList.add('pop');ms.classList.add('ok')}
  $('#counters').innerHTML=counters(v);
  $('#eqs').innerHTML=eqs(v);
  const fd=$('#found');fd.hidden=m!=='explore';
  if(!fd.hidden){const ks=Object.keys(S.found).filter(k=>k.startsWith(W+':')).map(k=>+k.split(':')[1]).sort((x,y)=>x-y);
    fd.innerHTML=`<h3>⭐ Discovered bonds (${ks.length} of ${Math.floor(W/2)+1})</h3>`+(ks.length?'<div class="chipsrow">'+ks.map(a=>`<span class="fc">${a} + ${W-a} = ${W}</span>`).join('')+'</div>':`<p style="margin:0">None yet — pick two parts that make ${W}!</p>`)}
  $('#bbtn').textContent=S.show?'🙈 Hide Bonds':'📋 Show All Bonds';
  $('#bonds').hidden=!S.show;if(S.show)$('#bonds').innerHTML=bonds();
  updatePicker(v);
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-mode],[data-r],[data-w],[data-slot],[data-v],[data-d],[data-a],[data-act]');if(!t||t.disabled)return;const d=t.dataset;
  if(d.mode){S.mode=d.mode;reset(false)}
  else if(d.r)setRange(+d.r,+d.h);
  else if(d.w)setWhole(+d.w);
  else if(d.slot!=null){if(S.mode!=='missing'){S.active=+d.slot;render()}}
  else if(d.v!=null){const n=+d.v;S.mode==='missing'?answer(n):setPart(S.active,n)}
  else if(d.d){const r=$('#sr');r.value=cl(+r.value+ +d.d,S.W);r.dispatchEvent(new Event('input',{bubbles:true}))}
  else if(d.a!=null)loadBond(+d.a);
  else if(d.act)act(d.act);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='sr')return;const n=+e.target.value;
  if(S.mode==='missing'){S.pv=n;$('#so').textContent=n}else setPart(S.active,n);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-slot]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
/* drag across the whole's counters to split it into two parts */
const cnt=$('#counters');let drag=false;
function splitAt(e,first){
  if(S.mode!=='explore')return;
  const el=document.elementFromPoint(e.clientX,e.clientY),i=el&&el.dataset?el.dataset.i:null;if(i==null)return;
  let k=+i+1;if(first&&k===S.p[0])k--;
  if(k>S.W)return;setPart(0,k);
}
cnt.addEventListener('pointerdown',e=>{if(e.target.dataset.i==null)return;drag=true;try{cnt.setPointerCapture(e.pointerId)}catch(x){}splitAt(e,true)});
cnt.addEventListener('pointermove',e=>{if(drag)splitAt(e,false)});
['pointerup','pointercancel'].forEach(n=>cnt.addEventListener(n,()=>{drag=false}));
const fs=$('#fs'),de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;
const IC={on:'<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',off:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'};
const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsIcon(){const f=!!isFs();fs.innerHTML=f?IC.on:IC.off;fs.title=fs.ariaLabel=f?'Exit full screen':'Full screen'}
if(!req)fs.hidden=true;else{fsIcon();fs.onclick=()=>{if(isFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else req.call(de)};
  ['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,fsIcon))}
buildWhole();reset(false);
})();
