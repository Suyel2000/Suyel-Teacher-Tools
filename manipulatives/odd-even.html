<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd & Even Numbers Lab</title>
<style>
:root{--bg:#fff8e7;--ink:#2b2350;--card:#fff;--odd:#f97316;--even:#16a34a;--pur:#8b5cf6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--ink:#fff4d6;--card:#2c2552}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-weight:700;touch-action:manipulation;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 10px}
h1{margin:0 6px 0 0;font-size:clamp(16px,2.6vw,26px)}
button{font:inherit;border:0;cursor:pointer;color:#fff;border-radius:999px;padding:6px 16px;font-size:clamp(14px,2vw,20px);box-shadow:0 4px 0 rgba(0,0,0,.22);min-height:44px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.nav button.on{outline:4px solid var(--ink)}
.b1{background:#3b82f6}.b2{background:#8b5cf6}.b3{background:#ec4899}.b4{background:#f59e0b}.b5{background:#64748b}
#fs{padding:0;width:44px;background:#0ea5e9;display:grid;place-items:center}
#fs svg{width:22px;height:22px}
#app{flex:1;min-height:0;width:100%;padding:0 10px 4px}
.panel{height:100%;display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 5px 0 rgba(0,0,0,.12);min-height:0}
.groups,.nums{display:flex;gap:6px;justify-content:center}
.groups{flex-wrap:wrap}.groups button{flex:1;max-width:110px;min-width:0;min-height:34px;padding:2px 4px;font-size:clamp(11px,1.6vw,17px)}
.groups button.on,.nums button.sel{outline:4px solid var(--ink)}
.nums button{flex:1;max-width:80px;padding:0;min-height:clamp(38px,6vh,52px);font-size:clamp(18px,3vw,26px)}
.info{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.big{font-size:clamp(40px,9vh,76px);line-height:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(13px,2vw,20px)}
.stats span{background:rgba(139,92,246,.15);border-radius:999px;padding:3px 12px}
.space{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:8px;border-radius:18px;background:rgba(139,92,246,.08);overflow:hidden}
.pair{display:flex;gap:2px;padding:4px 7px;border-radius:999px;border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
svg.c{width:var(--s,48px);height:var(--s,48px);display:block}
.pair.pop,.left{animation:pop .45s both}
@keyframes pop{from{transform:translateY(-24px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.left{padding:4px 8px;border-radius:999px;border:3px solid var(--odd);background:rgba(249,115,22,.2);margin-left:10px;animation:pop .45s both,glow 1.2s .5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px 5px rgba(249,115,22,.7)}}
.msg{text-align:center;font-size:clamp(15px,2.6vh + .8vw,26px);min-height:1.3em}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ans button{min-width:140px;font-size:clamp(18px,3vh + 1vw,28px);padding:6px 28px}
.tray{display:flex;gap:8px;justify-content:center;align-items:center;padding:6px;border-radius:16px;background:rgba(59,130,246,.12)}
.tray svg{width:48px;height:48px;cursor:grab;touch-action:none}.tray button{min-width:64px;font-size:clamp(18px,3vh + 1vw,26px)}
.boxes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:20px;border:4px dashed;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center;overflow:hidden}
.box h2{width:100%;text-align:center;margin:0;font-size:clamp(20px,4vh,34px)}
.box.odd{border-color:var(--odd);background:rgba(249,115,22,.12)}.box.even{border-color:var(--even);background:rgba(22,163,74,.12)}
.card{width:clamp(48px,9vh,66px);height:clamp(48px,9vh,66px);border-radius:16px;color:#fff;font-size:clamp(22px,4.5vh,32px);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);opacity:.9}
.rule{display:flex;gap:10px;justify-content:center;font-size:clamp(11px,1.6vw,16px);padding:4px 10px}
.rule span{border-radius:999px;padding:2px 12px;color:#fff}
.conf{position:fixed;font-size:28px;pointer-events:none;z-index:60;animation:fly 1.2s forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="nav">
<h1>🔢 Odd &amp; Even Lab</h1>
<button class="b1" data-m="choose">🔢 Choose Number</button>
<button class="b2" data-m="build">🧱 Build</button>
<button class="b3" data-m="challenge">🎮 Challenge</button>
<button class="b4" data-m="sort">↔ Sort</button>
<button class="b5" id="reset">↺ Reset</button>
<button id="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</header>
<div id="app"></div>
<div class="rule"><span style="background:var(--even)">Even: all counters have a partner</span><span style="background:var(--odd)">Odd: 1 counter is left over</span></div>
<script>
(function(){
var COL=['#22c55e','#3b82f6','#f97316','#a855f7','#ec4899','#eab308','#14b8a6','#ef4444','#6366f1','#84cc16'];
var app=document.getElementById('app'),N=8,grp=0,target=0,built=0,chN=0,chPrev=0,chDone=false,score=0,sortSet=[],refit=null,solved=false;
function $(s){return document.querySelector(s)}
function ctr(c){return '<svg class="c" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="'+c+'" stroke="rgba(0,0,0,.2)" stroke-width="3"/><ellipse cx="21" cy="19" rx="9" ry="6" fill="rgba(255,255,255,.55)" transform="rotate(-30 21 19)"/></svg>'}
function star(){return '<svg class="c" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4l8 17 19 2-14 13 4 18-17-9-17 9 4-18L3 23l19-2z" fill="#facc15" stroke="#f97316" stroke-width="3" stroke-linejoin="round"/></svg>'}
function pairsHTML(n,anim){var p=Math.floor(n/2),h='',i;for(i=0;i<p;i++){var c=COL[i%COL.length];h+='<div class="pair'+(anim?' pop':'')+'" style="--c:'+c+';animation-delay:'+(anim?Math.min(i*60,900):0)+'ms">'+ctr(c)+ctr(c)+'</div>'}
if(n%2)h+='<div class="left">'+star()+'</div>';return h}
function singles(n){var h='',i;for(i=0;i<n;i++)h+=ctr(COL[i%COL.length]);return h}
/* pick the biggest counter size that fits everything without scrolling */
function fit(sp,n,paired){
 function go(){var W=sp.clientWidth-16,H=sp.clientHeight-16,s,u=paired?Math.floor(n/2)+(n%2?1:0):n;if(!u||W<=0)return;
  for(s=70;s>=16;s-=2){var uw=paired?2*s+26:s+8,uh=s+(paired?18:8),cols=Math.max(1,Math.floor((W+8)/(uw+8))),rows=Math.ceil(u/cols);if(rows*(uh+8)-8<=H)break}
  sp.style.setProperty('--s',s+'px')}
 refit=go;go()}
addEventListener('resize',function(){if(refit)refit()});
function conf(){var e=['🎉','⭐','✨','🟢','🔵','🟠','🟣'],i;for(i=0;i<14;i++){var s=document.createElement('span');s.className='conf';s.textContent=e[i%e.length];s.style.left=(40+Math.random()*20)+'vw';s.style.top='40vh';s.style.setProperty('--x',(Math.random()*500-250)+'px');s.style.setProperty('--y',(Math.random()*400-150)+'px');document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),1300)}}
function rnd(a,b,not){var r;do{r=a+Math.floor(Math.random()*(b-a+1))}while(r===not);return r}
function stats(n){return '<span>'+n+' counters</span><span>'+Math.floor(n/2)+' pairs</span><span>'+(n%2)+' left over</span>'}
var ANS='<div class="msg" id="fb"></div><div class="row ans"><button style="background:var(--even)" id="ev">🟢 EVEN</button><button style="background:var(--odd)" id="od">🟠 ODD</button></div>';
function wire(getN,ready,after){
 function pick(odd){if(!ready())return;var n=getN(),ok=(n%2===1)===odd;after(ok,n)}
 $('#ev').onclick=function(){pick(false)};$('#od').onclick=function(){pick(true)}}
function explain(n){return n+' is '+(n%2?'odd':'even')+' because '+(n%2?'1 counter is left over':'every counter has a partner')+'.'}

function drag(el,ghostHTML,onDrop){
 el.addEventListener('pointerdown',function(ev){
  ev.preventDefault();var g=document.createElement('div');g.className='ghost';g.innerHTML=ghostHTML;document.body.appendChild(g);
  function mv(e){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}mv(ev);
  function up(e){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();onDrop(document.elementFromPoint(e.clientX,e.clientY))}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}

/* CHOOSE */
function choose(){
 app.innerHTML='<div class="panel"><div class="groups" id="gr"></div><div class="nums" id="nums"></div><div class="info"><div class="big">'+N+'</div><div class="stats">'+stats(N)+'</div></div><div class="space" id="sp">'+pairsHTML(N,true)+'</div>'+ANS+'</div>';
 var gr=$('#gr'),nb=$('#nums'),i;
 for(i=0;i<10;i++){var g=document.createElement('button');g.textContent=(i*10+1)+'–'+(i*10+10);g.className='b'+(i%4+1)+(i===grp?' on':'');g.onclick=(function(k){return function(){grp=k;if(Math.floor((N-1)/10)!==k)N=k*10+1;choose()}})(i);gr.appendChild(g)}
 for(i=1;i<=10;i++){var v=grp*10+i,b=document.createElement('button');b.textContent=v;b.style.background=COL[(v-1)%COL.length];if(v===N)b.className='sel';b.onclick=(function(x){return function(){N=x;choose()}})(v);nb.appendChild(b)}
 fit($('#sp'),N,true);
 wire(function(){return N},function(){return true},function(ok,n){
  if(ok){$('#fb').textContent='🎉 Correct! '+explain(n);conf()}else $('#fb').textContent='💡 Look at the pairs. Is anything left over?'});
}

/* BUILD */
function build(){
 if(!target){target=rnd(1,50,0);built=0}
 app.innerHTML='<div class="panel"><div class="info"><div class="big">Build '+target+'</div><div class="stats" id="bst"></div></div><div class="space" id="ws"></div><div class="tray" id="tray"></div>'+ANS+'<div class="row"><button class="b2" id="nt">New target</button><button class="b5" id="clr">Clear</button></div></div>';
 var tray=$('#tray'),i;
 (function(c){var d=document.createElement('div');d.innerHTML=ctr(c);var s=d.firstChild;drag(s,ctr(c).replace('class="c"','class="c" style="width:56px;height:56px"'),function(t){if(t&&t.closest&&t.closest('#ws'))add(1)});tray.appendChild(s)})(COL[1]);
 [1,2,5,10].forEach(function(k,j){var p=document.createElement('button');p.className='b'+(j+1);p.textContent='+'+k;p.onclick=function(){add(k)};tray.appendChild(p)});
 $('#nt').onclick=function(){target=rnd(1,50,target);built=0;build()};$('#clr').onclick=function(){built=0;upd()};
 function add(k){built=Math.min(60,built+k);upd()}
 wire(function(){return target},function(){if(built!==target){$('#fb').textContent=built<target?'Build '+target+' counters first!':'Too many counters. Tap some to remove.';return false}return true},function(ok,n){
  if(ok){$('#fb').textContent='🎉 Correct! '+explain(n);conf()}else $('#fb').textContent='💡 Look at the pairs. Is anything left over?'});
 upd();
}
function upd(){
 var ws=$('#ws');ws.innerHTML=pairsHTML(built,false);fit(ws,built,true);
 ws.querySelectorAll('svg').forEach(function(s){s.style.cursor='pointer';s.onclick=function(){built=Math.max(0,built-1);upd()}});
 $('#bst').innerHTML=stats(built);
 $('#fb').textContent=built===target?'Is '+target+' odd or even?':(built>target?'Too many! Tap a counter to remove it.':(target-built)+' more to go');
}

/* CHALLENGE */
function challenge(){
 if(!chN){chN=rnd(1,50,chPrev);chDone=false}
 app.innerHTML='<div class="panel"><div class="info"><div class="big">Is '+chN+' odd or even?</div><div class="stats"><span>⭐ '+score+'</span></div></div><div class="space" id="sp">'+singles(chN)+'</div>'+ANS+'<div class="row"><button class="b2" id="nx" style="visibility:hidden">Next ▶</button></div></div>';
 fit($('#sp'),chN,false);
 wire(function(){return chN},function(){return !chDone},function(ok,n){
  chDone=true;var sp=$('#sp');sp.innerHTML=pairsHTML(n,true);fit(sp,n,true);
  $('#fb').textContent=ok?'🎉 Correct! '+explain(n):'💡 Try pairing the counters! '+explain(n);
  if(ok){score++;conf()}$('#nx').style.visibility='visible'});
 $('#nx').onclick=function(){chPrev=chN;chN=0;challenge()};
}

/* SORT */
function newSort(){var s=[],a,b;while(s.length<6){var r=rnd(1,50);if(s.indexOf(r)<0)s.push(r)}
 a=s.filter(function(x){return x%2}).length;return(a<2||a>4)?newSort():s}
function sort(){
 if(!sortSet.length)sortSet=newSort();
 app.innerHTML='<div class="panel"><div class="msg">Drag each number to its box</div><div class="row" id="cards"></div><div class="boxes"><div class="box odd" id="bo"><h2>🟠 ODD</h2></div><div class="box even" id="be"><h2>🟢 EVEN</h2></div></div><div class="msg" id="sf"></div><div class="row"><button class="b2" id="ns">New numbers</button></div></div>';
 var cards=$('#cards'),left=sortSet.length;
 sortSet.forEach(function(n,i){var col=COL[i%COL.length],c=document.createElement('div');c.className='card';c.textContent=n;c.style.background=col;cards.appendChild(c);
  drag(c,'<div class="card" style="background:'+col+'">'+n+'</div>',function(t){var b=t&&t.closest&&t.closest('.box');if(!b)return;
   if((b.id==='bo')===(n%2===1)){c.style.background=n%2?'#f97316':'#16a34a';c.style.pointerEvents='none';b.appendChild(c);left--;$('#sf').textContent='✅ '+n+' goes there!';if(!left){$('#sf').textContent='🎉 All sorted!';conf()}}
   else{c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#sf').textContent='💡 Try making pairs of '+n+' counters!'}})});
 $('#ns').onclick=function(){sortSet=newSort();sort()};
}

function show(m){refit=null;document.querySelectorAll('.nav [data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});({choose:choose,build:build,challenge:challenge,sort:sort})[m]()}
document.querySelectorAll('.nav [data-m]').forEach(function(b){b.onclick=function(){show(b.dataset.m)}});
$('#reset').onclick=function(){N=8;grp=0;target=0;built=0;chN=0;chPrev=0;score=0;sortSet=[];show('choose')};
/* fullscreen */
var fs=$('#fs'),de=document.documentElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen))fs.style.display='none';
fs.onclick=function(){var on=document.fullscreenElement||document.webkitFullscreenElement;
 try{if(on){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}}catch(e){}};
document.addEventListener('fullscreenchange',function(){if(refit)setTimeout(refit,100)});
var first=true;
addEventListener('pointerdown',function(){if(!first)return;first=false;if(!(document.fullscreenElement||document.webkitFullscreenElement)){try{var r=(de.requestFullscreen||de.webkitRequestFullscreen);if(r){var q=r.call(de);if(q&&q.catch)q.catch(function(){})}}catch(e){}}});
show('choose');
})();
</script>
</body>
</html>
