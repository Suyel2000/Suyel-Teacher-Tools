<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subtraction with Regrouping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --bg:#f3f8fe; --card:#ffffff; --ink:#1c2a3a; --muted:#66778b; --line:#dfe8f3;
  --blue:#2f80e0; --blueSoft:#e8f2fd; --orange:#e8920a; --orangeSoft:#fff3dc;
  --green:#1fa762; --greenSoft:#e3f6ec; --tray:#f1faf5; --act:#fff3b8; --coach:#e8f2fd;
  --dgA:#2f80e0; --dgB:#e8920a; --soft:#f0f5fb; --btnInk:#33415c;
  --u:9px; --fpr:4; --fH:1fr; --fT:1fr; --fO:1fr;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --card:#17212e; --ink:#e8eef6; --muted:#98a8ba; --line:#2a3849;
    --blueSoft:#15304f; --orangeSoft:#3a2b10; --greenSoft:#123423; --tray:#15302a; --act:#4d4210; --coach:#173049;
    --dgA:#6db2ff; --dgB:#ffb33d; --soft:#1f2c3c; --blue:#3a8cea; --orange:#e8920a; --green:#22a867;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --card:#17212e; --ink:#e8eef6; --muted:#98a8ba; --line:#2a3849;
  --blueSoft:#15304f; --orangeSoft:#3a2b10; --greenSoft:#123423; --tray:#15302a; --act:#4d4210; --coach:#173049;
  --dgA:#6db2ff; --dgB:#ffb33d; --soft:#1f2c3c; --blue:#3a8cea; --orange:#e8920a; --green:#22a867;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
.app{max-width:1200px;margin:0 auto;padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,3.4vw,30px);font-weight:900;letter-spacing:-.01em;line-height:1.1}
.sub-t{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.levels{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 13px;min-height:38px;font:800 14px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.lvlinfo{font-size:13px;color:var(--muted);font-weight:700}
.lvlinfo b{color:var(--ink)}

/* stepper */
.stepper{display:flex;gap:16px;list-style:none;margin:0;padding:0}
.stepper li{position:relative;flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border:2px solid var(--line);border-radius:14px;font-weight:800;font-size:14px;color:var(--muted);min-width:0}
.stepper li:not(:last-child)::after{content:"\2192";position:absolute;right:-15px;top:50%;transform:translateY(-52%);color:var(--muted);font-weight:900}
.stepper .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.stepper li.cur{border-color:var(--blue);background:var(--blueSoft);color:var(--ink)}
.stepper li.cur .num{background:var(--blue);color:#fff}
.stepper li.done{color:var(--ink)}
.stepper li.done .num{background:var(--green);color:#fff}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 38px 310px;align-items:stretch}
.left{display:flex;flex-direction:column;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px}
.card h2{margin:0 0 6px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:700;color:var(--muted);font-size:13px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.bridge{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:900;font-size:13px;gap:6px}
.bridge.down{height:30px}
.bridge.side .v{display:none}
.bridge.side .h{font-size:26px}

.pv{display:grid;grid-template-columns:44px minmax(0,var(--fH)) minmax(0,var(--fT)) minmax(0,var(--fO));gap:6px;margin-bottom:6px}
.pv:last-child{margin-bottom:0}
.ch{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:3px 0;border-radius:8px}
.tag{align-self:center;justify-self:center;font-weight:900;font-size:14px;padding:4px 8px;border-radius:999px;min-width:36px;text-align:center}
.tag.a{background:var(--blue);color:#fff}.tag.b{background:var(--orange);color:#fff}.tag.t{background:var(--btnInk);color:#fff;font-size:12px}
.cell{border-radius:14px;padding:6px 4px;min-height:calc(var(--u)*10.2 + 14px);display:flex;justify-content:center;align-items:flex-start;position:relative}
.cell.A{background:var(--blueSoft)}.cell.B{background:var(--orangeSoft)}.cell.T{background:var(--tray);border:2px dashed var(--green)}
.in{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;margin:0 auto;width:100%}
.c0 .in{max-width:calc(5*(var(--u)*1.2 + 3px))}
.c1 .in{max-width:calc(10*(var(--u)*1.2 + 3px))}
.c2 .in{max-width:calc(var(--fpr)*(var(--u)*10.2 + 3px))}
.labw{display:flex;justify-content:center;align-items:center;min-height:30px;border-radius:10px}
.lab{display:none;background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;text-align:center}
.lab.on{display:inline-block}

/* blocks */
.blk{display:block;flex:none;overflow:visible;filter:drop-shadow(0 1.5px 1px rgba(15,35,65,.3));transform-origin:center}
.blk.cube{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)}
.blk.rod{width:calc(var(--u)*1.2);height:calc(var(--u)*10.2)}
.blk.flat{width:calc(var(--u)*10.2);height:calc(var(--u)*10.2)}
.moved{opacity:.16;filter:grayscale(.7);transition:opacity .4s}
.fly{position:fixed;z-index:60;margin:0;pointer-events:none}
.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms)}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.glow{animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 #22d27e) brightness(1)}to{filter:drop-shadow(0 0 6px #22d27e) drop-shadow(0 0 2px #22d27e) brightness(1.18)}}
.spot{position:fixed;z-index:55;border-radius:18px;background:var(--card);border:3px dashed var(--green);box-shadow:0 10px 28px rgba(0,0,0,.2);opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s;pointer-events:none}
.spot.in{opacity:1;transform:scale(1)}
.bubble{position:fixed;z-index:70;transform:translateX(-50%) scale(.8);background:var(--green);color:#fff;font-weight:900;padding:8px 16px;border-radius:999px;font-size:18px;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bubble.in{opacity:1;transform:translateX(-50%) scale(1)}
.conf{position:fixed;width:9px;height:9px;border-radius:2px;z-index:80;pointer-events:none}

/* column focus */
.active.ch,.active.labw{background:var(--act);color:var(--ink)}
.active.cell{outline:3px solid #ffd54a;outline-offset:-3px}
.active.acol{background:var(--act)}
.hl{animation:hl .55s ease-in-out 4}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 rgba(255,170,0,0)}50%{box-shadow:0 0 0 6px rgba(255,170,0,.65)}}

/* abstract */
.abstract{display:flex;flex-direction:column}
.alg{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:4px}
.acol{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding:2px}
.ach{height:24px;font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center}
.car{height:32px;display:flex;align-items:flex-end;justify-content:center}
.car span{background:var(--green);color:#fff;font-weight:900;width:28px;height:28px;border-radius:50%;font-size:17px;display:grid;place-items:center}
.dg{height:56px;width:100%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
.dg.a{color:var(--dgA)}
.dg.b{color:var(--dgB);border-bottom:4px solid var(--ink);padding-bottom:3px;height:60px}
.dg.ans{height:70px;padding-top:6px}
.acol.sign .dg.b{color:var(--ink);font-size:36px}
.dg input{width:100%;max-width:64px;height:58px;text-align:center;font:900 38px var(--font);color:var(--ink);background:var(--soft);border:3px dashed var(--muted);border-radius:14px;outline:none;padding:0}
.dg input:focus{border-style:solid;border-color:var(--blue)}
.dg input:disabled{opacity:.55}
.dg input.right{border:3px solid var(--green);background:var(--greenSoft);color:var(--green);opacity:1}
.dg input.bad{border-color:#e5484d;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.notes{margin-top:10px;border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;flex:1}
.notes p{margin:0;padding:6px 10px;background:var(--soft);border-radius:10px}
.notes p.last{background:var(--greenSoft);color:var(--ink)}
.notes p.ph{background:none;color:var(--muted);padding-left:0}

/* dock */
.dock{position:sticky;bottom:0;z-index:40;background:var(--bg);padding:8px 0 12px;display:flex;flex-direction:column;gap:8px}
.coach{display:flex;gap:12px;align-items:center;background:var(--coach);border-radius:16px;padding:10px 14px;min-height:60px;font-size:16px;line-height:1.3}
.coach.good{background:var(--greenSoft)}.coach.hint{background:var(--orangeSoft)}
.coach .ico{font-size:26px}
.coach .sub{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{appearance:none;border:0;border-radius:16px;min-height:54px;padding:0 22px;font:900 17px var(--font);cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.main{background:var(--blue);min-width:130px}
.btn.reg{background:var(--green)}
.btn.chk{background:var(--btnInk)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.dim{opacity:.6}
.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 0 rgba(255,190,40,.0)}50%{box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 7px rgba(255,190,40,.7)}}
button:focus-visible,input:focus-visible{outline:3px solid #ffb800;outline-offset:2px}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)}
  .bridge.side{height:30px}
  .bridge.side .h{display:none}.bridge.side .v{display:inline}
  .levels{align-items:flex-start}.chips{justify-content:flex-start}
  .stepper{gap:8px}
  .stepper li:not(.cur) .lbl{display:none}
  .stepper li:not(:last-child)::after{right:-12px}
  .btn{flex:1 1 130px;padding:0 12px}
}
@media (prefers-reduced-motion:reduce){.nudge,.hl,.glow{animation:none}}
.plus{position:absolute;top:3px;right:3px;z-index:2;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--green);color:#fff;font:900 16px/1 var(--font);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.22)}
.fsb{width:38px;min-height:38px;padding:0;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:800 18px var(--font);cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.kp[hidden]{display:none}
.kp button{min-height:40px;padding:0;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:900 18px var(--font);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.kp button:active{transform:translateY(2px);box-shadow:none}
.tapc{cursor:pointer;outline:3px dashed var(--blue);outline-offset:-3px;animation:tp 1s ease-in-out infinite alternate}
@keyframes tp{to{background-color:var(--act)}}
.sel{filter:drop-shadow(0 0 5px #ffb800) brightness(1.25)!important;transform:translateY(-5px)}
@media (prefers-reduced-motion:reduce){.tapc{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Subtraction with Regrouping</h1>
      <p class="sub-t">Build it • Regroup it • Take away</p>
    </div>
    <div class="levels">
      <div class="chips" role="group" aria-label="Level">
        <button class="chip" data-l="1" aria-pressed="true">Level 1</button>
        <button class="chip" data-l="2" aria-pressed="false">Level 2</button>
        <button class="chip" data-l="3" aria-pressed="false">Level 3</button>
        <button class="chip" data-l="4" aria-pressed="false">Level 4</button>
        <button class="chip" data-l="5" aria-pressed="false">Challenge</button>
      </div>
      <div class="chips" role="group" aria-label="Mode"><button class="chip" id="mHands" aria-pressed="true">✋ I do it</button><button class="chip" id="mWatch" aria-pressed="false">👀 Watch</button><button class="fsb" id="fs" aria-label="Full screen" title="Full screen">⛶</button></div>
      <div class="lvlinfo"><span id="lvlName"></span> &nbsp;•&nbsp; Solved: <b id="solved">0</b></div>
    </div>
  </header>
  <ol class="stepper" aria-label="Steps">
    <li><span class="num">1</span><span class="lbl">Build</span></li>
    <li><span class="num">2</span><span class="lbl">Ones</span></li>
    <li><span class="num">3</span><span class="lbl">Tens</span></li>
    <li><span class="num">4</span><span class="lbl">Hundreds</span></li>
    <li><span class="num">5</span><span class="lbl">Write answer</span></li>
  </ol>
  <main class="work">
    <div class="left">
      <section class="card" id="concrete"><h2><span class="dot" style="background:var(--blue)"></span>Concrete <small>Start with the big number</small></h2></section>
      <div class="bridge down"><span>↓</span> Take blocks away</div>
      <section class="card" id="regroup"><h2><span class="dot" style="background:var(--green)"></span>Take-away tray <small>Blocks you subtract go here</small></h2></section>
    </div>
    <div class="bridge side"><span class="h">→</span><span class="v">↓ Write it down</span></div>
    <section class="card abstract" id="abstract">
      <h2><span class="dot" style="background:var(--orange)"></span>Abstract <small>Written subtraction</small></h2>
      <div class="alg" id="alg"></div>
      <div class="kp" id="kp" hidden aria-label="Number keys"></div>
      <div class="notes" id="notes"></div>
    </section>
  </main>
  <div class="dock">
    <div class="coach" id="coach" role="status" aria-live="polite"></div>
    <div class="controls">
      <button class="btn main" id="bMain">Start</button>
      <button class="btn chk" id="bChk">Check Answer</button>
      <button class="btn ghost" id="bNew">New Problem</button>
      <button class="btn ghost" id="bReset">Reset</button>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SP=matchMedia('(prefers-reduced-motion: reduce)').matches?.35:1;
const wait=ms=>new Promise(r=>setTimeout(r,ms*SP));
const TYPES=['cube','rod','flat'], NAMES=['ones','tens','hundreds'], SING=['one','ten','hundred','thousand'], CN=['Ones','Tens','Hundreds'];
const COL={
  blue:{f:'#3b8fe6',t:'#9bcbfb',s:'#2466b5',k:'#1b4f8f'},
  orange:{f:'#f7a823',t:'#ffd37c',s:'#c97b05',k:'#a96100'},
  green:{f:'#2fbf78',t:'#8ce3b2',s:'#1b8a55',k:'#146b42'}
};
const VB={cube:'0 0 12 12',rod:'0 0 12 102',flat:'0 0 102 102'};

/* ---------- SVG Base-10 blocks ---------- */
function art(type,c){
  const C=COL[c], st=`stroke="${C.k}" stroke-width=".45" stroke-linejoin="round"`;
  if(type==='cube') return `<polygon points="10,2 12,0 12,10 10,12" fill="${C.s}" ${st}/><polygon points="0,2 2,0 12,0 10,2" fill="${C.t}" ${st}/><rect x="0" y="2" width="10" height="10" rx="1.2" fill="${C.f}" ${st}/><rect x="1.4" y="3.4" width="3.6" height="1.4" rx=".7" fill="#fff" opacity=".42"/>`;
  if(type==='rod'){
    let g='',h='';
    for(let k=1;k<10;k++) g+=`M0 ${2+10*k}H10`;
    for(let k=0;k<10;k++) h+=`<rect x="1.4" y="${3.4+10*k}" width="3.6" height="1.4" rx=".7" fill="#fff" opacity=".4"/>`;
    return `<polygon points="10,2 12,0 12,100 10,102" fill="${C.s}" ${st}/><polygon points="0,2 2,0 12,0 10,2" fill="${C.t}" ${st}/><rect x="0" y="2" width="10" height="100" rx="1.2" fill="${C.f}" ${st}/><path d="${g}" stroke="${C.k}" stroke-opacity=".6" stroke-width=".5" fill="none"/>${h}`;
  }
  let g='';
  for(let k=1;k<10;k++) g+=`M${10*k} 2V102M0 ${2+10*k}H100`;
  return `<polygon points="100,2 102,0 102,100 100,102" fill="${C.s}" ${st}/><polygon points="0,2 2,0 102,0 100,2" fill="${C.t}" ${st}/><rect x="0" y="2" width="100" height="100" rx="1.6" fill="${C.f}" ${st}/><path d="${g}" stroke="${C.k}" stroke-opacity=".45" stroke-width=".5" fill="none"/><rect x="3" y="5" width="22" height="3" rx="1.5" fill="#fff" opacity=".3"/>`;
}
function mk(type,c,cls=''){
  const t=document.createElement('template');
  t.innerHTML=`<svg class="blk ${type} ${cls}" viewBox="${VB[type]}" aria-hidden="true">${art(type,c)}</svg>`;
  const e=t.content.firstElementChild; e.dataset.c=c; return e;
}


const S={a:75,b:38,total:37,level:1,p:0,done:new Set(),seen:new Set(),solved:0,busy:false,hands:true,int:false,tok:0,phases:[],isSolved:false,u:9};
const digs=n=>[n%10,Math.floor(n/10)%10,Math.floor(n/100)];
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
function calc(a,b){const x=digs(a),y=digs(b),d=[...x],bw=[0,0,0];let ok=a>b;
  for(let c=0;c<2&&ok;c++)if(d[c]<y[c]){if(d[c+1]<1){ok=false;break;}bw[c]=1;d[c]+=10;d[c+1]--;}
  return{bw,ok,R:[0,1,2].map(c=>d[c]-y[c])};}
let A,B,BW,R,cur;
function compute(){A=digs(S.a);B=digs(S.b);const r=calc(S.a,S.b);BW=r.bw;R=r.R;S.total=S.a-S.b;
  S.phases=['build'];[0,1,2].forEach(c=>{if(BW[c])S.phases.push('reg'+c);if(B[c])S.phases.push('take'+c);});S.phases.push('write');}
const LV={
  1:{name:'2-digit − 2-digit, regroup a ten',l1:20,h1:99,l2:10,h2:98,ok:r=>r.bw[0]},
  2:{name:'3-digit − 2-digit',l1:100,h1:399,l2:10,h2:99,ok:r=>r.bw[0]||r.bw[1]},
  3:{name:'3-digit − 3-digit, regroup ones',l1:200,h1:999,l2:100,h2:899,ok:r=>r.bw[0]&&!r.bw[1]},
  4:{name:'3-digit − 3-digit, regroup tens',l1:200,h1:999,l2:100,h2:899,ok:r=>r.bw[1]&&!r.bw[0]},
  5:{name:'Challenge: regroup twice',l1:200,h1:999,l2:100,h2:899,ok:r=>r.bw[0]&&r.bw[1]}
};
function newProblem(){const L=LV[S.level];let a,b,t=0;
  for(;;){a=rnd(L.l1,L.h1);b=rnd(L.l2,L.h2);if(++t>1500){S.seen.clear();t=0;}
    const r=calc(a,b);if(!S.seen.has(a+'-'+b)&&r.ok&&L.ok(r))break;}
  loadProblem(a,b);}
function loadProblem(a,b){S.a=a;S.b=b;S.seen.add(a+'-'+b);compute();reset();}

const head=`<div class="pv"><i></i>${[2,1,0].map(c=>`<div class="ch" data-col="${c}">${CN[c]}</div>`).join('')}</div>`;
const rowHTML=(id,cls,tag,tc)=>`<div class="pv" id="row${id}"><div class="tag ${tc}" id="tag${id}">${tag}</div>${[2,1,0].map(c=>`<div class="cell ${cls} c${c}" data-col="${c}"><div class="in"></div></div>`).join('')}</div>`;
$('#concrete').insertAdjacentHTML('beforeend',head+rowHTML('A','A','','a'));
$('#regroup').insertAdjacentHTML('beforeend',head+rowHTML('T','T','Taken','t')+`<div class="pv"><i></i>${[2,1,0].map(c=>`<div class="labw" data-col="${c}"><span class="lab" id="lab${c}"></span></div>`).join('')}</div>`);
$('#alg').innerHTML=`<div class="acol sign"><div class="ach">&nbsp;</div><div class="car"></div><div class="dg a">&nbsp;</div><div class="dg b">−</div><div class="dg ans"></div></div>`+
  [2,1,0].map(c=>`<div class="acol" data-col="${c}"><div class="ach">${CN[c]}</div><div class="car" id="car${c}"></div><div class="dg a" id="a${c}"></div><div class="dg b" id="b${c}"></div><div class="dg ans"><input id="in${c}" inputmode="none" maxlength="1" autocomplete="off" aria-label="${CN[c]} digit of the answer"></div></div>`).join('');
const cell=(r,c)=>$(`#row${r} .cell[data-col="${c}"] .in`);
const coach=$('#coach'),notes=$('#notes'),bMain=$('#bMain'),bChk=$('#bChk'),bNew=$('#bNew'),bReset=$('#bReset');

function layout(){
  const W=$('.left').clientWidth,fpr=innerWidth<720?3:4;
  const nH=A[2],nT=A[1]+(BW[1]?10:0),nO=A[0]+(BW[0]?10:0);
  const wH=nH?Math.min(nH,fpr)*10.7:0,wT=Math.min(nT,10)*1.5,wO=Math.min(nO,5)*1.5;
  const f=[Math.max(wH+1,6.5),Math.max(wT+1,7),Math.max(wO+1,6)];
  const u=Math.max(3.8,Math.min(9.6,(W-24-44-18)/(f[0]+f[1]+f[2])));
  S.u=u;const st=document.documentElement.style;
  st.setProperty('--u',u+'px');st.setProperty('--fpr',fpr);
  st.setProperty('--fH',f[0]+'fr');st.setProperty('--fT',f[1]+'fr');st.setProperty('--fO',f[2]+'fr');
}
function say(title,sub='',kind='info'){
  const ic={info:'👉',good:'✅',hint:'🤔',win:'🎉'}[kind];
  coach.className='coach '+(kind==='win'?'good':kind);
  coach.innerHTML=`<span class="ico">${ic}</span><div><b>${title}</b>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function prompt(ph){
  if(ph==='build')return S.hands?'Press Start, then tap the columns (or the + signs) to build the blocks yourself.':'Press Start and watch the blocks being built.';
  return 'Now write the answer in the boxes, then press Check Answer.';
}
function feedback(ph){
  const c=+ph.slice(-1),nx=S.phases[S.p],sub=nx==='write'?prompt('write'):'Get ready for the next step...';
  if(ph==='build')say(`Built! Blue shows ${S.a}.`,sub);
  else if(ph[0]==='r')say(`Great! 1 ${SING[c+1]} became 10 ${NAMES[c]}.`,sub,'good');
  else say(`${cur[c]} − ${B[c]} = ${R[c]} ${NAMES[c]} left.`,sub);
}
function setActive(c){$$('[data-col]').forEach(e=>e.classList.toggle('active',+e.dataset.col===c));}
function flash(c){$$(`[data-col="${c}"]`).forEach(e=>{e.classList.remove('hl');void e.offsetWidth;e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),2400);});}

/* ---------- hands-on steps ---------- */
const cl=(r,c)=>cell(r,c).parentElement;
const tapOn=(els,fn)=>els.forEach(e=>{e.classList.add('tapc');e.onclick=ev=>fn(e,ev);});
const tapOff=els=>els.forEach(e=>{e.classList.remove('tapc');e.onclick=null;const p=e.querySelector('.plus');if(p)p.remove();});
const ask=f=>new Promise(res=>{S.int=true;ui();f(()=>{S.int=false;ui();res();});});
function auto(el,n){const t=S.tok;(async()=>{for(let k=0;k<n;k++){await wait(450);if(S.tok!==t)return;el.click();}})();}
const free=(r,c)=>[...cell(r,c).children].find(x=>!x.classList.contains('moved'));
function buildStep(){return ask(done=>{
  const need=[...A];
  const msg=()=>say(`Build ${S.a} (blue)`,`Tap a column or its + to add blocks. Still to add: ${[2,1,0].filter(c=>need[c]).map(c=>need[c]+' '+NAMES[c]).join(', ')||'done'}`);
  [2,1,0].forEach(c=>{
    if(!need[c])return;const e=cl('A',c);
    e.insertAdjacentHTML('beforeend',`<button class="plus" aria-label="Add a ${SING[c]} block">+</button>`);
    tapOn([e],()=>{
      if(!need[c])return;need[c]--;cell('A',c).appendChild(mk(TYPES[c],'blue','pop'));
      if(!need[c])tapOff([e]);msg();
      if(!need.some(n=>n))setTimeout(done,500);
    });
    if(!S.hands)auto(e,need[c]);
  });
  msg();});}
function takeStep(c){return ask(done=>{
  let left=B[c];const tray=cell('T',c),e=cl('A',c);
  const msg=()=>say(`Take away ${B[c]} ${NAMES[c]}`,`Tap the blue ${NAMES[c]} to take them away. ${left} to go.`);
  msg();
  tapOn([e],()=>{
    const src=free('A',c);if(!src||!left)return;
    src.classList.add('moved');tray.appendChild(mk(TYPES[c],'orange','pop'));left--;msg();
    if(!left){tapOff([e]);setTimeout(done,500);}
  });
  if(!S.hands)auto(e,left);});}
const place=(k,r)=>{k.style.left=r.left+'px';k.style.top=r.top+'px';};
function move(k,from,to,dur,delay=0){
  const a=k.animate([{transform:'translate(0,0)'},{transform:`translate(${to.x-from.left}px,${to.y-from.top}px)`}],{duration:dur*SP,delay:delay*SP,easing:'cubic-bezier(.45,0,.2,1)',fill:'both'});
  return a.finished.then(()=>{k.style.left=to.x+'px';k.style.top=to.y+'px';a.cancel();});
}
async function breakAnim(src,c,to){
  const r=src.getBoundingClientRect();
  const big=src.cloneNode(true);big.classList.remove('moved','pop','tapc');big.classList.add('fly');big.style.visibility='';place(big,r);
  document.body.appendChild(big);src.style.visibility='hidden';src.classList.add('moved');
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=`1 ${SING[c+1]} = 10 ${NAMES[c]}`;
  Object.assign(bub.style,{left:(r.left+r.width/2)+'px',top:(r.top+r.height+10)+'px'});
  document.body.appendChild(bub);requestAnimationFrame(()=>bub.classList.add('in'));
  await big.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(-6deg) scale(1.12)'},{transform:'rotate(6deg) scale(1.15)'},{transform:'rotate(-5deg) scale(1.2)'},{transform:'rotate(0) scale(1.25)'}],{duration:800*SP,fill:'forwards'}).finished;
  const gs=[];for(let k=0;k<10;k++){const g=mk(TYPES[c],'green');g.style.visibility='hidden';to.appendChild(g);gs.push(g);}
  const ds=gs.map(g=>g.getBoundingClientRect()),w=ds[0].width,h=ds[0].height,cx=r.left+r.width/2-w/2,cy=r.top+r.height/2-h/2;
  const ks=gs.map(g=>{const k=g.cloneNode(true);k.classList.add('fly');k.style.visibility='';place(k,{left:cx,top:cy});document.body.appendChild(k);return k;});
  big.animate([{opacity:1},{opacity:0}],{duration:250*SP,fill:'forwards'});
  await Promise.all(ks.map((k,i)=>move(k,{left:cx,top:cy},{x:ds[i].left,y:ds[i].top},800,i*70)));
  gs.forEach(g=>g.style.visibility='');ks.forEach(k=>k.remove());big.remove();src.style.visibility='';
  bub.classList.remove('in');setTimeout(()=>bub.remove(),400);
}
function regStep(c){return ask(done=>{
  const to=cell('A',c),e=cl('A',c+1);
  say(`Not enough ${NAMES[c]}!`,`Tap 1 ${SING[c+1]} to trade it for 10 ${NAMES[c]}.`,'hint');
  tapOn([e],()=>{
    const src=free('A',c+1);if(!src)return;
    tapOff([e]);breakAnim(src,c,to).then(done);
  });
  if(!S.hands)auto(e,1);});}
const doPhase=ph=>ph==='build'?buildStep():ph[0]==='r'?regStep(+ph.slice(-1)):takeStep(+ph.slice(-1));
async function run(ph){
  const t=S.tok;S.busy=true;ui();
  if(ph!=='build')setActive(+ph.slice(-1));
  await doPhase(ph);
  if(S.tok!==t)return;
  S.done.add(ph);S.p++;refresh(true);
  const nx=S.phases[S.p];feedback(ph);
  if(nx&&nx!=='write'){await wait(1500);if(S.tok!==t)return;S.busy=false;return run(nx);}
  S.busy=false;ui();
}

/* ---------- synced view ---------- */
function setText(el,t,anim){
  if((el.dataset.v||'')===t)return;
  el.dataset.v=t;el.textContent=t;el.classList.toggle('on',!!t);
  if(anim&&t){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
}
function setCar(c,val,anim){
  const el=$('#car'+c);if((el.dataset.v||'')===val)return;
  el.dataset.v=val;el.innerHTML=val?`<span class="${anim?'pop':''}">${val}</span>`:'';
}
function refresh(anim){
  const d=S.done;cur=[...A];
  [0,1].forEach(c=>{if(d.has('reg'+c)){cur[c]+=10;cur[c+1]--;}});
  [0,1,2].forEach(c=>{
    const t=cur[c]!==A[c];setCar(c,t?String(cur[c]):'',anim);
    $('#a'+c).style.textDecoration=t?'line-through':'';
    setText($('#lab'+c),d.has('take'+c)?`${cur[c]} − ${B[c]} = ${R[c]} ${NAMES[c]} left`:'',anim);
  });
  const N=[];
  S.phases.forEach(p=>{if(!d.has(p))return;const c=+p.slice(-1);
    if(p==='build')N.push(`Start with ${S.a}`);
    else if(p[0]==='r')N.push(`${cur[c]-10} ${NAMES[c]} is not enough for ${B[c]}: trade 1 ${SING[c+1]} for 10 ${NAMES[c]}`);
    else if(p[0]==='t')N.push(`${cur[c]} − ${B[c]} = ${R[c]} ${NAMES[c]}`);});
  if(S.isSolved)N.push(`${S.a} − ${S.b} = ${S.total}`);
  notes.innerHTML=N.length?N.map((t,i)=>`<p class="${i===N.length-1?'last':''}">${t}</p>`).join(''):'<p class="ph">Your thinking appears here, step by step.</p>';
  const nxt=S.phases[S.p];
  setActive(S.isSolved||nxt==='build'||nxt==='write'?-1:+nxt.slice(-1));
}
function renderAbstract(){
  const sa=String(S.a),sb=String(S.b),need=String(S.total).length;
  [0,1,2].forEach(c=>{
    $('#a'+c).textContent=c<sa.length?sa[sa.length-1-c]:'';$('#a'+c).style.textDecoration='';
    $('#b'+c).textContent=c<sb.length?sb[sb.length-1-c]:'';
    const i=$('#in'+c);i.value='';i.className='';i.style.visibility=c<need?'visible':'hidden';
  });
  $('#tagA').textContent=S.a;
}
function ui(){
  const nxt=S.phases[S.p],b=S.busy;
  bMain.textContent=S.isSolved?'Next Problem ▸':'Start';
  bMain.disabled=!S.isSolved&&(b||S.p>0);
  bMain.classList.toggle('nudge',!b&&(S.isSolved||S.p===0));
  bChk.disabled=b||S.isSolved;
  bChk.classList.toggle('nudge',!b&&nxt==='write'&&!S.isSolved);
  bNew.disabled=b&&!S.int;bReset.disabled=b&&!S.int;
  $$('.chip').forEach(c=>c.disabled=b);
  const can=nxt==='write'&&!S.isSolved&&!b;
  $('#kp').hidden=!can;
  [0,1,2].forEach(c=>$('#in'+c).disabled=!can);
  const si=p=>p==='build'?0:p==='write'?4:1+ +p.slice(-1),cs=S.isSolved?9:si(nxt);
  $$('.stepper li').forEach((li,i)=>{
    const ph=S.phases.filter(p=>si(p)===i);
    const done=S.isSolved||(ph.length?ph.every(p=>S.done.has(p)):i<cs);
    li.classList.toggle('done',done);li.classList.toggle('cur',i===cs);
    li.querySelector('.num').textContent=done?'✓':i+1;
  });
}
function reset(){
  S.p=0;S.done=new Set();S.isSolved=false;S.busy=false;S.tok++;S.int=false;
  $$('.plus').forEach(e=>e.remove());$$('.fly,.bubble').forEach(e=>e.remove());
  $$('.cell').forEach(e=>{e.onclick=null;e.classList.remove('tapc');});
  $$('.in').forEach(e=>e.innerHTML='');
  $$('.lab').forEach(l=>{l.textContent='';l.dataset.v='';l.classList.remove('on');});
  $$('.car').forEach(c=>{c.innerHTML='';c.dataset.v='';});
  layout();renderAbstract();refresh(false);ui();
  $('#lvlName').textContent=LV[S.level].name;
  say(`Problem: ${S.a} − ${S.b}`,prompt('build'));
}
function confetti(){
  const r=$('#abstract').getBoundingClientRect(),cols=['#3b8fe6','#f7a823','#2fbf78','#ff6b8b','#8a63d2'];
  for(let i=0;i<36;i++){
    const d=document.createElement('i');d.className='conf';
    d.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height*.55}px;background:${cols[i%5]}`;
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,s=90+Math.random()*180;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*s}px,${Math.sin(a)*s+80}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:(900+Math.random()*500)*SP,easing:'cubic-bezier(.2,.7,.3,1)'}).finished.then(()=>d.remove());
  }
}
function onCheck(){
  if(S.busy||S.isSolved)return;
  if(S.phases[S.p]!=='write'){say('Let us finish the blocks first.','Keep going: tap the blocks as the coach says.','hint');return;}
  const need=[...Array(String(S.total).length).keys()],v=need.map(c=>$('#in'+c).value);
  const empty=need.find(c=>v[c]==='');
  if(empty!==undefined){flash(empty);say('Fill in every box.',`The ${NAMES[empty]} box is empty.`,'hint');$('#in'+empty).focus();return;}
  const bad=need.find(c=>+v[c]!==R[c]);
  if(bad===undefined){
    need.forEach(c=>$('#in'+c).classList.add('right'));
    S.isSolved=true;S.done.add('write');S.solved++;$('#solved').textContent=S.solved;
    const bits=[BW[0]?'1 ten became 10 ones':'',BW[1]?'1 hundred became 10 tens':''].filter(Boolean).join(' and ');
    refresh(true);ui();confetti();
    say(`Fantastic! ${S.a} − ${S.b} = ${S.total}`,(bits?bits+'. ':'')+'The blocks and the written answer match.','win');return;
  }
  const inp=$('#in'+bad);inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
  flash(bad);say(`Not quite yet. Check the ${NAMES[bad]} column.`,`Look at ${cur[bad]} − ${B[bad]} in the ${NAMES[bad]} column. Count what is left.`,'hint');
}

/* ---------- wiring ---------- */
bMain.onclick=()=>{if(S.busy)return;if(S.isSolved)newProblem();else if(S.p===0)run('build');};
bChk.onclick=onCheck;bNew.onclick=()=>{if(!S.busy||S.int)newProblem();};bReset.onclick=()=>{if(!S.busy||S.int)reset();};
$$('.chip[data-l]').forEach(ch=>ch.onclick=()=>{
  if(S.busy)return;S.level=+ch.dataset.l;
  $$('.chip[data-l]').forEach(x=>x.setAttribute('aria-pressed',String(x===ch)));newProblem();
});
[['mHands',true],['mWatch',false]].forEach(([id,v])=>$('#'+id).onclick=()=>{if(S.busy)return;S.hands=v;$('#mHands').setAttribute('aria-pressed',String(v));$('#mWatch').setAttribute('aria-pressed',String(!v));reset();});
[0,1,2].forEach(c=>{
  const i=$('#in'+c);
  i.addEventListener('input',()=>{
    i.value=i.value.replace(/\D/g,'').slice(-1);i.classList.remove('bad');
    if(i.value){const nx=$('#in'+(c+1));if(nx&&nx.style.visibility!=='hidden'&&!nx.disabled)nx.focus();}
  });
  i.addEventListener('keydown',e=>{
    if(e.key==='Enter')onCheck();
    if(e.key==='Backspace'&&!i.value){const pv=$('#in'+(c-1));if(pv)pv.focus();}
  });
});
const kp=$('#kp');
kp.innerHTML=[1,2,3,4,5,6,7,8,9,0].map(d=>`<button type="button" data-k="${d}">${d}</button>`).join('')+'<button type="button" data-k="x" aria-label="Delete">⌫</button>';
kp.addEventListener('mousedown',e=>e.preventDefault());
kp.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||S.busy||S.isSolved)return;
  const vis=[0,1,2].filter(c=>$('#in'+c).style.visibility!=='hidden'),a=document.activeElement;
  let c=a&&/^in\d$/.test(a.id)&&vis.includes(+a.id[2])?+a.id[2]:vis.find(c=>!$('#in'+c).value);
  if(c===undefined)c=vis[vis.length-1];
  const i=$('#in'+c);i.focus();
  if(b.dataset.k==='x'){
    if(i.value){i.value='';i.classList.remove('bad');}
    else if(c>0){const p=$('#in'+(c-1));p.value='';p.classList.remove('bad');p.focus();}
  }else{i.value=b.dataset.k;i.dispatchEvent(new Event('input'));}
});
const fsB=$('#fs'),de=document.documentElement,fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsB.style.display='none';
fsB.onclick=()=>{try{fsOn()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(de.requestFullscreen||de.webkitRequestFullscreen).call(de);}catch(e){}};
['fullscreenchange','webkitfullscreenchange'].forEach(v=>document.addEventListener(v,()=>{const o=!!fsOn();fsB.textContent=o?'✕':'⛶';fsB.title=fsB.ariaLabel=o?'Exit full screen':'Full screen';}));
let rt;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!S.busy)layout();},120);}).observe($('.left'));
loadProblem(75,38);
})();
</script>
</body>
